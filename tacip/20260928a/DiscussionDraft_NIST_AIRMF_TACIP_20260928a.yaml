- from: i1
  to: '1'
  type: incident_practice
  label: AI clinical decision-support model is deployed for risk prediction without verified, real-world performance acceptance criteria, causing clinicians and hospitals to rely on vendor-reported accuracy that does not hold under operational conditions.
- from: i1
  to: '2'
  type: incident_practice
  label: AI prediction model performs inconsistently across hospitals and care-timing contexts because robustness, calibration, and site-specific quality-of-service expectations were not validated before scaled clinical use.
- from: i1
  to: '9'
  type: incident_practice
  label: AI-generated alerts had poor positive predictive value, creating alert fatigue and reducing appropriate trust in the model’s outputs during high-consequence clinical decision-making.
- from: i2
  to: '1'
  type: incident_practice
  label: An AI-enabled claims-review process is optimized around denial likelihood or cost-control objectives rather than validated patient-care, medical-necessity, and fairness requirements, resulting in automated decisions misaligned with the system’s intended healthcare purpose.
- from: i2
  to: '3'
  type: incident_practice
  label: A high-consequence AI-assisted claims-review workflow issues or supports post-acute-care denials without defined risk thresholds, independent review gates, or oversight controls before the decision affects patient access to care.
- from: i2
  to: '4'
  type: incident_practice
  label: AI-generated post-acute-care recommendation is allowed to displace treating-physician judgment, leaving no reliable emergency override or recovery path when the automated output conflicts with clinical judgment.
- from: i2
  to: '8'
  type: incident_practice
  label: AI-assisted claims-review decisions produce systematic patterns of inappropriate care denials, but no procedures exist to investigate AI decision behavior, identify affected patients, assess harm at scale, and coordinate timely remediation before significant patient-care impacts occur.
- from: i2
  to: '9'
  type: incident_practice
  label: Business and clinical users are insufficiently trained to recognize when AI-enabled claims-review outputs reflect an objective other than clinical appropriateness, such as cost or the likelihood that a decision will be challenged.
- from: i3
  to: '2'
  type: incident_practice
  label: Autonomous-vehicle AI system is deployed without targeted validation for rare but severe post-collision failure modes, including scenarios where a pedestrian or object remains beneath the vehicle after impact.
- from: i3
  to: '3'
  type: incident_practice
  label: Autonomous-vehicle AI planning system continues executing a movement maneuver after detecting a collision, without a deterministic fail-safe state that prevents additional motion when a person or object may be trapped underneath.
- from: i3
  to: '8'
  type: incident_practice
  label: Organization fails to perform and disclose a complete AI-aware incident analysis after an autonomous-vehicle harm event, omitting critical AI behavior needed by regulators to understand the full hazard sequence.
- from: i3
  to: '12'
  type: incident_practice
  label: Autonomous system executes AI-generated direct-control logic for vehicle movement without deterministic verification that the planned maneuver is safe in the current hazardous state.
- from: i4
  to: '1'
  type: incident_practice
  label: Facial-recognition system is used to support a custodial arrest without validated accuracy, evidentiary, and consequence-calibrated acceptance requirements for law-enforcement use.
- from: i4
  to: '2'
  type: incident_practice
  label: Facial-recognition system’s false-match performance under degraded real-world image conditions is not tested or validated before its output is relied on in a high-consequence criminal investigation.
- from: i4
  to: '3'
  type: incident_practice
  label: Probabilistic facial-recognition match is treated as sufficient basis for a suspect identification without mandatory corroborating evidence, defined confidence thresholds, or multi-party oversight before arrest.
- from: i4
  to: '9'
  type: incident_practice
  label: Investigators over-trust an AI-generated facial-recognition match and treat the system output as determinative rather than as an uncertain lead requiring corroboration and human review.
- from: i5
  to: '1'
  type: incident_practice
  label: No validated contextual-accuracy benchmark existed for the chatbot's handling of the airline's own published policies before it was deployed publicly.
- from: i5
  to: '2'
  type: incident_practice
  label: AI chatbot fabricated a detail of the airline's bereavement-fare policy (that it could be applied for retroactively) that directly contradicted the airline's actual published policy.
- from: i5
  to: '12'
  type: incident_practice
  label: AI chatbot produces policy guidance that is not validated against authoritative business rules, causing users to rely on an AI-generated outcome that conflicts with the organization’s actual published policy.
- from: i6
  to: '1'
  type: incident_practice
  label: A self-learning ML risk-classification model was fielded by the Dutch tax authority to flag childcare-benefit applications for fraud, using nationality as one of its risk factors, with no pre-deployment fairness or human-rights impact assessment.
- from: i6
  to: '3'
  type: incident_practice
  label: Once an application was flagged by the model, benefits were automatically discontinued and full repayment demanded, in many cases with minimal further human assessment before the harm to the family occurred.
- from: i6
  to: '8'
  type: incident_practice
  label: AI-driven fraud-risk classifications generate widespread erroneous benefit-enforcement actions, but the organization lacks procedures to detect systemic model-driven harm, reconstruct decision pathways, identify impacted populations, and coordinate corrective action before large-scale public harm occurs.
- from: i6
  to: '9'
  type: incident_practice
  label: Officials over-trust AI-generated fraud-risk flags and treat them as determinative findings, causing families to be penalized without sufficient independent review, fact-checking, or calibrated understanding of model uncertainty.
- from: i7
  to: '1'
  type: incident_practice
  label: An AI driving system is tested on public roads without an established safety case, acceptance benchmarks, or defined handling of its known functional limitations.
- from: i7
  to: '3'
  type: incident_practice
  label: The AI classifies the pedestrian inconsistently and its emergency-braking response is suppressed by design, with no bounded safe fallback under uncertainty.
- {from: i7, to: '4', type: incident_practice, label: The AI does not alert the human to take over when it cannot handle the situation.}
- {from: i7, to: '9', type: incident_practice, label: The safety operator over-trusts the AI and disengages from monitoring (automation complacency).}
- from: i8
  to: '2'
  type: incident_practice
  label: AI-mediated pipeline scheduling or operational-support function depends on compromised IT systems without validated resilience expectations, causing loss of confidence in operational integrity and triggering precautionary disruption of fuel-delivery operations.
- from: i8
  to: '5'
  type: incident_practice
  label: AI system has access to the VPN account or direct access to IT/OT operations. One agent's credential is phished, stolen, or left over-scoped, causing disruption in the pipeline.
- from: i8
  to: '11'
  type: incident_practice
  label: AI-supported pipeline operation is taken offline after a compromise, and the absence of AI-aware continuity and trusted-state recovery planning prolongs disruption to mission-critical fuel distribution.
- {from: i9, to: '6', type: incident_practice, label: 'A trusted vendor ships a poisoned model, tampered weights, or an AI-generated build component through its signed update channel.'}
- {from: i9, to: '7', type: incident_practice, label: The tainted model/component is now deployed across many internal systems that fine-tune on or call it.}
- {from: i9, to: '12', type: incident_practice, label: AI generates build code/configuration inside the pipeline and that machine-authored logic carries a flaw or backdoor.}
- from: i10
  to: '5'
  type: incident_practice
  label: Unauthorized or shadow AI agent executes with excessive privilege in an unvetted environment and persists after remediation, enabling continued attacker access despite patching or cleanup efforts.
- from: i10
  to: '7'
  type: incident_practice
  label: A locally hosted AI model or serving component with unverified provenance is exploited and used to maintain persistent unauthorized logic inside the enterprise environment.
- from: i11
  to: '5'
  type: incident_practice
  label: AI-enabled management agent retains broad standing privilege across multiple customer environments, allowing a single compromise to propagate malicious actions or ransomware at downstream scale.
- from: i11
  to: '6'
  type: incident_practice
  label: Trusted AI orchestration or remote-management platform in the external supply chain is compromised, enabling attackers to distribute malicious activity across dependent tenants, service providers, or downstream customers.
- {from: i12, to: '2', type: incident_practice, label: The compromise cascades to a total lockout of all clinical systems.}
- {from: i12, to: '5', type: incident_practice, label: 'A compromised identity/agent escalates and moves laterally across ~70,000 devices.'}
- from: i12
  to: '8'
  type: incident_practice
  label: A compromise of AI-enabled healthcare systems propagates across clinical operations, but responders lack procedures to identify affected AI services, assess impacts to patient-care functions, coordinate recovery priorities, and investigate how the disruption spread through interconnected systems.
- {from: i12, to: '11', type: incident_practice, label: 'All IT-driven clinical systems (including any AI) are down, affecting healthcare services.'}
- from: i13
  to: '2'
  type: incident_practice
  label: A highly concentrated AI-mediated claims and payment clearinghouse lacks validated availability and resilience expectations, causing widespread healthcare transaction disruption when the service becomes unavailable.
- {from: i13, to: '5', type: incident_practice, label: An AI/agent access path to the clearinghouse lacks MFA/least-privilege and is compromised.}
- from: i13
  to: '8'
  type: incident_practice
  label: Compromise of a highly concentrated AI-mediated healthcare transaction platform disrupts dependent organizations, but the organization lacks procedures to assess ecosystem-wide impacts, coordinate incident response, prioritize restoration efforts, and communicate operational consequences to affected stakeholders.
- from: i13
  to: '11'
  type: incident_practice
  label: An AI-mediated claims and payment-processing service lacks effective continuity alternatives, causing prolonged transaction outages and financial disruption for dependent healthcare providers.
- {from: i14, to: '3', type: incident_practice, label: An AI agent can write chemical-dosing setpoints; it (or an attacker acting through it) drives sodium hydroxide to a dangerous level.}
- {from: i14, to: '4', type: incident_practice, label: The AI's setpoint action must be caught and reversed in real time.}
- from: i14
  to: '5'
  type: incident_practice
  label: AI-managed or agent-generated credentials for OT interfaces are weak, default, or insufficiently governed, allowing exposed water-system devices to be accessed and manipulated by unauthorized actors.
- from: i15
  to: '3'
  type: incident_practice
  label: An agent with authority to generate or modify control logic installs logic that does not perform the required function, with no boundary outside the device positioned to detect that it has stopped doing so.
- from: i15
  to: '4'
  type: incident_practice
  label: The interface operators would use to override the system is itself disabled, and the display they would read is replaced, so intervention depends on a path independent of the affected device.
- {from: i15, to: '5', type: incident_practice, label: Internet-exposed AI/OT devices or agents run on default or weak credentials.}
- {from: i16, to: '3', type: incident_practice, label: An agent with breaker-control authority (or an attacker through it) opens breakers.}
- {from: i16, to: '4', type: incident_practice, label: The control layer led by AI is issuing hostile breaker commands and must be overridden.}
- {from: i16, to: '5', type: incident_practice, label: Phished credentials/agent identities give access to the SCADA/control network.}
- {from: i16, to: '11', type: incident_practice, label: Automated control is untrusted and grid operation must continue when AI responsible for operational actions fails.}
- {from: i17, to: '3', type: incident_practice, label: Autonomous AI logic issues grid breaker commands over ICS protocols.}
- {from: i17, to: '4', type: incident_practice, label: The control layer operated by AI is autonomously opening breakers and must be overridden.}
- from: i17
  to: '5'
  type: incident_practice
  label: Compromised AI or agent identity with trusted access to the control network issues unauthorized breaker commands, enabling automated manipulation of grid equipment through legitimate operational pathways.
- from: i17
  to: '11'
  type: incident_practice
  label: AI-supported grid-control operations become unavailable or untrusted during an automated attack, and the absence of AI-aware continuity procedures prevents reliable transition to safe manual or alternate operating modes.
- {from: i18, to: '2', type: incident_practice, label: 'An AI-enabled single push bricks a whole modem fleet, with cross-border spillover to other operators.'}
- {from: i18, to: '5', type: incident_practice, label: Management appliance network access lets an agent/actor push a destructive command fleet-wide.}
- from: i18
  to: '6'
  type: incident_practice
  label: Compromised third-party AI management plane or appliance becomes the entry point for fleet-scale destructive commands, disrupting downstream operational assets that depend on the affected communications service.
- from: i18
  to: '11'
  type: incident_practice
  label: AI-supported remote-control operations for dependent assets lose connectivity, and inadequate continuity planning leaves operators unable to maintain or restore mission functions during the communications outage.
- {from: i19, to: '5', type: incident_practice, label: An actor abuses valid accounts/agent identities and living-off-the-land techniques to persist stealthily.}
- from: i19
  to: '7'
  type: incident_practice
  label: End-of-life or unmaintained AI tools and agents remain inside the environment as untrusted internal supply-chain artifacts, increasing exposure and enabling stealthy persistence within critical-infrastructure systems.
- {from: i19, to: '10', type: incident_practice, label: The pre-positioned presence stays invisible because logging of AI systems is thin.}
- {from: i20, to: '5', type: incident_practice, label: Harvested credentials/agent identities enable lateral movement to the intended victims.}
- {from: i20, to: '6', type: incident_practice, label: Trusted but less-secure third-party AI suppliers (or their AI tools) are used as staging pivots toward the real targets.}
- from: i21
  to: '5'
  type: incident_practice
  label: AI-operated or agent-managed network devices are reachable through exposed or weak authentication paths, allowing attackers to compromise the devices and use them as persistent infrastructure.
- {from: i21, to: '7', type: incident_practice, label: Org-controlled network devices run tampered firmware/agent code.}
- {from: i22, to: '5', type: incident_practice, label: A malicious persistent agent runs on org-controlled mobile devices with excessive access.}
- from: i22
  to: '7'
  type: incident_practice
  label: Unauthorized agent code persists on managed operational devices without trusted provenance or integrity validation, enabling continued access and exfiltration of sensitive operational data.
- from: i23
  to: '5'
  type: incident_practice
  label: An internet-facing AI or agent access gateway is exploited to inherit excessive operational privileges, forcing disconnection of port networks and disrupting land-side cargo movement.
- from: i24
  to: '2'
  type: incident_practice
  label: An AI-supported blast-furnace control or shutdown function fails to meet robustness and safe-operation expectations, preventing a controlled shutdown and contributing to physical equipment damage.
- from: i24
  to: '3'
  type: incident_practice
  label: AI-enabled furnace-control behavior lacks defined risk limits, oversight, and fail-safe governance, allowing manipulated or disrupted control actions to cause unsafe physical operating conditions.
