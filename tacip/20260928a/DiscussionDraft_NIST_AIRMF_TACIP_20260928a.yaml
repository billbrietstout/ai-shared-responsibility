  glossary:
  - id: term:Human oversight
    term: Human oversight
    definition: 'An umbrella term for arrangements by which people remain responsible for an AI system''s behavior in operation. It denotes a category, not a single control, and comprises four distinct objects defined below: oversight mode, oversight capacity, oversight threshold and oversight authority.'
    candidate_references: ISO/IEC DIS 42105, Guidance for Human Oversight of AI Systems. ISO/IEC TS 8200:2024, Controllability of Automated Systems.
  - id: term:Oversight mode
    term: Oversight mode
    definition: 'The regime governing how a person participates in an AI system''s decisions: human-in-the-loop (approval required before action), human-on-the-loop (action proceeds, with intervention capability retained), or human-out-of-the-loop (autonomous execution with retrospective review). Task 4.5: Define operational regimes for human-on-the-loop and human-out-of-the-loop operation defines the boundaries between them.'
    parent: term:Human oversight
    candidate_references: DHS/CISA Principles for the Secure Integration of AI in Operational Technology, Section 4.2
  - id: term:Oversight capacity
    term: Oversight capacity
    definition: The finite human attention available to exercise oversight, measured across all AI systems drawing on the same pool of people rather than per system. Capacity is exhaustible, is consumed concurrently by every system an operator supervises, and can be saturated by a correlated event even where each system's individual demand is manageable.
    parent: term:Human oversight
    candidate_references: EEMUA Publication 191
  - id: term:Oversight threshold
    term: Oversight threshold
    definition: 'The point beyond which a given oversight mode ceases to be effective: where the interval between an anomaly and an irreversible consequence is shorter than what human intervention can be relied upon to achieve. Implementation 4.5.1: Define engineering time-constant thresholds defines how these are established.'
    parent: term:Human oversight
    candidate_references: ISA-84 / IEC 61511
  - id: term:Oversight authority
    term: Oversight authority
    definition: 'The named, non-delegable authority to set the oversight mode, to step it up or down, and to revoke the operating envelope. Distinct from the ability to intervene in a particular action: authority persists in regimes where real-time intervention is infeasible.'
    parent: term:Human oversight
  - id: term:Industrial control system (ICS)
    term: Industrial control system (ICS)
    definition: A control system that monitors and manipulates physical processes, such as supervisory control and data acquisition (SCADA) systems, distributed control systems (DCS) and programmable logic controllers (PLCs), made up of control components that act together to achieve an industrial objective. ICS are a subset of operational technology (OT), which also includes systems such as building automation and physical access control. In emergency management and public safety, ICS more commonly means the Incident Command System, the standardized incident management structure within the National Incident Management System (NIMS). This profile does not use ICS in that sense.
    candidate_references: NIST SP 800-82r3, Guide to Operational Technology (OT) Security, Appendix B (Glossary), entries for "industrial control system" and "operational technology".
  - id: term:Zero trust
    term: Zero trust
    definition: 'A cybersecurity approach in which no implicit trust is granted to users, devices or services based solely on their network location or ownership, and access to each resource is authenticated and authorized separately. This profile applies the underlying principle, that trust is verified at each boundary rather than assumed, to AI risk more generally. The extension is in what is not assumed: in cybersecurity, chiefly that a requester is who it claims to be and is permitted to act; here, also that a legitimate, uncompromised AI system is behaving as intended. An AI system''s outputs, actions and inputs therefore warrant verification where they cross into other systems, physical processes and human decisions, whether a departure from expected behavior arises from compromise, malfunction or a change in operating conditions. For example, an AI agent holding valid credentials is still authorized action by action (Implementation 5.2.2: Action-level, context-aware authorization policies), and guardrails independent of the AI system check its outputs before they reach a physical process (Task 3.2: Implement independent guardrails (“safety wrappers”) for AI outputs).'
    candidate_references: NIST SP 800-207, Zero Trust Architecture; Adapting Zero Trust Principles to Operational Technology (CISA, DoW, DOE, 2026)
