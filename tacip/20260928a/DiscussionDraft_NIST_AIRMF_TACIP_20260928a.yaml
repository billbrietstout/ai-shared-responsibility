  characteristics:
  - {id: 'char:Valid', name: Valid, gloss: 'the right system for this use, established for this deployment', group: 'Does it do the correct thing?'}
  - {id: 'char:Accurate', name: Accurate, gloss: how well outputs agree with a known or accepted reference, group: 'Does it do the correct thing?'}
  - {id: 'char:Bias Managed', name: Bias Managed, gloss: systematic error identified and deliberately handled, group: 'Does it do the correct thing?'}
  - {id: 'char:Reliable', name: Reliable, gloss: 'performs as required over time, in expected conditions and use', group: 'Does it keep doing the correct thing, particularly as conditions change?'}
  - id: char:Robust
    name: Robust
    gloss: keeps performing and limits harm when conditions or use go beyond expectations
    group: Does it keep doing the correct thing, particularly as conditions change?
  - id: char:Resilient
    name: Resilient
    gloss: degrades gracefully when it must and maintains the ability to resume operation
    group: Does it keep doing the correct thing, particularly as conditions change?
  - {id: 'char:Safe', name: Safe, gloss: 'avoid harm to people, property or environment, in defined conditions', group: 'Does it avoid unintentional or deliberate harm?'}
  - {id: 'char:Secure', name: Secure, gloss: withstands attack, group: 'Does it avoid unintentional or deliberate harm?'}
  - {id: 'char:Transparent', name: Transparent, gloss: the information exists and can be obtained, group: 'Does it allow its behavior to be observed, understood, and accounted for?'}
  - id: char:Explainable & Interpretable
    name: Explainable & Interpretable
    gloss: what the output means, and how it was reached
    group: Does it allow its behavior to be observed, understood, and accounted for?
  - {id: 'char:Accountable', name: Accountable, gloss: responsibility is named and can be enforced, group: 'Does it allow its behavior to be observed, understood, and accounted for?'}
  - {id: 'char:Privacy-Enhanced', name: Privacy-Enhanced, gloss: sensitive data stays contained, group: 'Does it meet its obligations to those who depend on it?'}
  - {id: 'char:Fair', name: Fair, gloss: service does not degrade for some of those it affects, group: 'Does it meet its obligations to those who depend on it?'}
  rmf_subcategories:
  - id: rmf:GOVERN 1.2
    subcategory: GOVERN 1.2
    'on': on defining trustworthy AI policies
    statement: The characteristics of trustworthy AI are integrated into organizational policies, processes, procedures, and practices
  - id: rmf:GOVERN 1.3
    subcategory: GOVERN 1.3
    'on': on establishing risk management processes
    statement: Processes, procedures, and practices are in place to determine the needed level of risk management activities based on the organization’s risk tolerance
  - id: rmf:GOVERN 1.5
    subcategory: GOVERN 1.5
    'on': on establishing monitoring and review processes
    statement: Ongoing monitoring and periodic review of the risk management process and its outcomes are planned and organizational roles and responsibilities clearly defined, including determining the frequency of periodic review
  - id: rmf:GOVERN 1.6
    subcategory: GOVERN 1.6
    'on': on building the AI inventory
    statement: Mechanisms are in place to inventory AI systems and are resourced according to organizational risk priorities
  - id: rmf:GOVERN 1.7
    subcategory: GOVERN 1.7
    'on': on decommissioning and phasing out AI systems
    statement: Processes and procedures are in place for decommissioning and phasing out AI systems safely and in a manner that does not increase risks or decrease the organization’s trustworthiness
  - id: rmf:GOVERN 2.1
    subcategory: GOVERN 2.1
    'on': on establishing roles and responsibilities
    statement: Roles and responsibilities and lines of communication related to mapping, measuring, and managing AI risks are documented and are clear to individuals and teams throughout the organization
  - id: rmf:GOVERN 3.2
    subcategory: GOVERN 3.2
    'on': on defining human-AI configuration
    statement: Policies and procedures are in place to define and differentiate roles and responsibilities for human-AI configurations and oversight of AI systems
  - id: rmf:GOVERN 4.1
    subcategory: GOVERN 4.1
    'on': on establishing a risk-aware culture
    statement: Organizational policies and practices are in place to foster a critical thinking and safety-first mindset in the design, development, deployment, and uses of AI systems to minimize potential negative impacts
  - id: rmf:GOVERN 4.2
    subcategory: GOVERN 4.2
    'on': on documenting impact
    statement: Organizational teams document the risks and potential impacts of the AI technology they design, develop, deploy, evaluate, and use, and they communicate about the impacts more broadly
  - id: rmf:GOVERN 4.3
    subcategory: GOVERN 4.3
    'on': on enabling AI testing, incident identification, and information sharing
    statement: Organizational practices are in place to enable AI testing, identification of incidents, and information sharing
  - id: rmf:GOVERN 6.1
    subcategory: GOVERN 6.1
    'on': on establishing third-party risk management processes
    statement: Policies and procedures are in place that address AI risks associated with third-party entities, including risks of infringement of a third-party’s intellectual property or other rights
  - id: rmf:GOVERN 6.2
    subcategory: GOVERN 6.2
    'on': on establishing contingency plans for critical third parties
    statement: Contingency processes are in place to handle failures or incidents in third-party data or AI systems deemed to be high-risk
  - id: rmf:MAP 1.1
    subcategory: MAP 1.1
    'on': on defining operating context
    statement: 'Intended purposes, potentially beneficial uses, contextspecific laws, norms and expectations, and prospective settings in which the AI system will be deployed are understood and documented. Considerations include: the specific set or types of users along with their expectations; potential positive and negative impacts of system uses to individuals, communities, organizations, society, and the planet; assumptions and related limitations about AI system purposes, uses, and risks across the development or product AI lifecycle; and related TEVV and system metrics'
  - id: rmf:MAP 1.4
    subcategory: MAP 1.4
    'on': on defining AI business value
    statement: The business value or context of business use has been clearly defined or – in the case of assessing existing AI systems – re-evaluated
  - {id: 'rmf:MAP 1.5', subcategory: MAP 1.5, 'on': on documenting risk tolerances, statement: Organizational risk tolerances are determined and documented}
  - id: rmf:MAP 1.6
    subcategory: MAP 1.6
    'on': on defining and communicating user requirements
    statement: System requirements (e.g., “the system shall respect the privacy of its users”) are elicited from and understood by relevant AI actors. Design decisions take socio-technical implications into account to address AI risks
  - id: rmf:MAP 2.1
    subcategory: MAP 2.1
    'on': on defining AI system task and methodology
    statement: The specific tasks and methods used to implement the tasks that the AI system will support are defined (e.g., classifiers, generative models, recommenders)
  - id: rmf:MAP 2.2
    subcategory: MAP 2.2
    'on': on defining AI system utility and oversight needs
    statement: Information about the AI system’s knowledge limits and how system output may be utilized and overseen by humans is documented. Documentation provides sufficient information to assist relevant AI actors when making decisions and taking subsequent actions
  - id: rmf:MAP 2.3
    subcategory: MAP 2.3
    'on': on applying scientific methodologies
    statement: Scientific integrity and TEVV considerations are identified and documented, including those related to experimental design, data collection and selection (e.g., availability, representativeness, suitability), system trustworthiness, and construct validation
  - {id: 'rmf:MAP 3.1', subcategory: MAP 3.1, 'on': on understanding benefits, statement: Potential benefits of intended AI system functionality and performance are examined and documented}
  - id: rmf:MAP 3.2
    subcategory: MAP 3.2
    'on': on understanding costs
    statement: Potential costs, including non-monetary costs, which result from expected or realized AI errors or system functionality and trustworthiness – as connected to organizational risk tolerance – are examined and documented
  - id: rmf:MAP 3.3
    subcategory: MAP 3.3
    'on': on documenting application scope of the AI system
    statement: Targeted application scope is specified and documented based on the system’s capability, established context, and AI system categorization
  - id: rmf:MAP 3.4
    subcategory: MAP 3.4
    'on': on defining operator proficiency
    statement: Processes for operator and practitioner proficiency with AI system performance and trustworthiness – and relevant technical standards and certifications – are defined, assessed, and documented
  - id: rmf:MAP 3.5
    subcategory: MAP 3.5
    'on': on establishing human oversight processes
    statement: Processes for human oversight are defined, assessed, and documented in accordance with organizational policies from the GOVERN function
  - id: rmf:MAP 4.1
    subcategory: MAP 4.1
    'on': on understanding AI component-level risks
    statement: Approaches for mapping AI technology and legal risks of its components – including the use of third-party data or software – are in place, followed, and documented, as are risks of infringement of a third party’s intellectual property or other rights
  - id: rmf:MAP 4.2
    subcategory: MAP 4.2
    'on': on establishing risk controls for AI system components
    statement: Internal risk controls for components of the AI system, including third-party AI technologies, are identified and documented
  - id: rmf:MAP 5.1
    subcategory: MAP 5.1
    'on': on identifying risk likelihood and impacts
    statement: Likelihood and magnitude of each identified impact (both potentially beneficial and harmful) based on expected use, past uses of AI systems in similar contexts, public incident reports, feedback from those external to the team that developed or deployed the AI system, or other data are identified and documented
  - id: rmf:MEASURE 1.1
    subcategory: MEASURE 1.1
    'on': on selecting and prioritizing measurements
    statement: Approaches and metrics for measurement of AI risks enumerated during the MAP function are selected for implementation starting with the most significant AI risks. The risks or trustworthiness characteristics that will not – or cannot – be measured are properly documented
  - id: rmf:MEASURE 1.2
    subcategory: MEASURE 1.2
    'on': on continuously improving measurement
    statement: Appropriateness of AI metrics and effectiveness of existing controls are regularly assessed and updated, including reports of errors and potential impacts on affected communities
  - {id: 'rmf:MEASURE 2.1', subcategory: MEASURE 2.1, 'on': on documenting measurement approaches, statement: 'Test sets, metrics, and details about the tools used during TEVV are documented'}
  - id: rmf:MEASURE 2.3
    subcategory: MEASURE 2.3
    'on': on ensuring realistic measurement
    statement: AI system performance or assurance criteria are measured qualitatively or quantitatively and demonstrated for conditions similar to deployment setting(s). Measures are documented
  - id: rmf:MEASURE 2.4
    subcategory: MEASURE 2.4
    'on': on monitoring deployed AI systems
    statement: The functionality and behavior of the AI system and its components – as identified in the MAP function – are monitored when in production
  - id: rmf:MEASURE 2.5
    subcategory: MEASURE 2.5
    'on': on measuring validity and reliability
    statement: The AI system to be deployed is demonstrated to be valid and reliable. Limitations of the generalizability beyond the conditions under which the technology was developed are documented
  - id: rmf:MEASURE 2.6
    subcategory: MEASURE 2.6
    'on': on measuring safety
    statement: The AI system is evaluated regularly for safety risks – as identified in theMAP function. The AI system to be deployed is demonstrated to be safe, its residual negative risk does not exceed the risk tolerance, and it can fail safely, particularly if made to operate beyond its knowledge limits. Safety metrics reflect system reliability and robustness, real-time monitoring, and response times for AI system failures
  - id: rmf:MEASURE 2.7
    subcategory: MEASURE 2.7
    'on': on measuring security and resiliency
    statement: AI system security and resilience – as identified in the MAP function – are evaluated and documented
  - id: rmf:MEASURE 2.9
    subcategory: MEASURE 2.9
    'on': on measuring interpretability and explainability
    statement: The AI model is explained, validated, and documented, and AI system output is interpreted within its context – as identified in the MAP function – to inform responsible use and governance
  - {id: 'rmf:MEASURE 2.10', subcategory: MEASURE 2.10, 'on': on measuring privacy, statement: Privacy risk of the AI system – as identified in the MAP function – is examined and documented}
  - {id: 'rmf:MEASURE 2.11', subcategory: MEASURE 2.11, 'on': on measuring fairness and bias, statement: Fairness and bias – as identified in the MAP function – are evaluated and results are documented}
  - id: rmf:MEASURE 3.1
    subcategory: MEASURE 3.1
    'on': on tracking known and emerging risks
    statement: Approaches, personnel, and documentation are in place to regularly identify and track existing, unanticipated, and emergent AI risks based on factors such as intended and actual performance in deployed contexts
  - id: rmf:MEASURE 4.1
    subcategory: MEASURE 4.1
    'on': on gathering feedback on measurement approaches
    statement: Measurement approaches for identifying AI risks are connected to deployment context(s) and informed through consultation with domain experts and other end users. Approaches are documented
  - id: rmf:MANAGE 1.1
    subcategory: MANAGE 1.1
    'on': on authorizing the system
    statement: A determination is made as to whether the AI system achieves its intended purposes and stated objectives and whether its development or deployment should proceed
  - id: rmf:MANAGE 2.1
    subcategory: MANAGE 2.1
    'on': on allocating resources
    statement: Resources required to manage AI risks are taken into account – along with viable non-AI alternative systems, approaches, or methods – to reduce the magnitude or likelihood of potential impacts
  - {id: 'rmf:MANAGE 2.2', subcategory: MANAGE 2.2, 'on': on ensuring sustained value, statement: Mechanisms are in place and applied to sustain the value of deployed AI systems}
  - {id: 'rmf:MANAGE 2.3', subcategory: MANAGE 2.3, 'on': on responding to emerging risks, statement: Procedures are followed to respond to and recover from a previously unknown risk when it is identified}
  - id: rmf:MANAGE 2.4
    subcategory: MANAGE 2.4
    'on': on decommissioning or superseding AI systems
    statement: Mechanisms are in place and applied, and responsibilities are assigned and understood, to supersede, disengage, or deactivate AI systems that demonstrate performance or outcomes inconsistent with intended use
  - id: rmf:MANAGE 3.1
    subcategory: MANAGE 3.1
    'on': on monitoring and responding to third-party risks
    statement: AI risks and benefits from third-party resources are regularly monitored, and risk controls are applied and documented
  - id: rmf:MANAGE 3.2
    subcategory: MANAGE 3.2
    'on': on monitoring pre-trained model risks
    statement: Pre-trained models which are used for development are monitored as part of AI system regular monitoring and maintenance
  - id: rmf:MANAGE 4.1
    subcategory: MANAGE 4.1
    'on': on post-deployment monitoring plans including decommissioning
    statement: Post-deployment AI system monitoring plans are implemented, including mechanisms for capturing and evaluating input from users and other relevant AI actors, appeal and override, decommissioning, incident response, recovery, and change management
  - id: rmf:MANAGE 4.3
    subcategory: MANAGE 4.3
    'on': on incident response
    statement: Incidents and errors are communicated to relevant AI actors, including affected communities. Processes for tracking, responding to, and recovering from incidents and errors are followed and documented
