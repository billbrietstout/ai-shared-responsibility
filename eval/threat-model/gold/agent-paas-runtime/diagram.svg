<svg xmlns="http://www.w3.org/2000/svg" width="1176" height="488" viewBox="0 0 1176 488">
<rect width="100%" height="100%" fill="#f8fafc"/>
<text x="28" y="36" font-family="Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#0f172a">Agent-PaaS orchestration runtime</text>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/></marker></defs>
<text x="28" y="56" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#64748b">Provider of the orchestration runtime. Tenant developers supply agent definitions. The runtime executes LLM calls and brokers tools.</text>
