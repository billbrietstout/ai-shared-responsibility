<svg xmlns="http://www.w3.org/2000/svg" width="1176" height="308" viewBox="0 0 1176 308">
<rect width="100%" height="100%" fill="#f8fafc"/>
<text x="28" y="36" font-family="Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#0f172a">Traditional account service</text>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/></marker></defs>
<text x="28" y="56" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#64748b">Application team that owns the API gateway, account service, and customer database.</text>
<rect x="28" y="72" width="264" height="120" rx="8" fill="#fff" stroke="#94a3b8" data-id="internet" data-kind="trust-boundary"/>
<text x="40" y="100" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#1e3a8a">Internet</text>
<rect x="308" y="72" width="264" height="180" rx="8" fill="#fff" stroke="#94a3b8" data-id="application" data-kind="trust-boundary"/>
<text x="320" y="100" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#1e3a8a">Application zone</text>
<rect x="588" y="72" width="264" height="180" rx="8" fill="#fff" stroke="#94a3b8" data-id="data" data-kind="trust-boundary"/>
<text x="600" y="100" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#1e3a8a">Data zone</text>
<rect x="868" y="72" width="264" height="120" rx="8" fill="#fff" stroke="#94a3b8" data-id="provider" data-kind="trust-boundary"/>
<text x="880" y="100" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#1e3a8a">External provider</text>
<rect x="44" y="120" width="232" height="44" rx="6" fill="#dcfce7" stroke="#334155" data-id="customer" data-kind="component"/>
<text x="160.0" y="146.0" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#0f172a">Customer</text>
<rect x="324" y="120" width="232" height="44" rx="6" fill="#e0e7ff" stroke="#334155" data-id="api-gateway" data-kind="component"/>
<text x="440.0" y="146.0" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#0f172a">API gateway</text>
<rect x="324" y="180" width="232" height="44" rx="6" fill="#e0e7ff" stroke="#334155" data-id="account-service" data-kind="component"/>
<text x="440.0" y="206.0" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#0f172a">Account service</text>
<rect x="604" y="120" width="232" height="44" rx="6" fill="#fef3c7" stroke="#334155" data-id="customer-db" data-kind="component"/>
<text x="720.0" y="146.0" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#0f172a">Customer database</text>
<rect x="604" y="180" width="232" height="44" rx="6" fill="#fef3c7" stroke="#334155" data-id="audit-log" data-kind="component"/>
<text x="720.0" y="206.0" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#0f172a">Audit log</text>
<rect x="884" y="120" width="232" height="44" rx="6" fill="#dcfce7" stroke="#334155" data-id="email-provider" data-kind="component"/>
<text x="1000.0" y="146.0" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#0f172a">Email provider</text>
<line x1="160.0" y1="142.0" x2="440.0" y2="142.0" stroke="#64748b" stroke-width="1.25" marker-end="url(#arrow)" data-id="f-request" data-kind="flow"/>
<line x1="440.0" y1="142.0" x2="440.0" y2="202.0" stroke="#64748b" stroke-width="1.25" marker-end="url(#arrow)" data-id="f-command" data-kind="flow"/>
<line x1="440.0" y1="202.0" x2="720.0" y2="142.0" stroke="#64748b" stroke-width="1.25" marker-end="url(#arrow)" data-id="f-account-data" data-kind="flow"/>
<line x1="440.0" y1="202.0" x2="720.0" y2="202.0" stroke="#64748b" stroke-width="1.25" marker-end="url(#arrow)" data-id="f-audit" data-kind="flow"/>
<line x1="440.0" y1="202.0" x2="1000.0" y2="142.0" stroke="#64748b" stroke-width="1.25" marker-end="url(#arrow)" data-id="f-email" data-kind="flow"/>
<line x1="440.0" y1="142.0" x2="160.0" y2="142.0" stroke="#64748b" stroke-width="1.25" marker-end="url(#arrow)" data-id="f-response" data-kind="flow"/>
