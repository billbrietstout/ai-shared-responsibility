<svg xmlns="http://www.w3.org/2000/svg" width="1176" height="488" viewBox="0 0 1176 488">
<rect width="100%" height="100%" fill="#f8fafc"/>
<text x="28" y="36" font-family="Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#0f172a">Tool-calling agent with MCP servers</text>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/></marker></defs>
<text x="28" y="56" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#64748b">Application team that owns the agent runtime and which MCP servers are attached. The model endpoint is a provider.</text>
<rect x="28" y="72" width="264" height="120" rx="8" fill="#fff" stroke="#94a3b8" data-id="internet" data-kind="trust-boundary"/>
<text x="40" y="100" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#1e3a8a">Internet</text>
