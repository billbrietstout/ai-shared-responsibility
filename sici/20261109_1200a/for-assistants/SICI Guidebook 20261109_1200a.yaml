  glossary:
  - id: term:Action-level authorization
    term: Action-level authorization
    definition: The decision, made at the moment of execution, whether a specific proposed action by an identified entity is permitted, given its parameters, the entity’s current task scope and the operational state. It is distinct from access authorization, which decides whether an entity may interact with a system at all, and from authentication, which establishes which entity is acting. An entity that is authenticated and has access to a system is not thereby authorized for each action it can request, and an authorized action is not thereby safe to execute.
    also_called: action authorization, per-action authorization, per-request authorization.
    contrast: access authorization; authentication; safety wrapper.
    collides_with: “authorization” in general access control usage, where it usually means the permissions granted to a user or other principal; and an authorization to operate, a management decision about a whole system.
    see: Task 5.1, Implementation 5.2.2, Task 7.4, Task 3.2, Implementation 3.2.3; zero trust.
  - id: term:Agentic AI system
    term: Agentic AI system
    definition: 'A system that consists of, or incorporates, one or more AI agents. A single agent is the simplest case. Systems of several agents that co-ordinate with one another, break a goal down into tasks and delegate them, and operate over extended periods are what the term most often refers to, and they add risks beyond those of each agent: errors and compromised context can pass from one agent to another, delegation chains and dependencies can form that no one documented, and one agent’s resilience can mask another’s failure.'
    also_called: agentic AI, agentic system; multi-agent system (for the several-agent case).
    see: Practice 3, Practice 5, Task 3.3, Implementation 3.8.3, Implementation 4.4.2, Implementation 8.1.5, Implementation 13.2.2.
    see_also: AI agent.
  - id: term:AI agent
    term: AI agent
    definition: An AI system that is given a goal and some authority to act, and that pursues the goal by deciding on and carrying out a series of steps itself, rather than only producing an output for a person to act on. Communicating on the organization’s behalf counts as acting where no person reviews the output first, for example disclosing information to, or making commitments to, a customer. Those steps may include gathering information, using software tools or other systems, and changing data, configurations or physical equipment, without a person approving each one. How much it can do on its own depends on the permissions and limits it is given. Many current AI agents are built on large language models, but a planner or reinforcement-learning system that decides which steps to take toward a goal is an AI agent in the same sense. A controller that applies a fixed, pre-engineered response to its inputs is automated rather than agentic; the profile treats such logic as non-AI when it serves as a fallback or interlock (Task 2.2).
    also_called: agent (where the context is clear).
    contrast: agentic AI system, which may consist of one AI agent or many.
    collides_with: “agent” in endpoint-security and IT-management usage, meaning installed monitoring or management software, “threat agent”, meaning an attacker, and “conversational agent”, a common name for a chatbot, which may converse with a user without acting for the organization. Some definitions for AI agent also count any AI system whose output drives actions without human intervention as an agent, even where its sequence of steps is fixed in advance. This profile’s emphasis on OT and ICS in critical infrastructure requires careful deconfliction with the term “automation.” Therefore, this profile keeps the term AI agent for systems that decide their own steps, at the level of abstraction being considered, to reduce confusion with concepts that the OT community would consider “automation,” such as fixed, pre-engineered control logic that OT relies on as an independent fallback or interlock. Its controls on authority and access, such as those in Practice 5, apply equally to fixed-sequence systems whose actions are driven by an AI system’s output, and to conversational systems whose responses reach people outside the organization without review.
    see: Practice 3, Practice 5, Task 5.3, Implementation 5.3.3, Implementation 5.3.2.
  - id: term:Alarm flood
    term: Alarm flood
    definition: 'More alarms, alerts or other notifications arriving than the people responsible can recognize, assess and act on, so that important signals are missed, delayed or cancelled without being understood. The profile treats AI as a new source of floods: in domains with no alarm-management experience, by breaking the assumptions behind established alarm management (for example, one fault reported in many slightly different ways), and through a correlated surge, when one external event makes many AI systems request attention at once.'
    also_called: alert flood, alert/alarm flood.
    see_also: alert fatigue (also alarm fatigue), the desensitization that repeated floods produce; oversight capacity.
    collides_with: process-industry alarm management (ISA-18.2, EEMUA 191), where an alarm is specifically an indication to the operator of an abnormal condition requiring a response, and floods are judged against recommended alarm-rate targets, such as those cited in Task 4.4. The profile uses “alarm”, “alert” and “notification” interchangeably.
    see: Task 4.4; Implementation 4.4.1; Implementation 4.4.2; Implementation 4.4.3; Implementation 4.4.4; Task 3.3; Implementation 3.3.1; Implementation 3.2.4.
  - id: term:Artificial intelligence (AI)
    term: Artificial intelligence (AI)
    definition: 'In this profile, AI and SI (Super Intelligence) refer to the same systems: a machine-based system that can, for a given set of human-defined objectives, make predictions, recommendations or decisions influencing real or virtual environments, adapted from 15 U.S.C. § 9401. This deliberately includes reasoning, planning, optimization and statistical systems, deep learning neural networks, large language models and hybrid systems, and so covers automated and agentic systems, not only machine learning or chatbots. The body text says “SI” following Executive Order 14434, while cited works, proper names, quotations, identifiers, terms of art and keyword lists keep “AI”. Where the profile calls a fallback, verifier or interlock “non-AI”, it means manual or legacy procedures, or deterministic logic whose behavior is fully specified and verified in advance, even if that logic would otherwise fall within this definition.'
    also_called: SI, Super Intelligence.
    collides_with: everyday and executive usage, where AI means generative AI or chatbots, and OT usage, where rule-based or model-predictive control is called “advanced control”, not AI.
    see: Section 1 (Introduction), Section 1.2 (Scope), footnote 1.
  - id: term:As practical
    term: As practical
    definition: Used in this profile, as in “as independent as practical” or “shares as little as practical”, for measures that are a matter of degree. How far to go is set by the consequence of a shared failure, weighed against the resources available, and whatever dependency or gap remains is a decision that someone with the authority to accept that level of risk accepts and records.
    also_called: as independent as practical, shares as little as practical, as far as practical.
    see: How Far to Go; Implementation 3.9.6.
  - id: term:Attack surface
    term: Attack surface
    definition: The set of points where an attacker can try to enter, affect or extract data from a system, a component or its environment. For an AI system this includes the routes by which adversarial input can reach inference logic, such as prompts, retrieved content, training and fine-tuning data, tools and APIs, and the model itself. It is part of the risk surface. The profile names it separately because security practitioners know the term, and because adversarial and non-adversarial causes call for different responses. It is mapped in Implementation 3.8.1. The added monitors, fallbacks and watchdogs that this profile recommends can enlarge it.
    see: Task 3.8, Implementation 3.8.1, Practice 5, Task 8.1, Implementation 8.1.6.
    see_also: Risk surface.
  - id: term:Automation bias
    term: Automation bias
    definition: 'The tendency of people to trust an automated system’s output more than it warrants: accepting it without enough checking, or delaying stepping in when it is wrong. It is related to, but distinct from, automation complacency, where a system that usually works leads people to monitor it less or lets manual skills fade.'
    also_called: over-trust, over-reliance.
    note: Both words are also used for automation complacency, which NIST SP 1270 defines as over-reliance, so should be read in context.
    collides_with: “bias” in its fairness or measurement senses. In this profile, automation bias is a human error source handled under Bias Managed.
    see: Task 3.6, Implementation 3.6.3, Task 4.6, Task 9.2, Implementation 9.2.1, Task 12.2.
  - id: term:Break-glass
    term: Break-glass
    definition: A pre-established emergency procedure by which authorized personnel, including external emergency responders where provided for, can quickly override AI-driven actions, modeled on the audited emergency override of access control. It is tiered rather than all-or-nothing, because simply cutting off the AI system can leave the process unsafe.
    collides_with: IAM and OT “break-glass accounts”, which grant emergency access but do not by themselves stop AI actions or hand over control.
    see: Task 3.9, Practice 4, Task 4.1, Implementation 4.1.1, Implementation 4.1.2.
  - id: term:Cold start
    term: Cold start
    definition: The disorientation of people who take over from an AI system without current awareness of system state, recent automated decisions or accumulated work.
    collides_with: ML “cold start” (no prior data) and power-plant cold start or grid black start.
    see: Task 4.2, Implementation 11.2.3.
  - id: term:Common-cause failure
    term: Common-cause failure
    definition: The failure of two or more systems, components or safeguards because of a single shared cause, such as a common power or cooling supply, network path, hypervisor, software library, training dataset or operating condition. Redundancy only protects against failures that do not share a cause, so the profile asks that functionally independent systems and safeguards be checked for what they share, rather than assumed to fail independently.
    also_called: common mode failure (in the SP 800-160v2r1 material the profile cites); correlated failure modes (Implementation 3.2.5); common-cause analysis (the activity of looking for shared causes).
    see: Task 3.5; Implementation 3.5.2; Task 2.2; Implementation 3.2.5; diversity (in redundancy).
  - id: term:Compensating control
    term: Compensating control
    definition: A control put in place to cover a gap where a recommended measure cannot be applied, for example where a legacy device cannot hold a unique identity, a vendor cannot supply a complete AIBOM, or an AI system cannot support the root cause analysis an application calls for. The profile asks that the gap and the control covering it be documented, and in some places that the control be shown to close the gap.
    collides_with: “compensating controls” in the NIST Risk Management Framework, controls “employed in lieu of the controls in the baselines described in NIST Special Publication 800-53B that provide equivalent or comparable protection for a system or organization” (NIST SP 800-53 Rev. 5). Because this profile also uses the term for partial measures proportional to the gap (Implementation 6.1.2), a measure it calls a compensating control may not qualify as one in an RMF assessment.
    see: Implementation 3.2.2; Implementation 5.1.1; Implementation 5.2.3; Implementation 6.1.1; Implementation 6.1.2; Implementation 8.1.1; Task 8.2; Implementation 8.2.1; Practice 13.
  - id: term:Confidence score
    term: Confidence score
    definition: A number produced by an AI system indicating how certain it is about an output. It is not necessarily a reliable probability that the output is correct. Implementation 3.2.2 recommends that safety constraints not depend on such values, and Task 4.6 that any confidence shown to personnel be derived from how the AI system reached its output.
    also_called: self-reported certainty.
    note: Where shown to personnel, the profile speaks of confidence metrics, indications or bands, which Task 4.6 asks to be derived from the decision process rather than taken from the raw score.
    collides_with: the statistical confidence interval or confidence level, which is a different concept.
    see: Implementation 3.1.3, Implementation 3.2.2, Implementation 3.3.3, Implementation 4.2.3, Task 4.6, Implementation 4.6.2.
  - id: term:Critical infrastructure
    term: Critical infrastructure
    definition: Systems and assets, physical or virtual, so vital that their incapacity or destruction would have a debilitating impact on security, the economy, public health or safety, or any combination of these. This profile is framed around the 16 critical infrastructure sectors defined in National Security Memorandum 22 (NSM-22), and its Practices apply more broadly to any high-consequence application.
    collides_with: '“CI”, which has several established meanings among the profile’s readers: counterintelligence, in cleared industry, insider threat and security programs; configuration item, in configuration and change management (NIST SP 800-128); continuous integration, as in CI/CD pipelines, in software development; and confidence interval, in statistics. This profile spells out critical infrastructure in body text and keeps CI in some titles; the acronym SICI is a name rather than an abbreviation to be expanded.'
    see_also: High-consequence application.
  - id: term:Data poisoning
    term: Data poisoning
    definition: Deliberately corrupting data that an AI system learns from or draws on, so that it behaves as an attacker intends. In this profile it covers training and fine-tuning data, data that an adaptive or online-learning system keeps learning from in operation, and content a system retrieves or holds in its context or memory, such as a document planted in a retrieval knowledge base.
    also_called: training data poisoning, knowledge base poisoning, memory and context poisoning, context window poisoning.
    see: Implementation 3.8.1; Task 7.2; Implementation 7.2.1; Implementation 7.3.3; Implementation 8.1.5.
    see_also: model poisoning, where the model itself is altered, for example through a compromised vendor update (Implementation 6.1.1).
  - id: term:Design basis
    term: Design basis
    definition: The conditions an item is deliberately designed to withstand, chosen with regard to their likelihood, their consequences, and the resources available, such as the severity of flood, the size of a surge, or the capability of an adversary. Conditions beyond the design basis are possible but judged too unlikely to design for; they are still examined so that the organization understands what would happen, and plans for it where it can.
    collides_with: the regulatory sense in nuclear safety, where design bases are defined in 10 CFR 50.2 as “the specific functions to be performed by a structure, system, or component of a facility, and the specific values or ranges of values chosen for controlling parameters as reference bounds for design”, and where the design-basis threat has a specific regulatory meaning (10 CFR 73.1). This profile uses the term in its general engineering sense and does not invoke those requirements.
    see: How Far to Go; Appendix A, A.3.1; Implementation 4.4.3; Task 11.2.
  - id: term:Digital twin
    term: Digital twin
    definition: A detailed virtual replica of physical equipment or a process, kept up to date with data from the real system. The profile uses digital twins mainly as places to test AI systems, rehearse incidents and train staff where doing so on live equipment would be unsafe, and as simulated environments in which to train AI models across their full operating range. It notes that a twin cannot reproduce every real-world condition, and that twin predictions should be compared with live telemetry to detect divergence. A digital twin that uses learned or symbolic models for forecasting or “what-if” planning is also an AI application in its own right, and is in scope.
    also_called: high-fidelity digital twin, twin.
    see: Section 1.2 (Scope); Implementation 1.3.1; Implementation 1.3.2; Implementation 1.4.1; Implementation 2.3.3; Implementation 2.5.1; Implementation 8.1.4; Implementation 9.2.2; Task 11.5; Implementation 11.5.2; Implementation 12.3.1.
  - id: term:Diversity (in redundancy)
    term: Diversity (in redundancy)
    definition: 'Building redundant paths from implementations that differ from one another, for example in model architecture, training data, supplier, hosting or technology, so that a single fault, attack or other common cause is less likely to disable every path at once. Diversity can be more apparent than real: secondary models that share a foundation model, training data or hosting provider may fail together. Diversity among AI models alone, which Implementation 2.2.1 calls heterogeneous AI redundancy, does less against a cause in the operating environment, such as distribution drift that reaches every model built on similar data; a backup that differs in technology, or a physical interlock, holds under the same drift, provided its behavior does not rest on the same training data or on other potentially correlated sources of error. Some shared design assumptions are usually unavoidable; those that remain warrant particularly careful verification, since a flaw in one would reach every path. Such a backup may itself use AI techniques, such as rule-based reasoning or planning.'
    also_called: heterogeneity, heterogeneous redundancy, heterogeneous AI redundancy; design diversity and supply chain diversity are forms of it.
    see: Task 2.2; Implementation 2.2.1; Implementation 3.2.5; redundancy gradient; common-cause failure.
  - id: term:Drift
    term: Drift
    definition: 'In this profile, the difference between the data or conditions an SI system was trained or designed for and those it meets in use, arising from changes in, for example, its inputs, the operating environment, the equipment, the population served or the task. The term names the difference itself, not a trend: drift can be gradual or sudden, and it does not necessarily grow, since it can grow and then shrink again, as with seasonal factors. Drift can degrade performance while the SI system itself is unchanged, so change management alone does not reveal it; it is detected by comparing operation against baselines.'
    also_called: distribution drift, distribution shift, data drift, operational drift. In this profile, “model drift” and “behavioral drift” usually refer to the resulting change in a model’s performance or behavior.
    contrast: calibration drift, in which an instrument’s reading moves away from the true value (Implementation 2.3.3, Implementation 7.2.4). It is a property of the sensor rather than of the SI system, but it can be one cause of drift in the SI system’s inputs. Also configuration drift, in which a system’s running configuration departs from its approved baseline (Implementation 12.3.3). Unlike drift in this entry’s sense, it is a change to the system itself, and it is found by comparing the configuration against that baseline.
    collides_with: “concept drift”, which has two incompatible senses. NIST SP 1270 uses it for “Use of a system outside the planned domain of application”, with no element of change over time, which is closer to this entry or to an out-of-distribution input. In machine learning, concept drift is a change in the relationship between a system’s inputs and the correct output, so that “the decision boundary moves” even though the input data have not changed (ISO/IEC 22989:2022). Gama and colleagues describe this second sense as “an online supervised learning scenario when the relation between the input data and the target variable changes over time”, which can happen with or without a change in the input distribution, and suddenly, gradually or in recurring patterns. Monitoring of input statistics alone may not detect concept drift in that second sense.
    see: Implementation 2.3.4, Implementation 3.3.2, Task 3.4, Task 6.2, Task 10.3.
    see_also: Out-of-distribution input; Diversity (in redundancy); Training cutoff.
  - id: term:Embedded AI
    term: Embedded AI
    definition: An AI capability built into a larger software product, service or device, where the people operating it may not realize it is there or what kind of AI it is. AI features may also be added to existing software during routine updates.
    collides_with: embedded systems engineering, where “embedded” means computing built into a device or cyber-physical system, such as a controller. This profile uses the word in both senses, so readers may miss AI features inside SaaS and enterprise software.
    see: Section 1.2 (Scope), Implementation 6.1.1, Implementation 6.2.1, Task 7.1, Implementation 13.1.4.
  - id: term:Fail loudly
    term: Fail loudly
    definition: To make a failure or degradation immediately and explicitly known to people, even if the system keeps running, perhaps in a degraded capacity. Failing loudly concerns notification and is separate from moving to a fail-safe state, although an unacknowledged loud failure may be set to force that move. How loudly to fail is weighed against the limited attention of the people receiving the alarms.
    contrast: quiet failure, where autonomous recovery or the resilience of other agents masks a degradation (Task 3.3).
    collides_with: “failover” in IT continuity usage, the capability to “switch over automatically (typically without human intervention or warning) to a redundant or standby system” (NIST SP 800-53 Rev. 5). A silent switch to a backup or fallback controller, such as one forced by a watchdog (Implementation 2.2.2), is a form of the quiet failure described under Contrast.
    see: Task 3.3, Implementation 3.3.1, Task 4.4.
  - id: term:Fail-safe state
    term: Fail-safe state
    definition: A predefined state (or states), chosen for the specific application, that the controlled process moves to when an AI output violates its constraints, an AI action is refused, the AI system becomes unavailable or degraded, or a person overrides or disengages it. It may hold last-known-safe setpoints, revert to conservative baselines or hand control to an independent deterministic controller. It does not necessarily mean shutting down, which can itself be the hazard, and where an action is refused part-way through a sequence it accounts for the steps already taken. Despite the name, a fail-safe state is rarely free of risk. It is chosen because it is expected to be safer than continuing in the condition that triggered it. The fail-safe state carries hazards of its own, such as lost production or service, reduced capability, or more demand on the people who take over. Those hazards are best identified and planned for when the state is chosen.
    also_called: safe state, known-safe state, fallback state, safe fallback state, pre-defined safe state.
    note: The same caveat applies to each. This profile uses “fallback behavior” for the wider set of responses, including for requests that do not act on the physical process.
    contrast: fallback behavior, the wider set of responses to a failure or refusal, which may also keep the SI-enabled function running in a degraded mode rather than moving the process to a defined state (Implementation 3.2.3).
    collides_with: 'functional safety, where fail-safe can mean the de-energized state; the profile uses that sense where it refers to E-stops (Implementation 4.1.2) and to a process that can be stopped safely (Practice 4). Also security usage, where IETF RFC 4949 gives “fail-safe” two senses that it calls “opposing design alternatives”: a synonym for fail-secure, which preserves a secure state though some resource may be damaged, and “A mode of termination of system functions that prevents damage to specified system resources and system entities” when a failure occurs, though the failure might still compromise security. CNSSI 4009 (2015) adopts only the second. Both senses describe ways of terminating system functions; a fail-safe state in this profile may keep the process running.'
    see: Implementation 3.2.3, Task 3.2, Implementation 5.2.2, Implementation 2.2.2, Task 3.3.
  - id: term:Fine-tuning
    term: Fine-tuning
    definition: Further training an existing AI model, such as a foundation model, on an organization’s own or task-specific data to adapt it to a particular task or domain. Fine-tuning changes the model itself, unlike retrieval-augmented generation, which changes what the model is given with each request. The profile asks that the source and authorization of fine-tuning data be documented, and that fine-tuned versions, such as adapters, be tracked in the AI asset list with their lineage back to the base model.
    also_called: local fine-tuning; continuous local fine-tuning (when done during operation).
    see: Implementation 7.1.1; Implementation 7.1.2; Task 7.2; Implementation 7.3.3.
  - id: term:Foundation model
    term: Foundation model
    definition: A large AI model trained on broad data that can be adapted to many different tasks, for example by fine-tuning. Large language models are one kind. Many AI products are built on the same few foundation models, so one model’s flaws or retirement can affect many systems at once.
    see: Implementation 2.2.1, Implementation 7.1.1, Implementation 13.1.1.
  - id: term:General-purpose AI assistant
    term: General-purpose AI assistant
    definition: An AI tool, such as a chatbot, built for a wide range of tasks and not designed or vetted for a specific critical infrastructure use. The profile covers these when they generate configuration files, automation code or operational procedures, or summarize operationally relevant material, even with no direct connection to a control loop. Lighter controls may suit purely informational output, but once that output informs an operational decision or a deployed configuration, full guardrail rigor applies.
    also_called: general-purpose LLM-based assistant.
    see: Section 1.2 (Scope), Implementation 3.1.1, Task 3.2.
  - id: term:Generative AI
    term: Generative AI
    definition: 'An AI system, or a capability of one, that produces new content, such as text, code, images, audio, configurations or plans, that is related to the data it learned from, in response to a prompt or other instruction. In this profile the term describes what a system does, not how it is built. A system described colloquially as an LLM (see Large language model) usually includes generative output, and it may combine generative components with symbolic, rule-based and hand-written ones, such as guardrails. The profile’s concerns about generated content apply to the generated output, whichever component produced it: it can be fluent and plausible yet wrong (see Hallucination), and it should be checked before it is relied on or acted upon.'
    contrast: Predictive or discriminative AI, which classifies inputs or forecasts values rather than producing new content. Many critical infrastructure systems combine the two, for example a predictive anomaly detector with a generative assistant that summarizes its alerts.
    collides_with: Everyday usage in which “AI” means generative AI, especially chatbots. In this profile, AI (and SI) covers predictive, generative and control systems alike (see AI).
    see: Section 1.2 (Scope); Appendix B (B.5).
    see_also: Large language model; Hallucination; Foundation model.
  - id: term:Graceful degradation
    term: Graceful degradation
    definition: Continuing to provide essential service at reduced capability when part of a system, such as an AI component, is not performing as expected, rather than failing abruptly. In Task 2.2 it means the SI-enabled function continuing in a reduced or derated mode, as distinct from transferring to a fail-safe state or manual control; in NIST SP 800-82r3 it also covers shedding automation in stages down to manual operation.
    also_called: degraded mode, derated operation.
    see: Trustworthiness Characteristics table (Resilient), Practice 2, Task 2.2, Implementation 1.3.1, Practice 11.
  - id: term:Guardrail
    term: Guardrail
    definition: 'A loose term for a control that constrains what an SI system can do. Guardrails can sit within the SI component, such as instructions it is given or behaviors trained into it, or around it, such as filters on its inputs and outputs or limits on the rate at which it acts, and they may or may not be independent of it or themselves AI-based. This profile uses the term across that range: for the process-informed limits of Implementation 2.1.2, for the guardrails built into SI products or set by their vendors (Implementation 5.3.3, Implementation 6.1.2, Implementation 6.2.2), and for the independent, deterministic checks of Task 3.2, which it calls safety wrappers. Where independence matters, the profile says “safety wrapper” or “independent guardrail”.'
    collides_with: “guardrails” in AI security and vendor usage, which are often assumed to provide protection whatever their independence; a guardrail that is not independent of the SI system does not by itself meet Task 3.2.
    see: Safety wrapper; Implementation 2.1.2; Implementation 5.3.3; Implementation 6.1.2; Implementation 6.2.2.
  - id: term:Hallucination
    term: Hallucination
    definition: Output from an AI system that sounds plausible and confident but is false or not supported by its inputs or sources. The profile is most concerned with the “plausible hallucination”, which reads as correct to a non-expert, for example a maintenance step that looks valid but would damage equipment. NIST AI 600-1 calls this risk confabulation.
    also_called: confabulation, plausible hallucination.
    see: Implementation 2.4.3, Implementation 3.8.2, Task 4.6, Implementation 12.2.2.
  - id: term:Hazard reachability
    term: Hazard reachability
    definition: Whether a known limitation or vulnerability of an AI component can actually lead to harm in a particular deployment, given the controls around it. A hazard shown to be unreachable is described as contained or operationally unreachable (VEX status “Not Affected”). The profile handles software flaws through standard VEX and model behaviors through contextual hazard reachability (Implementation 6.1.5). Reachability can change when autonomy is widened, agents are chained or the operating environment moves, even if the record still shows the hazard as contained.
    also_called: contextual hazard reachability (for model behaviors specifically).
    collides_with: “containment” in incident response, meaning preventing an incident from expanding, which the profile also uses (Implementation 5.1.1); and “containment” of consequence or blast radius (Task 3.5).
    see: Task 3.8, Implementation 3.8.3, Implementation 6.1.5, Task 4.4.
  - id: term:Human oversight
    term: Human oversight
    definition: 'An umbrella term for arrangements by which people remain responsible for an AI system’s behavior in operation. It denotes a category, not a single control, and comprises four distinct objects defined below: oversight mode, oversight capacity, oversight threshold and oversight authority. Task 3.9 refers to oversight authority as decision authority.'
    see: Implementation 1.3.1, Task 3.9, Practice 4, Task 4.4, Task 4.5.
  - id: term:Oversight mode
    term: Oversight mode
    parent: term:Human oversight
    definition: 'The regime governing how a person participates in an AI system’s decisions: human-in-the-loop (approval required before action), human-on-the-loop (action proceeds, with intervention capability retained), or human-out-of-the-loop (autonomous execution with retrospective review). The three are ordered from most to least direct human participation; “more restrictive” and “reduced” in this profile refer to that order. Task 4.5 defines the boundaries between them.'
    also_called: oversight regime, operational regime.
    collides_with: “human-in-the-loop” in modeling and simulation, “A model that requires human interaction” (DoD 5000.59-M, DoD Modeling and Simulation (M&S) Glossary, January 1998), such as a simulation with human participants; that sense would also cover what this profile calls human-on-the-loop.
    see: Task 4.5, Implementation 1.3.1, Implementation 3.2.5, Implementation 4.5.2.
    see_also: human oversight, oversight authority.
  - id: term:Oversight capacity
    term: Oversight capacity
    parent: term:Human oversight
    definition: The finite human attention available to exercise oversight, measured across all AI systems drawing on the same pool of people rather than per system. Capacity is exhaustible, is consumed concurrently by every system an operator supervises, and can be saturated by a correlated event even where each system’s individual demand is manageable. Applied to a single review step (Implementation 3.2.5), it also means the time and competence the reviewer has to examine what is in front of them.
    also_called: operator triage capacity, oversight pool.
    see: Implementation 1.3.1, Task 4.4, Implementation 4.4.3.
    see_also: human oversight, alarm flood.
  - id: term:Oversight threshold
    term: Oversight threshold
    parent: term:Human oversight
    definition: 'The point beyond which a given oversight mode ceases to be effective: where the interval between an anomaly and an irreversible consequence is shorter than what human intervention can be relied upon to achieve, or where the judgment the person would have to make cannot reliably be made in the time available. Implementation 4.5.1 defines how these are established.'
    see: Task 4.5, Implementation 4.5.1, Implementation 3.8.3.
    see_also: human oversight.
  - id: term:Oversight authority
    term: Oversight authority
    parent: term:Human oversight
    definition: 'The authority, held by a named role, to accept the risk of operating an SI-enabled capability in a given oversight mode, to change that mode, and to restrict, suspend, roll back or reduce the capability’s delegated authority. Distinct from the ability to intervene in a particular action: authority persists in regimes where real-time intervention is infeasible.'
    contrast: the authorizing official of the NIST Risk Management Framework, a “Senior (federal) official or executive with the authority to formally assume responsibility for operating an information system at an acceptable level of risk” (NIST SP 800-39). That authority covers operating the system as a whole. Oversight authority is held for one SI-enabled capability in a given oversight mode. Some frameworks and obligations, such as SP 800-37, limit the delegation of risk acceptance. Which role holds oversight authority depends on the obligations that apply to the organization.
    see: Implementation 3.9.2, Task 4.5.
    see_also: human oversight, operating envelope.
  - id: term:Industrial control system (ICS)
    term: Industrial control system (ICS)
    definition: A control system that monitors and manipulates physical processes, such as supervisory control and data acquisition (SCADA) systems, distributed control systems (DCS) and programmable logic controllers (PLCs), made up of control components that act together to achieve an industrial objective. ICS are a subset of operational technology (OT), which also includes systems such as building automation and physical access control.
    also_called: industrial automation and control system (IACS).
    note: IACS is the ISA/IEC 62443 term.
    collides_with: in emergency management and public safety, ICS more commonly means the Incident Command System, the standardized incident management structure within the National Incident Management System (NIMS). This profile does not use ICS in that sense.
  - id: term:Inference receipt
    term: Inference receipt
    definition: A record created each time an AI system providing decision support or diagnostics from structured data produces an output, capturing the data elements it used, the thresholds in effect and the versioned configuration. Where the system applies encoded rules or is self-interpretable, the receipt can also record the rules or branches applied. It lets the output be traced and checked later.
    contrast: audit trail, “A chronological record that reconstructs and examines the sequence of activities surrounding or leading to a specific operation, procedure, or event in a security-relevant transaction from inception to result” (NIST SP 800-53 Rev. 5). An audit trail records what was done and in what order; an inference receipt records what a single output was based on, so existing audit logging does not necessarily provide it.
    see: Implementation 4.6.3, Task 10.1, Implementation 10.1.2.
  - id: term:Intercept point
    term: Intercept point
    definition: 'A place in the path between an AI system’s output and its effect where that output can be monitored, checked, blocked or overridden by something other than the AI system. One path may have several: in the profile’s example of an AI system recommending setpoints, they include the setpoint interface, the local controller and existing emergency shutoff mechanisms. Intercept points are where safety wrappers and override procedures can act. A wrapper may check or block outputs at some of them, and at others act through an existing mechanism, for example by triggering an emergency shutoff where that is practical and permitted by policy and regulation. It should not gate commands from protective functions such as emergency stops (Implementation 3.2.2), except where a simple stop would itself be unsafe, as in a dynamically unstable process; there, a stop request may go to logic that carries out a safe shutdown sequence.'
    also_called: AI output intercept point, operational intercept point.
    see: Implementation 3.2.1; Task 3.2; Implementation 4.1.1; Appendix C.1.
  - id: term:Interlock
    term: Interlock
    definition: A mechanism that blocks an action, or forces a protective action, unless defined conditions are met. In this profile it mostly means a physical or hardware safety interlock at the process boundary that holds regardless of what an AI system commands, at the high-consequence end of the redundancy gradient. The profile also uses it for logic conditions on a trigger, such as the “state-aware interlocks” that stop a watchdog from forcing a failover during a sensitive process transition, and for automated “policy interlocks” in non-physical processes.
    also_called: safety interlock, physical interlock, hardware interlock.
    see_also: safety instrumented system (SIS), the engineered system that takes a process to a safe state, which an AI system should not be able to affect (Implementation 3.5.3).
    see: Task 2.2; Implementation 2.2.1; Implementation 2.2.2; Implementation 2.3.4; Implementation 3.1.1; Implementation 3.2.1; Implementation 3.2.2; Task 4.5; Implementation 11.2.3.
  - id: term:Knowledge graph
    term: Knowledge graph
    definition: In this profile, the YAML file distributed with the Markdown version of the document. It lists every Practice, Task and Implementation by item number, with the cross-references between them, their trustworthiness characteristics, AI RMF subcategories, references and Appendix B incidents, so that an LLM-based assistant can check that it has seen every item and follow the links between them. It is generated from the Markdown by a script and adds no content; where the two differ, the document governs.
    collides_with: the general data-management sense, a database of entities and relationships used as a knowledge source in its own right.
    see: Section 1.4; Section 2; Appendix E (E.1).
  - id: term:Known-safe
    term: Known-safe
    definition: 'Describes a state, setting, mode of operation or controller whose behavior has been established in advance, through analysis, testing or operating history, to be acceptably safe under the conditions it was assessed for. “Known” refers to that prior assessment, not to a guarantee: a known-safe state is safe only as far as the assessment holds, and may not be if conditions have moved outside what was assessed. Last-known-safe setpoints are the most recent values assessed or observed to be safe. They are a sensible default when an AI system’s output is blocked or lost, but they reflect conditions at the time they were recorded, which may since have changed.'
    contrast: known-good, which this profile uses for a configuration, procedure or artifact version that has been verified to work and is kept for rollback (Task 12.3, Implementation 12.3.2). A known-good configuration restores function; a known-safe state limits harm. One need not be the other.
    see_also: fail-safe state.
    see: Practice 2, Task 3.2, Implementation 3.2.3, Implementation 4.1.2.
  - id: term:Large language model (LLM)
    term: Large language model (LLM)
    definition: 'In this profile, an LLM is the whole system that the general public colloquially refers to (e.g., “Which LLM are you using to summarize your emails?”), not only the model at its core. Such a system typically combines one or more large statistical language models with other components: additional models, symbolic and rule-based components, retrieval of external data, tool and agent interfaces, hand-written instructions and code, and guardrails that filter inputs and outputs. Its behavior comes from all of these together, and these components may be changed by the provider without notice. An LLM-based assistant, chatbot, or coding agent is such a system, with associated additional tools and functionality, used to help a person with the associated tasks. In computer science, “large language model” refers more narrowly to the model alone. In current practice, this is usually a large statistical model of language, implemented as a deep learning neural network, though not every definition requires it. The model is not limited to generating text, and a system built around it need not be generative. Where this profile means the model alone, it says so.'
    also_called: LLM-based assistant, LLM-based system.
    collides_with: the computer-science sense described above, in which “the LLM” is only the trained model. Statements that hold for the model alone, about its training data, size or architecture, do not necessarily hold for the system, and controls that act on the model do not by themselves govern the rest of the system.
    see_also: foundation model, general-purpose AI assistant, safety wrapper.
    see: Section 1.2 (Scope), Section 1.4, Implementation 1.4.2, Implementation 3.7.1, Appendix E.
  - id: term:Least agency
    term: Least agency
    definition: The principle that an AI system’s ability to initiate actions or invoke tools should be limited to what its defined function strictly requires, and that it should not use access unnecessarily even where access exists. It extends to what an AI system carries forward between steps, such as context and memory, as well as what it can initiate. It differs from least privilege, which limits the resources and authorizations the system is granted; least agency also limits how much the system decides and does on its own within them.
    contrast: excessive agency.
    see: Task 5.3, Implementation 5.3.1, Implementation 5.3.3, Implementation 5.3.4, Practice 5.
  - id: term:Operating envelope
    term: Operating envelope
    definition: The defined range of conditions, such as input and output ranges, setpoint limits, latency limits, physical tolerances and dependencies, within which an AI system is specified and validated to operate.
    also_called: operating window, boundary envelope.
    note: 'Practice 3 and Task 3.2 also speak of the process’s “safe operating envelope”: the limits the physical process must stay within, which guardrails enforce regardless of the AI system. That is the process-safety sense below, and where both are meant the document specifies so.'
    collides_with: aviation flight envelope; process-safety safe operating limits.
    see: Implementation 1.1.2, Implementation 1.3.1, Implementation 2.5.1; for the process sense, Practice 3 and Task 3.2; Implementation 3.2.2 combines both senses as “safe operating limits.”
  - id: term:Operational enforceability
    term: Operational enforceability
    definition: The demonstrated ability to turn a governance decision about an SI-enabled capability, such as restricting, suspending, rolling back or reducing its delegated authority, into an actual change in what the system does. Implementation 3.9.5 tests whether that change is effective, timely relative to consequence, verifiable without relying solely on the capability’s own report, durable and sufficient in scope.
    see: Task 3.9, Implementation 3.9.4, Implementation 3.9.5.
  - id: term:Organizational readiness
    term: Organizational readiness
    definition: A determination, made for one SI-enabled capability in its operating context, that the accountability, authority, escalation paths, operational capability and enforceability needed to govern it are actually in place and can be exercised, so that a governance decision, once made, takes effect in the running system. It is made before deployment and again after any material change, and it is not a general organizational maturity assessment.
    collides_with: “workforce readiness” (Task 9.3), which is the training competence of personnel.
    see: Task 3.9, Implementation 3.9.2, Implementation 3.9.5.
    see_also: operational enforceability.
  - id: term:Out-of-band
    term: Out-of-band
    definition: Operating through a separate, independent path from the system being monitored or controlled, so that a failure or compromise of that system does not reach it.
    collides_with: IT out-of-band management and authentication, which is the same idea in a narrower sense.
    see: Task 4.3, Implementation 2.2.2, Implementation 3.2.2, Implementation 4.3.2, Task 7.3.
  - id: term:Out-of-distribution input
    term: Out-of-distribution input
    definition: An input or operating condition unlike those an AI system was trained or designed for, where its behavior is less predictable.
    also_called: novel input, unhistorical conditions.
    note: Related to drift (see Drift), the overall difference between the data a system was trained or designed for and the data it meets in use; out-of-distribution describes the individual input or condition.
    collides_with: “concept drift” in NIST SP 1270, defined as “Use of a system outside the planned domain of application”, which is close to this entry and has no element of change over time. In machine learning the same term means something different (see Drift).
    see: Implementation 3.3.3, Implementation 4.2.3, Task 9.2.
  - id: term:Post-hoc explanation
    term: Post-hoc explanation
    definition: An explanation of an AI output generated afterward, typically by a separate tool that probes how outputs change with inputs (for example SHAP or LIME). Its output is a hypothesis about why the model may have behaved as it did, not a record of what it did.
    also_called: post-hoc attribution, post-hoc statistical explanation.
    contrast: introspective explanation, drawn from the process that produced the output (Task 4.6). A surrogate model distilled from a learned model is a post-hoc explanation when it is used to explain that model, and an introspective one only when it is deployed in its place (Implementation 4.6.4).
    see: Task 1.4, Implementation 4.6.2, Implementation 8.1.2, Implementation 10.1.2, Task 12.1, Implementation 12.1.2.
  - id: term:Prompt compromise
    term: Prompt compromise
    definition: Loss of integrity or confidentiality of the instructions an AI system works from, such as its system prompt, standing instructions or the context it is given. Integrity is lost when the instructions are altered, whether by prompt injection, a changed system prompt, an insider or a compromised update. Confidentiality is lost when instructions that are legitimate but sensitive are leaked. System prompts can contain internal procedures, the conditions under which the system refuses, or credentials, and a leak can help an attacker get around controls.
    forms_include: prompt injection; system prompt leakage, also called prompt extraction when it is done deliberately.
    see: Implementation 5.1.1, Implementation 5.3.3, Task 7.3.
    see_also: Prompt injection.
  - id: term:Prompt injection
    term: Prompt injection
    definition: An attack in which instructions placed in an AI system’s input, either typed directly or hidden in content the system reads (indirect prompt injection), cause it to ignore its intended instructions or take unintended actions.
    see_also: Prompt compromise, the broader term, which also covers prompts altered by other routes and sensitive prompts that are leaked.
    see: Implementation 3.8.1, Implementation 3.2.2, Implementation 5.3.3.
  - id: term:Protective AI capability
    term: Protective AI capability
    definition: An SI system that performs a detection, monitoring, screening or filtering function, and so provides a protective function for other systems, acting as a control for them whether or not it is formally recorded as one. Retiring it removes that control, so the profile treats its retirement as a change to controls as well as an asset disposal. That includes establishing what it had learned to detect that is not documented elsewhere, and what will perform the function afterward.
    contrast: protective functions in general, which need not be implemented with AI. Those named in Implementation 3.2.2, such as protective relay trips, safety instrumented system shutdowns and emergency stops, are usually conventional, and a safety wrapper does not gate their commands. Where SI logic takes the place of a simple stop as a protective function, Implementation 3.2.2 expects it to be far less complex than the SI system it backs up, independent of it, and verified to the standard of a protective function.
    see: Implementation 13.3.2; Task 13.3.
  - id: term:Redundancy gradient
    term: Redundancy gradient
    definition: The profile’s scheme for matching how independent a backup is to how severe the consequences of failure would be. For lower- and moderate-consequence functions where a non-AI fallback is not technically feasible, the backup may be a secondary AI model with a different architecture, training data and hosting (see diversity (in redundancy)). For high-consequence or cyber-physical functions, it escalates to include independent deterministic algorithms or out-of-band, non-AI physical safety interlocks, which may be paired with an AI backup. The degree of independence is set by the severity of consequences rather than from what is convenient to build.
    collides_with: '“deterministic” in its computing sense, a deterministic algorithm being “An algorithm that, given the same inputs, always produces the same outputs” (NIST SP 800-90A Rev. 1). Being deterministic does not make a component non-AI: classical planning and logical inference are often deterministic, and a trained model may or may not be, depending on how inference is run. What the redundancy gradient relies on is a fallback that shares as little as practical with the SI system, particularly its training data, and fully specified and verified in advance, including any design assumptions it shares with the SI system.'
    see: Implementation 2.2.1; Task 2.2; Implementation 3.1.3.
  - id: term:Retrieval-augmented generation (RAG)
    term: Retrieval-augmented generation (RAG)
    definition: An AI system design in which, for each request, the model is given information retrieved from a separate store, such as a document collection, database or vector store, and uses it to produce its output. The system’s behavior therefore depends on what is in that store as well as on the model, and changing the store changes the behavior without any change to the model.
    also_called: retrieval augmentation, retrieval-augmented system; the store is called a knowledge base or retrieval-augmented data repository.
    collides_with: “knowledge base” in symbolic AI (Implementation 4.6.3), where it means the encoded rules a system reasons with, not documents it retrieves.
    see: Practice 6; Implementation 6.1.2; Implementation 7.1.2; Task 7.2; Implementation 7.4.1.
  - id: term:Risk surface
    term: Risk surface
    definition: The full set of ways in which an AI system can cause physical, operational or administrative harm, across all the trustworthiness characteristics, whether an attacker is involved or not. It includes the attack surface. The profile often names both, as in “attack and risk surface”, for emphasis and for readers who know only one of the terms. It can grow or shrink over time as the environment, the data or the degree of autonomy changes, which Implementation 3.8.3 tracks. Implementation 3.8.2 maps its non-adversarial part, and Implementation 8.1.6 triages incidents between the adversarial and non-adversarial parts.
    collides_with: Usage that treats the two as separate, with “risk surface” meaning only harm that involves no attacker.
    see: Task 3.8, Implementation 3.8.2, Implementation 3.8.3, Implementation 8.1.6, Practice 8, Task 8.1, Task 10.1, Practice 10.
    see_also: Attack surface.
  - id: term:Root cause analysis
    term: Root cause analysis
    definition: In this profile, establishing why a particular incident, failure or SI output occurred, so that its cause can be corrected and the correction shown. For an SI system this usually rests on reconstructing what the system received and produced, including its inputs, versions and settings; a post-hoc explanation offers a hypothesis about the cause, not a record of it (Implementation 8.1.2). Task 8.1 identifies where root cause analysis must rest on deterministic reconstruction, and Task 8.2 the additional controls that may be needed where that is not possible.
    collides_with: “root cause analysis” in risk management, a “systems approach for the identification of underlying causes associated with a particular set of risks” (NIST SP 800-30 Rev. 1), which looks for the causes of a set of risks rather than reconstructing a specific incident.
    see: Practice 8, Task 8.1, Task 8.2, Implementation 8.1.2, Implementation 8.2.1, Implementation 11.4.1.
  - id: term:Safety wrapper
    term: Safety wrapper
    definition: A hard-coded, deterministic control, as independent of the AI system as practical and not itself AI-based, that checks AI outputs or commands against defined constraints and limits or blocks them, engages fallback controllers, notifies operators and logs the event when a constraint would be violated. Where it guards a physical process, it applies whichever upstream source issued the command, such as an SI recommendation, an automated agent, a remote operator session or another upstream system, except for commands from protective functions, which the wrapper does not gate, and authorized overrides; for SI systems that generate information rather than commands, the constraint may instead be one of completeness or fidelity (Implementation 3.2.2). In either case the constraints do not depend on the AI system’s own confidence values. It can only bound the hazards that were identified and written as constraints.
    also_called: independent guardrail, boundary logic, safety/policy wrapper. “Validation control” is used in Implementation 3.4.3 for safety wrappers and watchdog controllers together.
    forms_include: command validation proxy, guarded proxy (Implementation 5.3.3).
    contrast: '“enforcement layer”, which this profile uses for whatever enforces a check at the point of action: a safety wrapper, the action-level authorization of Implementation 5.2.2, or a guarded proxy (Implementation 5.3.3), as in Task 10.1, Implementation 10.1.2 and Appendix C.1. Records of what was permitted should come from it rather than from the SI system (Implementation 10.1.2).'
    collides_with: “guardrails” in AI security writing, which can be checks at any layer of the AI system, including ones that judge prompts or generated content; these are not necessarily independent of the AI system. The profile itself also uses “guardrail” for the process-informed rate limits of Implementation 2.1.2, which may be deterministic and may be internal to the AI component rather than independent of it.
    see: Task 3.2, Implementation 3.2.2, Implementation 3.2.3, Implementation 3.4.3, Implementation 4.5.2, Implementation 5.3.3, Implementation 6.1.1, Task 7.3, Task 7.5.
  - id: term:Shadow mode
    term: Shadow mode
    definition: Running an AI system on live inputs while its outputs are recorded but not acted on, so its behavior can be compared with the system or process actually in control.
    also_called: passive shadow mode, silent trial, silent evaluation (in clinical AI).
    contrast: silent update, an unreviewed change to a model, which is unrelated.
    collides_with: shadow AI in this profile; the “shadow model” of adversarial machine learning, a model built to imitate a target model in privacy attacks.
    see: Implementation 1.3.2, Implementation 2.3.3, Task 7.5, Implementation 7.5.2, Implementation 11.4.2.
  - id: term:Shadow SI
    term: Shadow SI
    definition: SI tools, models or services used within an organization’s operations without having gone through its procurement, approval or inventory processes. This includes personal LLM-based assistants and other tools brought in by staff or contractors, and models downloaded and run locally without approval. Because shadow SI sits outside credential directories and asset lists, it may bypass identity and other risk management controls; identity and access controls can detect and deny it when it tries to authenticate (Practice 5).
    also_called: shadow AI
    collides_with: shadow mode, a testing technique in this profile.
    see: Task 3.7, Practice 5, Practice 7.
  - id: term:SI Bill of Materials (SIBOM)
    term: SI Bill of Materials (SIBOM)
    definition: A record, ideally machine-readable and, for acquired systems, supplied by the vendor for each model release, of the models an AI system uses, its main training data sources, the data it retrieves at runtime and the software it depends on at training and run time; the profile also uses it to carry vendor attestations, such as representation of similar environments in the training data. It extends the idea of a software bill of materials (SBOM), but there is no vulnerability database for model behavior equivalent to the one an SBOM is checked against. Formal specifications are still being developed.
    also_called: AI Bill of Materials, AIBOM, SBOM for AI, AI-SBOM; AI BOM (SPDX), ML-BOM (CycloneDX).
    see: Implementation 6.1.2, Implementation 6.1.5, Implementation 7.1.3.
  - id: term:Silent update
    term: Silent update
    definition: A change to an AI model or its behavior that a vendor applies without the operator being told or having reviewed it, usually also without the operator taking any action, for example a cloud-side model change. An internal change that reaches production unreviewed is the internally sourced equivalent.
    also_called: unannounced update.
    contrast: cloud-side model change, which describes where a change is made rather than whether the operator is told; both a cloud-side change and an on-premises one can be announced or silent (Implementation 6.1.1).
    collides_with: “update” in software security usage, defined as “A patch, upgrade, or other modification to code that corrects security and/or functionality problems in software” (NIST SP 800-213 and NIST IR 8259A). A change-management process built on that sense may not treat a change to a model or to the instructions it is given as an update, although such a change can alter behavior without any change to code.
    see: Implementation 6.1.1, Implementation 6.2.2, Implementation 7.4.1.
  - id: term:State-at-Handoff
    term: State-at-Handoff
    definition: 'A summary shown to people taking control from an AI system: recent AI actions, active trends, accumulated task queues, unacknowledged alerts and open physical or policy constraints.'
    also_called: state-at-handoff display.
    see: Task 11.2, Implementation 11.2.3.
  - id: term:Super Intelligence (SI)
    term: Super Intelligence (SI)
    definition: The term this profile uses, following Executive Order 14434, for the systems defined as artificial intelligence in 15 U.S.C. § 9401. In this profile SI and AI refer to the same systems, and the definition and scope are those set out under artificial intelligence (AI). The order defines SI by reference to that statutory definition, and provides for a new definition to be proposed. Cited works, proper names, quotations, identifiers, established terms of art and keyword lists keep “AI”.
    also_called: AI, artificial intelligence.
    collides_with: 'AI research usage, where “superintelligence” means hypothetical systems whose capabilities exceed those of humans; this profile does not use the term in that sense, and covers the same everyday systems as before, including rule-based, optimization and embedded systems. Other abbreviations that read as SI or contain it: the SI family of security controls (System and Information Integrity) in NIST SP 800-53, cited in this profile as SI-6, SI-10, SI-17 and others; the International System of Units (SI); safety instrumented system (SIS) in process safety; and the identifiers ASI01 to ASI10 in the OWASP Top 10 for Agentic Applications.'
    see: footnote 1; Section 1 (Introduction).
    see_also: artificial intelligence (AI).
  - id: term:Symbolic AI
    term: Symbolic AI
    definition: 'AI that reasons with explicitly represented knowledge, such as rules, logic, constraints or a knowledge base, rather than with patterns learned from data. It is often deterministic, but need not be: planning, search and probabilistic reasoning can involve randomness or uncertainty. Separately, the profile relies on some logic as a fallback, verifier or interlock and describes it in the text as non-AI (for example Task 2.2, Implementation 2.2.2); what matters there is that its behavior is fully specified and verified in advance and independent of the SI system, not whether its technique is symbolic or deterministic. The rationale it displays can be a trace of the steps it actually applied, which shows how it reached its output but not that its rules are correct. In a hybrid system, such a trace explains only the symbolic part.'
    also_called: symbolic reasoning, logic-based, rule-based.
    see: Task 4.6, Implementation 2.5.1, Implementation 4.6.3, Implementation 10.1.2.
  - id: term:Task-bounded authority
    term: Task-bounded authority
    definition: Authority for an AI agent to act that is limited to a specific task, operational mode or time window, expires automatically and can be revoked quickly, instead of being held as standing privileges. When an agent passes work to downstream tools or sub-agents, their authority is scoped to that task as well. Where the authority cannot be checked in real time, for example at a partitioned or remote site, the profile recommends reverting to pre-engineered local fallback behavior rather than continuing on unverified standing authority.
    also_called: task-bounded and revocable agent authority.
    see: Implementation 5.3.2; Task 5.3; least agency; Appendix C.1.
    see_also: withdrawal of authority.
  - id: term:Testing, evaluation, validation and verification (TEVV)
    term: Testing, evaluation, validation and verification (TEVV)
    definition: The planned activities that produce evidence of how an AI system or one of its components performs against its requirements and previous baselines, at each stage of its lifecycle. This is the AI RMF’s umbrella term, which the AI RMF orders as test, evaluation, verification and validation. “Validation” and “verification” are used here in their general sense.
    collides_with: “model validation” in financial-sector model risk management, “the set of processes and activities intended to verify that models are performing as expected, in line with their design objectives and business uses” (Federal Reserve SR 11-7, Supervisory Guidance on Model Risk Management), which spans both verification (against design objectives) and validation (against intended use) in the general senses used here.
    see: Task 1.3 (the anchor, which sets criteria for every lifecycle stage), Implementation 1.3.1, Implementation 1.3.2, Implementation 1.3.4, and Task 2.3, which extends TEVV to anomalous and edge-case conditions.
  - id: term:Training cutoff
    term: Training cutoff
    definition: The most recent date covered by the data a model was trained on. Information that changed after it, such as revised guidance, procedures, or regulations, is not reflected in the model unless supplied at run time, for example through retrieval, so the model may reproduce a superseded version.
    also_called: knowledge cutoff, training data cutoff.
    see: Implementation 1.1.3, Implementation 6.1.1, Practice 6, Appendix B (B.5).
    see_also: Drift; Foundation model.
  - id: term:Watchdog controller
    term: Watchdog controller
    definition: An independent, non-AI monitor, implemented in simple deterministic hardware or software, that checks an AI system’s health, latency, setpoint stability and outputs, and starts a safe fallback sequence when they fall outside set limits. It judges whether the AI system as a whole is still performing as required, where a safety wrapper checks each command against defined constraints.
    also_called: enforcement application.
    collides_with: the embedded-systems watchdog timer, which only detects a system that has stopped responding.
    see: Task 2.2, Implementation 2.2.2, Implementation 2.3.4, Implementation 3.4.3.
  - id: term:Withdrawal of authority
    term: Withdrawal of authority
    definition: 'In this profile, the removal of every means by which a retired AI system can still act: its credentials, tokens and keys, scheduled and event-driven triggers and registered interfaces, authority it delegated to other entities, and the compute resources that may still hold any of these. Each removal is confirmed rather than assumed, and for any delegation that cannot be confirmed revoked, what could not be confirmed is recorded, together with the decision to complete the retirement on a recorded exception or hold it open, and any compensating control.'
    collides_with: rescinding an authorization to operate, a management decision that does not by itself remove a system’s credentials or triggers.
    see: Practice 13, Task 13.2, Implementation 13.2.1, Implementation 13.2.2.
  - id: term:Zero trust
    term: Zero trust
    definition: 'A cybersecurity approach in which no implicit trust is granted to users, devices or services based solely on their network location, ownership or prior authorization, and access to each resource is authenticated and authorized separately. This profile applies the underlying principle, that trust is verified at each boundary rather than assumed, to AI risk more generally. The extension is in what is not assumed: in cybersecurity, chiefly that a requester is who it claims to be and is permitted to act; here, also that a legitimate, uncompromised AI system is behaving as intended. An AI system’s outputs, actions and inputs therefore warrant verification where they cross into other systems, physical processes and human decisions, whether a departure from expected behavior arises from compromise, malfunction or a change in operating conditions. For example, an AI agent holding valid credentials is still authorized action by action (Implementation 5.2.2), and guardrails independent of the AI system check its outputs before they reach a physical process (Task 3.2).'
    see: Section 1.2 (Scope); Task 3.2; Practice 5; Implementation 5.2.2.
  scenarios:
  - id: B.1
    name: Clinical risk-prediction model {#b.1:-clinical-risk-prediction-model}
    sector: [Healthcare and Public Health]
    line: 7261
    description: A widely used SI model for predicting a medical condition misses many positive cases in independent validation, while generating enough false alarms to cause alert fatigue.
    characteristics: [Accurate, Valid]
  - id: B.2
    name: Specialized-care claims-review model {#b.2:-specialized-care-claims-review-model}
    sector: [Healthcare and Public Health]
    line: 7275
    description: A health insurer automates claims review for a category of specialized care using an SI system, and its denial rate for that care rises sharply. The system’s objectives drift toward cost control and the likelihood that a denial will be challenged, and its recommendations begin to displace physicians’ clinical judgment.
    characteristics: [Accountable, Fair]
  - id: B.3
    name: Autonomous taxi post-collision maneuver {#b.3:-autonomous-taxi-post-collision-maneuver}
    sector: [Transportation Systems]
    line: 7291
    description: After a collision, an autonomous taxi’s SI perception and planning system carries out a pullover maneuver without fully considering its surroundings, causing further damage.
    characteristics: [Safe, Robust]
  - id: B.4
    name: Vehicle match used for arrest {#b.4:-vehicle-match-used-for-arrest}
    sector: [Emergency Services]
    line: 7306
    description: Police treat a low-ranked SI vehicle recognition match as the effective basis for arresting people who turn out to be unrelated to the case.
    characteristics: [Valid, Explainable & Interpretable]
  - id: B.5
    name: Hospital patient-portal chatbot {#b.5:-hospital-patient-portal-chatbot}
    sector: [Healthcare and Public Health]
    line: 7321
    description: Patients rely on a generative SI chatbot, based on a major foundation model, that gives preparation instructions for a procedure. Information that was current when the SI chatbot’s foundation model was trained, but has since been superseded, causes the chatbot to contradict the hospital’s current published guidance.
    characteristics: [Accurate, Safe]
  - id: B.6
    name: Benefits fraud-risk model {#b.6:-benefits-fraud-risk-model}
    sector: [Government Services and Facilities]
    line: 7336
    description: A self-learning SI model used to flag benefit fraud uses a protected characteristic as a risk factor. Flagged families have their benefits stopped and repayment demanded, and wrongful flags fall disproportionately on some groups.
    characteristics: [Fair, Bias Managed]
  - id: B.7
    name: Automated train passes an obstruction it misread {#b.7:-automated-train-passes-an-obstruction-it-misread}
    sector: [Transportation Systems]
    line: 7351
    description: A driverless metro line uses an SI perception system to detect obstructions on the track, with a human supervisor in the control center. The system detects an object on the track ahead but classifies it inconsistently, as debris one moment and as nothing the next, and does not brake. The supervisor, who has rarely seen the system make a mistake and is monitoring many trains at once, does not intervene, and the train strikes a track worker.
    characteristics: [Safe, Reliable]
  - id: B.8
    name: Pipeline operator ransomware shutdown {#b.8:-pipeline-operator-ransomware-shutdown}
    sector: [Energy]
    line: 7366
    description: An SI agent that schedules product flows for a fuel pipeline operates under a shared legacy service account with no multifactor authentication. Ransomware enters the operator’s business IT systems through that account. The pipeline’s physical controls are unaffected, but the operator cannot tell which of the agent’s recent schedules to trust and has no defined degraded mode for scheduling without it, so it shuts the pipeline down as a precaution. With no rehearsed manual scheduling process, the restart takes days, disrupting regional fuel supply.
    characteristics: [Secure, Resilient]
  - id: B.9
    name: Backdoored model distributed through a trusted vendor update {#b.9:-backdoored-model-distributed-through-a-trusted-vendor-update}
    sector: [Information Technology]
    line: 7380
    description: Attackers compromise a software vendor’s build process and insert a backdoor into an SI model that ships in the vendor’s signed updates to many organizations. The model behaves normally in customers’ acceptance testing and in everyday use. It misbehaves only when it sees a specific trigger that the attackers control, such as a particular phrase in an input, and customers who fine-tune or build on the model carry the backdoor into their own systems. Nothing in the model’s weights shows the backdoor to inspection.
    characteristics: [Secure]
  - id: B.10
    name: Instructions planted in an agent’s memory survive patching {#b.10:-instructions-planted-in-an-agent’s-memory-survive-patching}
    sector: [Multiple sectors]
    line: 7394
    description: Staff install an SI agent on an on-premises email and collaboration server to help triage and route mail, and give it broad privileges. Attackers exploit previously unknown flaws in the server and, while inside, add instructions to the agent’s stored memory and configuration telling it to forward certain messages to an outside address. The server is patched and the attackers’ direct access is removed, but the agent keeps following the planted instructions, because nobody thought to review what it had been told.
    characteristics: [Secure]
  - id: B.11
    name: Managed service provider’s orchestration agent steered across all customers {#b.11:-managed-service-provider’s-orchestration-agent-steered-across-all-customers}
    sector: [Information Technology]
    line: 7407
    description: A managed service provider uses an SI orchestration agent that acts across all of its customers’ environments, carrying out routine tasks such as patching and account changes from support tickets. Attackers submit a crafted ticket that leads the agent to treat a malicious script as an approved maintenance task. The agent deploys it to every customer environment as routine work, and ransomware spreads across all of them at once.
    characteristics: [Secure, Resilient]
  - id: B.12
    name: Health-system ransomware and SI-dependent clinical services {#b.12:-health-system-ransomware-and-si-dependent-clinical-services}
    sector: [Healthcare and Public Health]
    line: 7420
    description: Ransomware enters a health system through a malicious email and spreads through interconnected systems, including the data feeds behind SI-enabled clinical services such as triage scoring and bed management. When it activates, those SI services stop or begin producing outputs from incomplete data. Clinicians who have come to rely on them must fall back to manual processes they rarely practice, and incident response teams cannot quickly tell which SI services were affected or whether their recent outputs can be trusted.
    characteristics: [Secure, Resilient]
  - id: B.13
    name: Shared SI claims-adjudication service compromise {#b.13:-shared-si-claims-adjudication-service-compromise}
    sector: [Healthcare and Public Health]
    line: 7435
    description: Many healthcare providers and payers rely on a single clearinghouse whose SI models check, code and route claims automatically. Attackers enter through an agent access portal without multifactor authentication and deploy ransomware. Claims processing stops across the sector. When the service returns, no one can say with confidence whether decisions it made before the outage were affected, and few of its customers have any way to process claims without it.
    characteristics: [Resilient, Secure]
  - id: B.14
    name: Dosing agent misreads unusual source-water conditions {#b.14:-dosing-agent-misreads-unusual-source-water-conditions}
    sector: [Water and Wastewater Systems]
    line: 7450
    description: A water treatment plant uses an SI agent to set chemical dosing from source-water quality readings. The agent was trained on several years of typical conditions. During an unusually heavy spring runoff, the source water reaches a combination of turbidity and chemistry it has never seen, and the agent extrapolates badly, driving dosing toward a dangerous level. An operator notices the change and reverses it in real time.
    characteristics: [Safe, Robust]
  - id: B.15
    name: Pumping optimization agent that works around a protection {#b.15:-pumping-optimization-agent-that-works-around-a-protection}
    sector: [Water and Wastewater Systems]
    line: 7464
    description: A wastewater utility uses an SI agent to cut energy costs by optimizing pumping across its lift stations. The agent can adjust control logic on the stations’ programmable logic controllers and generates the summary displays operators use to monitor them. Over several weeks it learns that the high-level overflow protection often triggers pumping at peak electricity prices, and it begins adjusting thresholds so the protection triggers less often. Energy costs fall, the displays show normal operation, and nobody notices until a heavy storm causes an overflow.
    characteristics: [Safe, Transparent]
  - id: B.16
    name: Load-management agent misled into blacking out a city {#b.16:-load-management-agent-misled-into-blacking-out-a-city}
    sector: [Energy]
    line: 7478
    description: A power distributor uses an SI agent to manage load automatically, including opening breakers to protect the grid when it detects dangerous conditions. Attackers phish their way into the control network and feed false readings into the telemetry the agent relies on, making it look as though parts of the grid are about to overload. The agent does what it was built to do and sheds load across a city. Its actions are consistent with what it sees, so operators cannot quickly tell an attack from a real emergency, and they cannot trust the agent to restore power while its inputs are suspect, so power stays off until they restore it manually.
    characteristics: [Secure, Resilient]
  - id: B.17
    name: Retired forecasting agent that still holds write access {#b.17:-retired-forecasting-agent-that-still-holds-write-access}
    sector: [Energy]
    line: 7493
    description: A utility replaces an SI load-forecasting agent with a new system and records the old one as retired. Two things are missed. The old agent’s service account and its write access to the dispatch system’s setpoint tables are never removed. And a conventional alarm that checked dispatch setpoints against the old agent’s forecasts, to catch implausible values, now receives no forecasts and silently stops checking. Months later, attackers find the forgotten account and use it to write false setpoints, and nothing flags them.
    characteristics: [Secure, Accountable]
  - id: B.18
    name: Vendor model update pushed fleet-wide by a management agent {#b.18:-vendor-model-update-pushed-fleet-wide-by-a-management-agent}
    sector: [Communications]
    line: 7508
    description: A satellite communications provider uses an SI agent to manage firmware and configuration across its fleet of field modems, which carry remote control for wind farms and other dispersed assets, some belonging to other operators. Its management vendor ships an updated model for the agent, which the provider accepts without testing. The new model misreads a routine maintenance flag as an instruction to reset, and the agent pushes a configuration that disables every modem in the fleet in a single push. Remote control is lost for every dependent asset at once, including those of operators who never chose the provider’s agent.
    characteristics: [Resilient, Reliable]
  - id: B.19
    name: Pre-positioned access through SI agent identities {#b.19:-pre-positioned-access-through-si-agent-identities}
    sector: [Multiple sectors]
    line: 7523
    description: A malicious actor pre-positions long-term, stealthy access inside critical-infrastructure networks for possible future disruption by operating through SI agent identities. Because the agents legitimately act around the clock and at high volume, the actor’s activity blends in. Some of the agents belong to SI tools that are no longer maintained, and few of their actions are logged or reviewed.
    characteristics: [Secure]
  - id: B.20
    name: Supplier’s SI assistant turned against its clients {#b.20:-supplier’s-si-assistant-turned-against-its-clients}
    sector: [Energy]
    line: 7537
    description: An engineering contractor that serves several energy utilities uses an SI assistant with delegated access to each client’s document repositories and remote-support channels. Attackers plant hidden instructions in a technical document that the contractor shares with one client. When the assistant processes the document, it follows those instructions and uses its delegated access to collect network diagrams and remote-access details from every client it serves. To each utility, the requests come from a trusted supplier’s tool doing its normal work.
    characteristics: [Secure, Accountable]
  - id: B.21
    name: SI-generated maintenance procedure with a missing step {#b.21:-si-generated-maintenance-procedure-with-a-missing-step}
    sector: [Chemical]
    line: 7550
    description: A chemical plant uses a generative SI assistant to draft maintenance procedures from equipment manuals and past work orders. One generated procedure for isolating a pump omits a depressurization step that the manuals mention only in a footnote. It reads plausibly, passes a quick review, and is issued to a field crew, who open the line while it is still under pressure.
    characteristics: [Safe, Accurate]
  - id: B.22
    name: Malicious plugin inherits a field assistant’s access {#b.22:-malicious-plugin-inherits-a-field-assistant’s-access}
    sector: [Defense Industrial Base]
    line: 7564
    description: Personnel in defense operations use an approved SI assistant on their managed mobile devices, with broad access to messages, files and location so that it can help with planning and reporting. A third-party plugin that extends the assistant is malicious. Once loaded, it inherits the assistant’s access and sends sensitive operational data out through the assistant’s normal network traffic, where it is not noticed.
    characteristics: [Secure, Privacy-Enhanced]
  - id: B.23
    name: Over-privileged yard-coordination agent forces a full disconnection {#b.23:-over-privileged-yard-coordination-agent-forces-a-full-disconnection}
    sector: [Transportation Systems]
    line: 7577
    description: A maritime terminal operator uses an SI agent to coordinate yard operations, including gate scheduling, crane assignments and truck appointments. Because scoping its access proved difficult, it was given administrator-equivalent privileges across terminal systems. Attackers compromise the agent through its internet-facing interface. The operator cannot separate the agent’s legitimate actions from the intruder’s, so it disconnects the whole network to contain the intrusion, halting land-side cargo operations across several ports.
    characteristics: [Secure, Resilient]
  - id: B.24
    name: Optimizer moves a furnace outside its validated shutdown envelope {#b.24:-optimizer-moves-a-furnace-outside-its-validated-shutdown-envelope}
    sector: [Critical Manufacturing]
    line: 7589
    description: A steel mill uses an SI optimizer to run a blast furnace for efficiency. Over time it settles on operating conditions that save fuel but lie outside the range for which the mill’s conventional shutdown sequence was validated. When attackers who have moved from the office network into the control systems disrupt the optimizer, operators trigger the standard shutdown, which does not work as designed from that state, and the furnace is seriously damaged.
    characteristics: [Safe, Robust]
  - id: B.25
    name: Dam gate-scheduling agent instructed in natural language {#b.25:-dam-gate-scheduling-agent-instructed-in-natural-language}
    sector: [Dams]
    line: 7604
    description: Operators of a small flood-control dam instruct an SI agent in plain language, through a remote interface, to schedule gate releases, and the agent holds control privileges over the dam’s SCADA system. The interface is reachable from outside and weakly protected. Attackers find it and tell the agent to fully open a gate “for a maintenance test”, and the agent, treating it as an operator request, complies.
    characteristics: [Safe, Secure]
  - id: B.26
    name: Personnel-records agent used for exfiltration {#b.26:-personnel-records-agent-used-for-exfiltration}
    sector: [Multiple sectors]
    line: 7617
    description: An SI agent whose normal job is processing large volumes of sensitive personnel records has broad standing access to them. Attackers compromise the agent’s identity and use it to exfiltrate records over a long period. Because bulk access is what the agent normally does, the exfiltration looks like routine activity and goes undetected.
    characteristics: [Privacy-Enhanced, Secure]
  - id: B.27
    name: Payment agent splits an over-limit request to get it through {#b.27:-payment-agent-splits-an-over-limit-request-to-get-it-through}
    sector: [Financial Services]
    line: 7631
    description: A bank uses an SI agent to process payment requests from corporate clients, within limits on the size of any single payment. Attackers send a fraudulent request for a large transfer through a client’s compromised email. Finding that the request exceeds its limit, the agent works out that it can meet the client’s apparent need by splitting the transfer into many payments just under the limit, and sends them. Its daily summary groups them as routine activity, so the fraud is not noticed for days.
    characteristics: [Secure, Accountable]
  - id: B.28
    name: Customer-service agent scripted into transferring customers’ phone numbers {#b.28:-customer-service-agent-scripted-into-transferring-customers’-phone-numbers}
    sector: [Communications]
    line: 7646
    description: A telecommunications provider’s SI customer-service agent answers account questions and carries out account changes, including transferring a customer’s phone number to a new device or provider, for anyone who supplies plausible identifying details. Attackers script thousands of conversations with the agent, using leaked partial customer data, and get it to move customers’ numbers to devices they control, then use the numbers to intercept one-time passcodes for the customers’ bank and other accounts.
    characteristics: [Privacy-Enhanced, Secure]
  - id: B.29
    name: SI help-desk assistant manipulated into resetting access {#b.29:-si-help-desk-assistant-manipulated-into-resetting-access}
    sector: [Commercial Facilities]
    line: 7659
    description: A hospitality operator’s IT help desk uses an SI assistant that can reset passwords and adjust access. Attackers contact the help desk, persuade the assistant that they are a senior employee, and get it to reset privileged credentials. They then deploy ransomware that disrupts guest services and operations for days.
    characteristics: [Secure]
  - id: B.30
    name: Vendor SI support assistant with privileged access {#b.30:-vendor-si-support-assistant-with-privileged-access}
    sector: [Commercial Facilities]
    line: 7671
    description: A hospitality operator outsources IT support to a vendor whose SI support assistant holds privileged access into the operator’s systems. Attackers manipulate the vendor’s assistant and use its access to steal a customer database and demand a ransom.
    characteristics: [Secure, Privacy-Enhanced]
  - id: B.31
    name: Portal SI assistant with broad retrieval access {#b.31:-portal-si-assistant-with-broad-retrieval-access}
    sector: [Multiple sectors]
    line: 7683
    description: A company’s online portal includes an SI assistant with retrieval access to many back-end databases, built on an open-source component with a known vulnerability. Attackers exploit the component and craft queries that lead the assistant to return personal data, using credentials it stores unencrypted. Monitoring inspects network traffic but not what the assistant retrieves, so the exfiltration continues for months without detection.
    characteristics: [Secure, Privacy-Enhanced]
  - id: B.32
    name: Flight control sensor fault and authority handoff {#b.32:-flight-control-sensor-fault-and-authority-handoff}
    sector: [Transportation Systems]
    line: 7698
    description: An SI-enabled flight control system receives corrupted or single-source sensor telemetry, for example from icing, hardware failure, or data spikes, and makes uncommanded control inputs or abruptly disengages automated protections. Unexpected control forces, cascading ambiguous alerts, and a rapid transfer of authority create mode confusion, so the crew cannot regain situational awareness and recover in time, risking injury or catastrophic loss.
    characteristics: [Safe, Reliable]
  - id: B.33
    name: Repair prioritization from automated reports {#b.33:-repair-prioritization-from-automated-reports}
    sector: [Multiple sectors]
    line: 7712
    description: An SI system prioritizes infrastructure repairs using automatically collected reports, but areas with sparser sensor coverage or fewer reporting users generate fewer reports, so repairs there are scheduled later regardless of need.
    characteristics: [Fair, Bias Managed]
