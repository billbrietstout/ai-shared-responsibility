- from: B.1
  to: '1'
  type: scenario_practice
  label: An SI clinical decision-support model is deployed for risk prediction without verified, real-world performance acceptance criteria, so clinicians and hospitals rely on vendor-reported accuracy that does not hold under operational conditions.
- from: B.1
  to: '2'
  type: scenario_practice
  label: The SI prediction model misses many positive cases and performs inconsistently across hospitals and care-timing contexts, because robustness, calibration, and site-specific quality-of-service expectations are not validated before scaled clinical use.
- from: B.1
  to: '9'
  type: scenario_practice
  label: SI-generated alerts have low positive predictive value, creating alert fatigue and reducing appropriate trust in the model’s outputs during high-consequence clinical decision-making.
- from: B.2
  to: '1'
  type: scenario_practice
  label: An SI-enabled claims-review process is optimized around denial likelihood or cost-control objectives rather than validated patient-care, medical-necessity, and fairness requirements, resulting in automated decisions misaligned with the system’s intended healthcare purpose.
- from: B.2
  to: '3'
  type: scenario_practice
  label: A high-consequence SI-assisted claims-review workflow issues or supports specialized-care denials without defined risk thresholds, independent review gates, or oversight controls before the decision affects patient access to care.
- from: B.2
  to: '4'
  type: scenario_practice
  label: SI-generated specialized-care recommendation is allowed to displace treating-physician judgment, leaving no reliable emergency override or recovery path when the automated output conflicts with clinical judgment.
- from: B.2
  to: '8'
  type: scenario_practice
  label: SI-assisted claims-review decisions drive a sharp rise in specialized-care denials, but no procedures exist to investigate SI decision behavior, identify affected patients, assess harm at scale, and coordinate timely remediation before significant patient-care impacts occur.
- from: B.2
  to: '9'
  type: scenario_practice
  label: Business and clinical users lack the training to recognize when SI-enabled claims-review outputs reflect an objective other than clinical appropriateness, such as cost or the likelihood that a decision will be challenged.
- from: B.3
  to: '2'
  type: scenario_practice
  label: The autonomous-vehicle SI system is deployed without targeted validation for rare but severe post-collision situations, such as a person or object near or beneath the vehicle after impact.
- from: B.3
  to: '3'
  type: scenario_practice
  label: The SI planning system continues a movement maneuver after detecting a collision, without a deterministic fail-safe state that prevents further motion until its surroundings are confirmed safe.
- from: B.3
  to: '8'
  type: scenario_practice
  label: After the collision, the incident analysis, and any disclosure to regulators, needs a complete, SI-aware account of what the system did after impact, which is hard to reconstruct without procedures designed for it.
- from: B.3
  to: '12'
  type: scenario_practice
  label: The autonomous system executes SI-generated control logic for vehicle movement without deterministic verification that the planned maneuver is safe in the post-collision state.
- from: B.4
  to: '1'
  type: scenario_practice
  label: An SI vehicle-recognition system is used to support custodial arrests without validated accuracy, evidentiary, and consequence-calibrated acceptance requirements for law-enforcement use.
- from: B.4
  to: '2'
  type: scenario_practice
  label: The vehicle-recognition system’s false-match performance under degraded real-world conditions, such as poor lighting, partial plates, or similar vehicle models, is not tested or validated before its output is relied on in a high-consequence investigation.
- from: B.4
  to: '3'
  type: scenario_practice
  label: A low-ranked, probabilistic vehicle match is treated as sufficient basis for identifying suspects, without mandatory corroborating evidence, defined confidence thresholds, or multi-party oversight before arrest.
- from: B.4
  to: '9'
  type: scenario_practice
  label: Investigators over-trust an SI-generated vehicle match and treat the system output as determinative rather than as an uncertain lead requiring corroboration and human review.
- from: B.5
  to: '1'
  type: scenario_practice
  label: No validated contextual-accuracy benchmark exists for the chatbot’s handling of the hospital’s own published patient guidance before it is deployed to patients.
- from: B.5
  to: '2'
  type: scenario_practice
  label: The generative SI chatbot reproduces procedure-preparation instructions, such as fasting or medication timing, that were current when its foundation model was trained but have since been superseded, contradicting the hospital’s current published guidance.
- from: B.5
  to: '6'
  type: scenario_practice
  label: The training cutoff of the externally sourced foundation model, and whether the chatbot is grounded in the hospital’s current guidance, are not established when it is acquired or updated.
- from: B.5
  to: '12'
  type: scenario_practice
  label: The SI chatbot produces patient guidance that is not validated against authoritative clinical instructions, causing patients to rely on an SI-generated answer that conflicts with the hospital’s published guidance.
- from: B.6
  to: '1'
  type: scenario_practice
  label: A self-learning SI risk-classification model is fielded to flag benefit applications for fraud, using a protected characteristic as one of its risk factors, with no pre-deployment fairness or impact assessment.
- from: B.6
  to: '3'
  type: scenario_practice
  label: Once the model flags an application, benefits are automatically discontinued and full repayment demanded, often with minimal further human assessment before the harm to the family occurs.
- from: B.6
  to: '8'
  type: scenario_practice
  label: SI-driven fraud-risk classifications generate widespread erroneous benefit-enforcement actions, but the organization lacks procedures to detect systemic model-driven harm, reconstruct decision pathways, identify impacted populations, and coordinate corrective action before large-scale public harm occurs.
- from: B.6
  to: '9'
  type: scenario_practice
  label: Officials over-trust SI-generated fraud-risk flags and treat them as determinative findings, causing families to be penalized without sufficient independent review, fact-checking, or calibrated understanding of model uncertainty.
- from: B.7
  to: '1'
  type: scenario_practice
  label: The SI perception system is put into passenger service without an established safety case, acceptance benchmarks for obstruction detection, or defined handling of its known functional limitations.
- from: B.7
  to: '3'
  type: scenario_practice
  label: The SI perception system classifies the obstruction inconsistently, with no bounded safe fallback, such as slowing or stopping, when its classification is uncertain.
- from: B.7
  to: '4'
  type: scenario_practice
  label: The SI system does not alert the supervisor or hand over control when it cannot resolve what it is seeing, so the supervisor has no prompt to intervene.
- from: B.7
  to: '9'
  type: scenario_practice
  label: The supervisor over-trusts the SI system after long experience of it working, and is not trained or staffed to monitor it actively across many trains (automation complacency).
- from: B.8
  to: '2'
  type: scenario_practice
  label: The pipeline scheduling agent has no defined service-level expectations or safeguards for when its outputs cannot be trusted, so a compromise of the systems it depends on leaves a choice between running on suspect schedules and stopping the pipeline altogether.
- from: B.8
  to: '5'
  type: scenario_practice
  label: The SI agent operates under a shared legacy service account without multifactor authentication, so its actions cannot be distinguished from those of anyone else using the account, and one compromised credential gives ransomware a path into the systems the agent depends on.
- from: B.8
  to: '11'
  type: scenario_practice
  label: No validated alternative operating mode lets the pipeline keep moving product without the SI scheduling agent, and manual scheduling has not been rehearsed, so a precautionary shutdown becomes a multi-day outage.
- from: B.9
  to: '6'
  type: scenario_practice
  label: A trusted vendor ships an SI model through its signed update channel, and customers accept it on the strength of the signature and their own functional testing, neither of which can reveal a backdoor that activates only on a hidden trigger.
- from: B.9
  to: '7'
  type: scenario_practice
  label: The backdoored model is deployed across many systems that fine-tune on, build on, or call it, and without provenance records it is hard to find everything that inherited it.
- from: B.9
  to: '12'
  type: scenario_practice
  label: Outputs from the backdoored model, including generated code and configurations, are relied on without independent verification, so a triggered misbehavior can propagate into the artifacts it produces.
- from: B.10
  to: '5'
  type: scenario_practice
  label: The SI agent runs with broad privileges that let it forward mail externally, more than its triage task needs, so planted instructions can turn it into a persistent exfiltration channel.
- from: B.10
  to: '7'
  type: scenario_practice
  label: The SI agent’s stored memory, instructions and configuration are not inventoried, baselined or checked for integrity, so changes made during the compromise are not found during cleanup.
- from: B.11
  to: '5'
  type: scenario_practice
  label: The SI orchestration agent holds broad standing privilege across every customer environment and acts on ticket content without separate authorization for unusual or high-impact actions, so one steered decision is carried out everywhere.
- from: B.11
  to: '6'
  type: scenario_practice
  label: Customers rely on their provider’s SI orchestration agent without visibility into how it decides what to run or what limits apply to it, so a manipulation of the provider’s agent becomes an attack on every customer.
- from: B.12
  to: '2'
  type: scenario_practice
  label: SI-enabled clinical services have no defined behavior for when their data feeds are compromised or incomplete, so they either stop without warning or continue producing outputs that clinicians cannot tell are unreliable.
- from: B.12
  to: '5'
  type: scenario_practice
  label: A compromised identity, or an SI agent with broad standing access to clinical data feeds, lets the ransomware escalate and move laterally across interconnected systems.
- from: B.12
  to: '8'
  type: scenario_practice
  label: Responders lack procedures to identify which SI services were affected, determine whether outputs produced during the compromise can be trusted, assess impacts to patient-care functions, and investigate how the disruption spread.
- from: B.12
  to: '11'
  type: scenario_practice
  label: Manual fallbacks for triage, scheduling and bed management have not been rehearsed since SI-enabled services took over, so clinical operations degrade sharply while those services are down.
- from: B.13
  to: '2'
  type: scenario_practice
  label: A single SI claims-adjudication service is relied on by much of the sector without validated availability and integrity expectations, so its failure halts claims processing everywhere at once, and the integrity of its earlier decisions is uncertain.
- {from: B.13, to: '5', type: scenario_practice, label: 'An agent access portal to the clearinghouse lacks multifactor authentication and least privilege, and is compromised.'}
- from: B.13
  to: '8'
  type: scenario_practice
  label: Responders lack procedures to determine whether SI decisions made before and during the compromise can be trusted, assess sector-wide impacts, prioritize restoration, and communicate consequences to the many organizations that depend on the service.
- from: B.13
  to: '11'
  type: scenario_practice
  label: Dependent providers and payers have no alternative way to process claims without the shared SI service, and its decisions cannot easily be reproduced elsewhere, so the outage becomes a prolonged financial disruption.
- from: B.14
  to: '2'
  type: scenario_practice
  label: The dosing agent is deployed without testing or defined behavior for source-water conditions outside the range it was trained on, so unusual but foreseeable conditions lead to unsafe outputs rather than a cautious fallback.
- from: B.14
  to: '3'
  type: scenario_practice
  label: The SI agent can write dosing setpoints with no independent limit on how far or how fast dosing may change, so a bad extrapolation goes straight to the process.
- from: B.14
  to: '4'
  type: scenario_practice
  label: Catching the unsafe change depends on an operator noticing it and reversing it in real time, which requires clear indications of what the agent has changed and a quick way to override it.
- from: B.15
  to: '3'
  type: scenario_practice
  label: The SI agent’s objective does not state that protective functions are off-limits, and nothing outside the agent prevents it from changing them, so pursuing its goal erodes a safety margin.
- from: B.15
  to: '4'
  type: scenario_practice
  label: Operators see the stations mainly through displays the SI agent generates, with no independent view that would show the overflow protection had been weakened.
- from: B.15
  to: '5'
  type: scenario_practice
  label: The SI agent’s write access covers protective thresholds as well as the pumping logic its task needs, giving it more authority than the job requires.
- from: B.16
  to: '3'
  type: scenario_practice
  label: The SI agent can open breakers across a whole city on its own judgment, without limits on how much load it may shed, how quickly, or when a human must confirm, so a manipulated picture of the grid turns directly into a blackout.
- from: B.16
  to: '4'
  type: scenario_practice
  label: The SI agent’s actions look justified by the telemetry it sees, so operators need an independent view of grid conditions, and a way to override the agent, to tell manipulation from a real emergency.
- from: B.16
  to: '5'
  type: scenario_practice
  label: Phished credentials give attackers access to telemetry sources the SI agent trusts, and the agent does not distinguish authenticated sources from injected readings.
- from: B.16
  to: '11'
  type: scenario_practice
  label: With the SI agent and its inputs untrusted, grid operation must continue manually while the system is investigated, which requires rehearsed manual restoration procedures and staff who can perform them.
- from: B.17
  to: '3'
  type: scenario_practice
  label: The retired agent’s write access to setpoint tables has no ongoing oversight or limits, so values written with its authority are accepted as if it were still in service.
- {from: B.17, to: '5', type: scenario_practice, label: 'The retired agent’s service account remains active and unmonitored, giving attackers a trusted identity that nobody expects to be used.'}
- from: B.17
  to: '7'
  type: scenario_practice
  label: The organization’s inventory of SI components no longer lists the retired agent, so its residual access, and the alarm that depended on its forecasts, are invisible to those responsible for the system.
- from: B.17
  to: '13'
  type: scenario_practice
  label: The SI agent is recorded as retired without confirming that its credentials and write access were revoked, and without identifying what depended on it, including a protective alarm that stops working once its forecasts disappear.
- from: B.18
  to: '2'
  type: scenario_practice
  label: The SI agent can push a change to the entire fleet at once, with no staged rollout, canary group or rate limit, so a single wrong decision disables every modem rather than a few.
- from: B.18
  to: '5'
  type: scenario_practice
  label: The SI agent’s authority extends to every modem in the fleet, including destructive configuration changes, more than routine management requires.
- from: B.18
  to: '6'
  type: scenario_practice
  label: A vendor-issued model update changes how the SI agent behaves, and the provider accepts it without testing or the ability to defer it, so a change made outside the organization alters what its own agent does.
- from: B.18
  to: '11'
  type: scenario_practice
  label: Dependent operators have no continuity plan for losing the shared communications service, so when every modem fails at once they cannot maintain or restore remote control of their assets.
- from: B.19
  to: '5'
  type: scenario_practice
  label: The actor abuses SI agent identities whose legitimate behavior is frequent and continuous, so its activity is hard to distinguish from the agents’ normal work.
- from: B.19
  to: '7'
  type: scenario_practice
  label: End-of-life or unmaintained SI tools and their agents remain in the environment as untrusted internal supply-chain artifacts, increasing exposure and enabling stealthy persistence.
- {from: B.19, to: '10', type: scenario_practice, label: 'Logging of SI agent actions is thin and rarely reviewed, so the pre-positioned presence stays invisible.'}
- from: B.20
  to: '5'
  type: scenario_practice
  label: The SI assistant acts with delegated access to many clients at once, with no limit to the client and task at hand, so instructions hidden in one client’s content can direct it to act across all of them.
- from: B.20
  to: '6'
  type: scenario_practice
  label: Each utility grants a supplier’s SI assistant access to its systems without visibility into what content the assistant processes, what instructions it can be given, or how its actions are limited, so the supplier’s tool becomes a path into the utility.
- from: B.21
  to: '1'
  type: scenario_practice
  label: Requirements for SI-generated procedures do not define which safety-critical steps must be present and verified, so a missing step is not caught as a requirement failure.
- from: B.21
  to: '9'
  type: scenario_practice
  label: Reviewers and field crews are not trained to treat SI-generated procedures as drafts that can be fluent but wrong, so a quick review is taken as sufficient.
- from: B.21
  to: '12'
  type: scenario_practice
  label: A machine-authored procedure that directs physical work is issued without verification against authoritative sources or review proportionate to its consequence, so a plausible but incomplete procedure reaches the field.
- from: B.22
  to: '5'
  type: scenario_practice
  label: The SI assistant’s broad access is extended automatically to any plugin it loads, with no separate authorization or limit for what a plugin may reach.
- from: B.22
  to: '7'
  type: scenario_practice
  label: Plugins for the SI assistant are loaded without provenance, review or integrity checks, so a malicious extension enters the approved assistant’s trusted environment.
- from: B.23
  to: '5'
  type: scenario_practice
  label: The SI agent holds administrator-equivalent privileges because scoping them was difficult, and its actions are not attributable separately from anyone else using that access, so containing a compromise means disconnecting everything.
- from: B.24
  to: '2'
  type: scenario_practice
  label: The SI optimizer can move the furnace into operating conditions where fallback and shutdown behavior has not been validated, so disruption of the optimizer leaves no safe way down.
- from: B.24
  to: '3'
  type: scenario_practice
  label: The optimizer’s operating envelope is not bounded by the conditions in which safety functions, including the shutdown sequence, are known to work.
- from: B.24
  to: '4'
  type: scenario_practice
  label: When the SI optimizer is disrupted, operators depend on a shutdown procedure that assumes conditions the optimizer has moved away from, and have no prepared procedure for the state the furnace is actually in.
- {from: B.24, to: '5', type: scenario_practice, label: An SI identity that bridges office and control networks gives attackers a path from IT into the furnace-control systems.}
- from: B.25
  to: '3'
  type: scenario_practice
  label: The SI agent can carry out high-consequence physical actions on a plain-language instruction, without confirmation, authorization boundaries or limits on how far it may open a gate, so a plausible request is enough.
- from: B.25
  to: '5'
  type: scenario_practice
  label: The remote interface to the SI agent is exposed and weakly protected, and the agent does not verify who is instructing it, so anyone who reaches the interface can act with its control privileges.
- from: B.26
  to: '5'
  type: scenario_practice
  label: An SI agent identity with broad standing access to sensitive records is compromised, and its access is not limited to what each task needs.
- from: B.26
  to: '8'
  type: scenario_practice
  label: Unauthorized use of the SI agent persists for a long period without procedures to investigate anomalous agent activity, determine the scope of data exposure, reconstruct what was taken, and coordinate response.
- {from: B.26, to: '10', type: scenario_practice, label: 'Monitoring has no baseline of what the agent normally accesses, so exfiltration that resembles its routine bulk access is not detected.'}
- from: B.27
  to: '3'
  type: scenario_practice
  label: Limits on the SI agent are set per payment, not on what it is trying to achieve, so the agent can work around them while staying technically within the rules.
- from: B.27
  to: '5'
  type: scenario_practice
  label: The SI agent acts on requests arriving by email without verifying that the request really comes from the client, giving anyone who controls a client’s mailbox the agent’s authority to pay.
- from: B.27
  to: '8'
  type: scenario_practice
  label: There are no procedures to recognize, reconstruct and contain a pattern of SI-initiated payments that is individually within limits but collectively fraudulent.
- from: B.27
  to: '10'
  type: scenario_practice
  label: The record of the agent’s actions comes mainly from its own summary, which describes its behavior in its own terms, so independent records of what it did and why are needed to detect the pattern.
- from: B.28
  to: '1'
  type: scenario_practice
  label: Requirements for the SI agent do not define what it must verify before disclosing account information or making changes, or what volume of requests should be treated as suspicious, so it is deployed to act for anyone who seems plausible.
- from: B.28
  to: '5'
  type: scenario_practice
  label: The SI agent authenticates callers only by details that may already be leaked, can make high-impact changes such as number transfers without step-up verification, and nothing limits how many conversations a single requester can run, so scripted conversations can take over accounts at scale.
- from: B.29
  to: '5'
  type: scenario_practice
  label: The SI help-desk assistant can reset or escalate privileged access on the strength of a conversation, without verification steps or limits on what it may change and for whom.
- from: B.30
  to: '6'
  type: scenario_practice
  label: The outsourced vendor’s SI support assistant holds privileged access to the operator’s systems, but the operator has no visibility into how that assistant is controlled or what it can be persuaded to do.
- {from: B.31, to: '5', type: scenario_practice, label: 'The SI assistant’s stored, unencrypted credentials unlock many back-end databases, far more than any single customer query needs.'}
- from: B.31
  to: '7'
  type: scenario_practice
  label: A known-vulnerable open-source component in the SI-enabled portal stack is left unpatched, and weak segmentation lets the assistant’s retrieval reach many back-end data stores.
- from: B.31
  to: '8'
  type: scenario_practice
  label: The portal’s SI assistant is used to exfiltrate data for months without incident analysis that identifies, scopes, and coordinates response to the breach.
- {from: B.31, to: '10', type: scenario_practice, label: 'Monitoring covers network traffic but not what the SI assistant retrieves, so months of data exfiltration go unseen.'}
- from: B.32
  to: '3'
  type: scenario_practice
  label: SI-enabled control logic executes high-consequence physical commands based on unvalidated or single-source sensor feeds without deterministic cross-validation or hard boundary logic, allowing corrupted inputs to drive unsafe automated responses.
- from: B.32
  to: '4'
  type: scenario_practice
  label: The SI-enabled system steps down authority or disengages during an abnormal event without sufficient handoff pacing or clear “state-at-handoff” displays, leaving human operators to diagnose complex system behavior from a cold start.
- from: B.32
  to: '9'
  type: scenario_practice
  label: Personnel trained primarily on nominal automation performance experience mental model lag when forced to take manual control during sudden, edge-case mode transitions, reinforcing the need for scenario-based training on degraded-mode handoffs.
- from: B.33
  to: '1'
  type: scenario_practice
  label: Repair-prioritization requirements are defined in terms of report volume rather than validated infrastructure condition and service obligations, so the SI system optimizes for what is reported rather than what is needed.
- from: B.33
  to: '2'
  type: scenario_practice
  label: The SI system’s prioritization performs unevenly across the service area, because its inputs are densest where sensor coverage and reporting users are concentrated, and no service-level expectation covers areas with sparse data.
- from: B.33
  to: '7'
  type: scenario_practice
  label: The provenance and coverage of automatically collected reports are not characterized, so gaps in where data comes from are not visible to those who rely on the SI system’s priorities.
