name: Verify knowledge layer and pages

# Runs the build/ verifiers on every push and pull request. The drift gate
# regenerates the knowledge layer and re-applies the page injectors, then fails
# if the committed output differs, so stale generated files or unmarked pages
# cannot land on develop or main.

on:
  push:
    branches: [develop, main]
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Structural check (generator --check)
        run: python3 build/generate_knowledge_layer.py --check

      - name: Knowledge layer integrity
        run: python3 build/verify_knowledge_layer.py

      - name: Page metadata and chunk markers
        run: python3 build/verify_pages.py

      - name: Attack inventory
        run: python3 build/verify_attack_inventory.py

      - name: ROCA orphan fixture tests
        run: python3 build/test_roca_orphans.py

      - name: ROCA orphan report
        run: python3 build/roca_orphans.py

      - name: PDF text cleanup
        run: node scripts/test_pdf_text.js

      - name: Threat-model prompts page Sources text
        run: python3 scripts/test_threat_model_page_sources.py

      - name: Regeneration drift gate
        run: |
          python3 build/generate_knowledge_layer.py
          python3 build/generate_whitepaper_inventory.py
          python3 build/inject_page_metadata.py
          python3 build/inject_chunk_markers.py
          if ! git diff --quiet; then
            echo "::error::Generated artifacts or page markers are out of date. Run the build/ scripts locally and commit the result."
            git --no-pager diff --stat
            exit 1
          fi
          echo "No drift. Committed artifacts match the generators."

  threat-model:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install threat-model test tools
        working-directory: tools/threat-model/tests
        run: |
          npm ci
          python3 -m pip install jsonschema pyyaml

      - name: Cascade and UI tests
        working-directory: tools/threat-model
        run: node tests/test_cascade.js

      - name: UX journey eval
        working-directory: tools/threat-model
        run: node tests/test_ux.js

      - name: Drawer and overlay layout in a real browser
        working-directory: tools/threat-model
        run: node tests/test_layout.js

      - name: Schema, catalog agreement, and export checks
        working-directory: tools/threat-model
        run: python3 tests/test_schema_export.py

  relationship-map:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Install relationship-map test tools
        working-directory: tools/relationship-map/tests
        run: npm ci

      - name: Search, control list, layer filter, basis labels, and DSGAI source links in Chrome
        working-directory: tools/relationship-map/tests
        run: node test_relationship_map.js
