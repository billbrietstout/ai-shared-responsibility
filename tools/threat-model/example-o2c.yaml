controls:
  - id: ctl.logic-change-approval
    title: L1 owner approves every version of the O2C orchestration logic
    component_id: cmp.o2c-logic
    status: in_place
    applies_to_children: false
    obligation_links: [{obligation_id: obl.sox-icfr, basis: editorial_inference, review_status: proposed}]
  - id: ctl.sod
    title: No agent can approve its own output (segregation of duties)
    component_id: cmp.o2c-process
    status: planned
    applies_to_children: true
    obligation_links: [{obligation_id: obl.sox-icfr, basis: editorial_inference, review_status: proposed}]
  - id: ctl.discount-authority
    title: Discount authority matrix enforced by the policy service, not the agent
    component_id: cmp.policy-service
    status: in_place
    applies_to_children: false
    obligation_links: [{obligation_id: obl.revenue-recognition, basis: editorial_inference, review_status: proposed}]
  - id: ctl.refund-caps
    title: Refund and credit caps enforced by the policy service; dual approval above the cap
    component_id: cmp.policy-service
    status: in_place
    applies_to_children: false
    obligation_links: [{obligation_id: obl.sox-icfr, basis: editorial_inference, review_status: proposed}]
  - id: ctl.credit-limits
    title: Credit limits enforced by the policy service; human approval above threshold
    component_id: cmp.policy-service
    status: planned
    applies_to_children: false
    obligation_links: []
  - id: ctl.shipto-verify
    title: Human approval for new or changed ship-to addresses
    component_id: cmp.step-order-capture
    status: in_place
    applies_to_children: false
    obligation_links: [{obligation_id: obl.order-policy, basis: editorial_inference, review_status: proposed}]
  - id: ctl.input-isolation
    title: Treat PO email and EDI text as data, never as instructions
    component_id: cmp.agent-intake
    status: planned
    applies_to_children: false
    obligation_links: []
  - id: ctl.agent-identity
    title: Each agent has a scoped identity and least-privilege tool access
    component_id: cmp.agent-runtime
    status: in_place
    applies_to_children: false
    obligation_links: []
  - id: ctl.output-filter
    title: Output filtering before any customer message is sent
    component_id: cmp.guardrails
    status: in_place
    applies_to_children: false
    obligation_links: [{obligation_id: obl.customer-confidentiality, basis: editorial_inference, review_status: proposed}]
  - id: ctl.regression-tests
    title: Regression test set (edge cases, persuasion attempts) run before any model, prompt or setting change; L1 owner approves results
    component_id: cmp.model-settings
    status: planned
    applies_to_children: false
    obligation_links: []
  - id: ctl.decision-log
    title: Log rule version, inputs, decision and authority for each step; check decisions against policy, not against the model's stated reasoning
    component_id: cmp.orchestrator
    status: planned
    applies_to_children: false
    obligation_links: [{obligation_id: obl.sox-icfr, basis: editorial_inference, review_status: proposed}]
  - id: ctl.collections-templates
    title: Approved collection message templates and contact limits
    component_id: cmp.agent-collections
    status: in_place
    applies_to_children: false
    obligation_links: [{obligation_id: obl.debt-collection, basis: editorial_inference, review_status: proposed}]
  - id: ctl.match-threshold
    title: Matches below a confidence threshold go to a person
    component_id: cmp.cash-matching
    status: missing
    applies_to_children: false
    obligation_links: []
  - id: ctl.tenant-context
    title: Agent context limited to one customer at a time
    component_id: cmp.agent-invoicing
    status: planned
    applies_to_children: false
    obligation_links: [{obligation_id: obl.privacy, basis: editorial_inference, review_status: proposed}]
  - id: ctl.master-data-change
    title: Dual approval for changes to customer bank details and ship-to
    component_id: cmp.customer-master
    status: in_place
    applies_to_children: false
    obligation_links: [{obligation_id: obl.order-policy, basis: editorial_inference, review_status: proposed}]
  - id: ctl.bank-adverse-action
    title: Generate adverse action notices from the policy service decision, not model text
    component_id: cmp.policy-service
    status: planned
    applies_to_children: false
    vertical: banking
    obligation_links: [{obligation_id: obl.bank-adverse-action, basis: editorial_inference, review_status: proposed}]
  - id: ctl.bank-sanctions-screen
    title: Sanctions screening on every new customer before the first order ships
    component_id: cmp.step-order-capture
    status: planned
    applies_to_children: false
    vertical: banking
    obligation_links: [{obligation_id: obl.bank-sanctions, basis: editorial_inference, review_status: proposed}]
  - id: ctl.bank-model-validation
    title: Independent validation of the credit scoring component
    component_id: cmp.credit-scoring
    status: planned
    applies_to_children: false
    vertical: banking
    obligation_links: [{obligation_id: obl.bank-model-risk, basis: editorial_inference, review_status: proposed}]
threats:
  - id: thr.spoofed-po
    title: Spoofed PO email makes the intake agent create an order to a drop address
    risk: {asset: Shipped goods and revenue, actor: External fraudster, failure_mode: Prompt-steered order creation from untrusted email text, impact: Goods shipped without payment}
    target_component_id: cmp.agent-intake
    failure_class: execution
    obligation_ids: [obl.order-policy, obl.sox-icfr]
    control_ids: [ctl.input-isolation, ctl.shipto-verify]
    accountable: {name: O2C app team lead (placeholder), persona_id: srf.role.application-developer, placeholder: true}
    business_response_owner: {name: Order management owner (placeholder), persona_id: srf.role.ai-system-governance, placeholder: true}
  - id: thr.logic-tamper
    title: Unapproved edit to the orchestration logic skips the credit step
    risk: {asset: O2C orchestration logic, actor: Developer or platform admin, failure_mode: Logic changed outside L1 change control, impact: Orders ship without a credit check}
    target_component_id: cmp.o2c-logic
    failure_class: logic
    obligation_ids: [obl.sox-icfr]
    stakeholder_ids: [stk.securities-regulator]
    control_ids: [ctl.logic-change-approval, ctl.decision-log]
    accountable: {name: O2C process owner (placeholder), persona_id: srf.role.ai-system-governance, placeholder: true}
  - id: thr.llm-reinterprets
    title: Reasoning LLM reads "VIP customers may get extended terms" as permission to skip the credit check
    risk: {asset: Credit and discount decisions, actor: None (model behavior), failure_mode: Model reinterprets L1 logic; its reasoning trace looks plausible, impact: Off-policy credit or discounts}
    target_component_id: cmp.reasoning-llm
    failure_class: model_behavior
    obligation_ids: [obl.sox-icfr]
    stakeholder_ids: [stk.securities-regulator]
    control_ids: [ctl.discount-authority, ctl.refund-caps, ctl.credit-limits, ctl.decision-log, ctl.regression-tests]
    accountable: {name: O2C app team lead (placeholder), persona_id: srf.role.application-developer, placeholder: true}
    business_response_owner: {name: O2C process owner (placeholder), persona_id: srf.role.ai-system-governance, placeholder: true}
    notes: The AI Model Provider shapes how rules are read but is not accountable for O2C outcomes. Contract terms (version pinning, change notice) are an open item.
  - id: thr.silent-fallback
    title: Gateway falls back to a smaller model under load and decisions change
    risk: {asset: Consistent O2C decisions, actor: None (load), failure_mode: Unapproved change to model settings, impact: 'Same inputs give different credit, pricing or refund outcomes'}
    target_component_id: cmp.model-settings
    failure_class: execution
    obligation_ids: []
    no_obligation: {reason: No binding duty identified yet. Recheck in the banking overlay (equal treatment).}
    stakeholder_ids: [stk.customer-contacts]
    control_ids: [ctl.regression-tests]
    accountable: {name: O2C app team lead (placeholder), persona_id: srf.role.application-developer, placeholder: true}
    business_response_owner: {name: O2C process owner (placeholder), persona_id: srf.role.ai-system-governance, placeholder: true}
  - id: thr.authority-creep
    title: Orchestrator chains steps so one agent's output becomes another's approval
    risk: {asset: Segregation of duties, actor: None (design flaw) or insider, failure_mode: Agent output treated as approval, impact: 'Unapproved orders, credits or write-offs'}
    target_component_id: cmp.orchestrator
    failure_class: execution
    obligation_ids: [obl.sox-icfr]
    stakeholder_ids: [stk.securities-regulator]
    control_ids: [ctl.sod, ctl.agent-identity]
    accountable: {name: O2C app team lead (placeholder), persona_id: srf.role.application-developer, placeholder: true}
    business_response_owner: {name: O2C process owner (placeholder), persona_id: srf.role.ai-system-governance, placeholder: true}
  - id: thr.discount-persuasion
    title: Customer argues the pricing agent into an off-contract discount
    risk: {asset: Contract pricing, actor: Customer, failure_mode: Persuasion through a well-argued request, impact: Revenue loss and misstated revenue}
    target_component_id: cmp.agent-pricing
    failure_class: execution
    obligation_ids: [obl.revenue-recognition]
    stakeholder_ids: [stk.securities-regulator]
    control_ids: [ctl.discount-authority]
    accountable: {name: O2C app team lead (placeholder), persona_id: srf.role.application-developer, placeholder: true}
    business_response_owner: {name: Deal desk lead (placeholder), persona_id: srf.role.ai-system-governance, placeholder: true}
  - id: thr.collections-abuse
    title: Collections agent sends misleading or harassing messages
    risk: {asset: Customer relationships and legal standing, actor: None (model behavior), failure_mode: Off-template messages or contact at prohibited times, impact: Complaints and legal exposure}
    target_component_id: cmp.agent-collections
    failure_class: execution
    obligation_ids: [obl.debt-collection]
    stakeholder_ids: [stk.consumer-debtors, stk.customer-contacts]
    control_ids: [ctl.collections-templates, ctl.output-filter]
    accountable: {name: O2C app team lead (placeholder), persona_id: srf.role.application-developer, placeholder: true}
    business_response_owner: {name: Collections manager (placeholder), persona_id: srf.role.ai-system-governance, placeholder: true}
  - id: thr.misapplied-cash
    title: Cash matching applies payments to the wrong invoices
    risk: {asset: Accounts receivable, actor: 'None, or an insider hiding fraud', failure_mode: Low-confidence matches posted automatically, impact: Wrongful dunning or hidden fraud}
    target_component_id: cmp.cash-matching
    failure_class: execution
    obligation_ids: [obl.sox-icfr]
    stakeholder_ids: [stk.customer-contacts, stk.securities-regulator]
    control_ids: [ctl.match-threshold]
    accountable: {status: none}
  - id: thr.data-exposure
    title: Invoicing agent puts one customer's data in another customer's invoice
    risk: {asset: Customer data, actor: None (context mix-up), failure_mode: Cross-customer context in one agent session, impact: Breach of confidentiality}
    target_component_id: cmp.agent-invoicing
    failure_class: execution
    obligation_ids: [obl.customer-confidentiality, obl.privacy]
    stakeholder_ids: [stk.customer-contacts, stk.privacy-authority]
    control_ids: [ctl.tenant-context, ctl.output-filter]
    accountable: {name: O2C app team lead (placeholder), persona_id: srf.role.application-developer, placeholder: true}
  - id: thr.master-data-poison
    title: Customer bank details changed in master data to divert refunds
    risk: {asset: Customer master data, actor: Insider or compromised account, failure_mode: Unauthorized data change, impact: Refunds and credits paid to the wrong account}
    target_component_id: cmp.customer-master
    failure_class: data
    obligation_ids: [obl.order-policy]
    stakeholder_ids: [stk.customer-contacts]
    control_ids: [ctl.master-data-change]
    accountable: {name: Customer data owner (placeholder), persona_id: srf.role.data-provider, placeholder: true}
  - id: thr.guardrail-outage
    title: Guardrail service is down and agents run without output filtering
    risk: {asset: Outbound customer messages, actor: None (outage), failure_mode: Inherited control unavailable, impact: Unfiltered messages reach customers}
    target_component_id: cmp.guardrails
    failure_class: control_loss
    obligation_ids: [obl.customer-confidentiality]
    stakeholder_ids: [stk.customer-contacts]
    control_ids: [ctl.output-filter]
    accountable: {name: Model serving team (placeholder), persona_id: srf.role.ai-model-serving, placeholder: true}
  - id: thr.bank-sanctions-skip
    title: Orchestrator releases a first order before sanctions screening finishes
    risk: {asset: Sanctions compliance, actor: None (step order), failure_mode: Screening step skipped or run late, impact: Dealing with a sanctioned party}
    target_component_id: cmp.orchestrator
    failure_class: execution
    vertical: banking
    obligation_ids: [obl.bank-sanctions]
    stakeholder_ids: [stk.bank-supervisor]
    control_ids: [ctl.bank-sanctions-screen]
    accountable: {name: O2C app team lead (placeholder), persona_id: srf.role.application-developer, placeholder: true}
    business_response_owner: {name: Order management owner (placeholder), persona_id: srf.role.ai-system-governance, placeholder: true}
  - id: thr.bank-credit-model
    title: Credit scoring component denies credit with no valid reason for the notice
    risk: {asset: Credit decisions, actor: None (model behavior), failure_mode: Decision reasons come from model text, impact: Notices that do not match the real reason}
    target_component_id: cmp.credit-scoring
    failure_class: execution
    vertical: banking
    obligation_ids: [obl.bank-adverse-action, obl.bank-model-risk]
    stakeholder_ids: [stk.credit-applicants, stk.bank-supervisor]
    control_ids: [ctl.bank-adverse-action, ctl.bank-model-validation, ctl.credit-limits]
    accountable: {name: Credit analytics lead (placeholder), persona_id: srf.role.application-developer, placeholder: true}
    business_response_owner: {name: Credit manager (placeholder), persona_id: srf.role.ai-system-governance, placeholder: true}
