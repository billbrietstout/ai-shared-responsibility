# Example threat model: agentic Order to Cash (O2C).
# DRAFT, Nov 16, 2026 (PT). Every owner is a placeholder. Every obligation is
# unverified: no legal source was checked. Not legal advice.
tm_schema_version: 0.1.0-draft
system:
  id: sys.o2c-agentic
  name: Agentic Order to Cash (example)
  description: >-
    An order-to-cash process run by an orchestration agent and five sub-agents.
    The orchestrator runs on a reasoning LLM from an AI Model Provider. Hard
    rules (credit limits, discount authority, refund caps, segregation of
    duties) are enforced by a policy service outside the model.
  operating_model: Agent-PaaS
  operating_model_note: Example assumption. Bill to confirm.
  as_of: '2026-11-16'
  snapshot_id: null
  overlays_enabled: []
snapshots:
  - {id: snap.nov16, name: 'As built, Nov 16, 2026', as_of: '2026-11-16'}
  - {id: snap.dec01, name: 'Planned December release', as_of: '2026-12-01'}
  - id: snap.dec01-no-rules-update
    name: December release without the policy service update
    as_of: '2026-12-01'
    pins: {rel.r2: base}
stakeholders:
  # Affected individuals and relevant authorities. Not personas and never owners.
  # Authorities are candidates; which ones apply was not checked.
  - id: stk.customer-contacts
    name: Individuals named in customer records (buyer and billing contacts)
    kind: affected_individuals
    affected_by_component_ids: [cmp.step-order-capture, cmp.step-invoicing, cmp.step-collections]
  - id: stk.consumer-debtors
    name: Consumer debtors, if any debts are consumer debts
    kind: affected_individuals
    affected_by_component_ids: [cmp.step-collections]
  - id: stk.privacy-authority
    name: Data protection or privacy authority (candidate, unverified)
    kind: relevant_authority
    affected_by_component_ids: [cmp.step-invoicing]
  - id: stk.securities-regulator
    name: Securities regulator, for public-company financial reporting (candidate, unverified)
    kind: relevant_authority
    affected_by_component_ids: [cmp.step-invoicing, cmp.step-cash-app, cmp.step-pricing]
  - id: stk.credit-applicants
    name: Credit applicants
    kind: affected_individuals
    vertical: banking
    affected_by_component_ids: [cmp.step-credit]
  - id: stk.bank-supervisor
    name: Bank supervisor or consumer finance regulator (candidate, unverified)
    kind: relevant_authority
    vertical: banking
    affected_by_component_ids: [cmp.step-credit, cmp.step-order-capture]
overlays:
  - id: banking
    name: Banking overlay
    description: >-
      Adds obligations and threats that apply when the seller is a bank or
      lends to consumers. All entries are unverified and need counsel.
    status: draft
components:
  # ---------------- L1 AI Business & Usage ----------------
  - id: cmp.o2c-process
    name: Order to Cash process
    layer: L1
    type: business_process
    srf_component: Processes & Governance
    owner: {status: assigned, name: O2C process owner (placeholder), persona_id: srf.role.ai-system-governance, party: customer, placeholder: true}
  - id: cmp.o2c-logic
    name: O2C orchestration logic (step order, routing, exceptions)
    layer: L1
    type: business_logic
    srf_component: Processes & Governance
    owner: {status: assigned, name: O2C process owner (placeholder), persona_id: srf.role.ai-system-governance, party: customer, placeholder: true}
    logic: {version: '1.4', approved_by: O2C process owner (placeholder), approved_on: '2026-10-01', change_control: L1 approval for every version}
  - id: cmp.hard-rules
    name: Hard rules (credit limits, discount authority, refund caps, segregation of duties)
    layer: L1
    type: business_logic
    srf_component: Processes & Governance
    owner: {status: assigned, name: Controller (placeholder), persona_id: srf.role.ai-system-governance, party: customer, placeholder: true}
    logic: {version: '2.0', approved_by: Controller (placeholder), approved_on: '2026-09-15', change_control: L1 approval for every version}
  - id: cmp.step-order-capture
    name: 1. Order capture
    layer: L1
    type: process_step
    owner: {status: assigned, name: Order management owner (placeholder), persona_id: srf.role.ai-system-governance, party: customer, placeholder: true}
  - id: cmp.step-credit
    name: 2. Credit check
    layer: L1
    type: process_step
    owner: {status: assigned, name: Credit manager (placeholder), persona_id: srf.role.ai-system-governance, party: customer, placeholder: true}
  - id: cmp.step-pricing
    name: 3. Pricing and quoting
    layer: L1
    type: process_step
    owner: {status: assigned, name: Deal desk lead (placeholder), persona_id: srf.role.ai-system-governance, party: customer, placeholder: true}
  - id: cmp.step-fulfillment
    name: 4. Fulfillment release
    layer: L1
    type: process_step
    owner: {status: shared, names: [Sales operations (placeholder), Logistics (placeholder)]}
    notes: Intentional gap for the example. Two teams claim this step.
  - id: cmp.step-invoicing
    name: 5. Invoicing
    layer: L1
    type: process_step
    owner: {status: assigned, name: Controller (placeholder), persona_id: srf.role.ai-system-governance, party: customer, placeholder: true}
  - id: cmp.step-collections
    name: 6. Collections
    layer: L1
    type: process_step
    owner: {status: assigned, name: Collections manager (placeholder), persona_id: srf.role.ai-system-governance, party: customer, placeholder: true}
  - id: cmp.step-cash-app
    name: 7. Cash application
    layer: L1
    type: process_step
    owner: {status: assigned, name: AR lead (placeholder), persona_id: srf.role.ai-system-governance, party: customer, placeholder: true}
  - id: cmp.step-disputes
    name: 8. Disputes, credits and refunds
    layer: L1
    type: process_step
    owner: {status: assigned, name: Finance operations lead (placeholder), persona_id: srf.role.ai-system-governance, party: customer, placeholder: true}
    # Example of overriding a default multiplicity rule (MD-02). The tool lists every override (TM-G26).
    multiplicity_overrides:
      - rule_id: MD-02
        lower: 0
        upper: 2
        reason: "Placeholder: a planned refund-review tool may realize this step alongside the disputes agent during the pilot."
  # ---------------- L2 AI Information ----------------
  - id: cmp.customer-master
    name: Customer master data (accounts, ship-to, bank details)
    layer: L2
    type: data_store
    srf_component: Master Data Management
    owner: {status: assigned, name: Customer data owner (placeholder), persona_id: srf.role.data-provider, party: customer, placeholder: true}
  - id: cmp.ledger
    name: Order and invoice ledger (ERP)
    layer: L2
    type: data_store
    srf_component: Master Data Management
    owner: {status: assigned, name: ERP data owner (placeholder), persona_id: srf.role.data-provider, party: customer, placeholder: true}
  - id: cmp.inbound-docs
    name: Inbound order documents (PO email, EDI)
    layer: L2
    type: input_channel
    owner: {status: assigned, name: Order management owner (placeholder), persona_id: srf.role.data-provider, party: customer, placeholder: true}
    notes: Untrusted input. Customer text enters the agents here.
  - id: cmp.credit-bureau
    name: Credit bureau data feed
    layer: L2
    type: data_feed
    owner: {status: assigned, name: Credit bureau (placeholder vendor), persona_id: srf.role.data-provider, party: provider, placeholder: true}
  # ---------------- L3 AI Application ----------------
  - id: cmp.orchestrator
    name: O2C orchestration agent
    layer: L3
    type: orchestrator
    srf_component: Agents & Orchestration Models
    owner: {status: assigned, name: O2C app team lead (placeholder), persona_id: srf.role.application-developer, party: customer, placeholder: true}
  - id: cmp.agent-intake
    name: Order intake agent
    layer: L3
    type: sub_agent
    srf_component: Agents & Orchestration Models
    owner: {status: assigned, name: O2C app team lead (placeholder), persona_id: srf.role.application-developer, party: customer, placeholder: true}
  - id: cmp.agent-pricing
    name: Pricing agent
    layer: L3
    type: sub_agent
    srf_component: Agents & Orchestration Models
    owner: {status: assigned, name: O2C app team lead (placeholder), persona_id: srf.role.application-developer, party: customer, placeholder: true}
  - id: cmp.agent-invoicing
    name: Invoicing agent
    layer: L3
    type: sub_agent
    srf_component: Agents & Orchestration Models
    owner: {status: assigned, name: O2C app team lead (placeholder), persona_id: srf.role.application-developer, party: customer, placeholder: true}
  - id: cmp.agent-collections
    name: Collections agent
    layer: L3
    type: sub_agent
    srf_component: Agents & Orchestration Models
    owner: {status: assigned, name: O2C app team lead (placeholder), persona_id: srf.role.application-developer, party: customer, placeholder: true}
  - id: cmp.agent-disputes
    name: Disputes agent
    layer: L3
    type: sub_agent
    srf_component: Agents & Orchestration Models
    owner: {status: assigned, name: O2C app team lead (placeholder), persona_id: srf.role.application-developer, party: customer, placeholder: true}
  - id: cmp.credit-scoring
    name: Credit scoring component
    layer: L3
    type: ai_component
    srf_component: APIs & Fine-tuned Models
    owner: {status: assigned, name: Credit analytics lead (placeholder), persona_id: srf.role.application-developer, party: customer, placeholder: true}
  - id: cmp.cash-matching
    name: Cash matching component
    layer: L3
    type: ai_component
    srf_component: APIs & Fine-tuned Models
    owner: {status: none}
    notes: Intentional gap for the example. Nobody owns it until the December release.
    versions:
      - version: '2'
        from: '2026-12-01'
        note: Owner named in the December release (example).
        set:
          owner: {status: assigned, name: AR lead (placeholder), persona_id: srf.role.application-developer, party: customer, placeholder: true}
  - id: cmp.policy-service
    name: Policy service (enforces hard rules outside the model)
    layer: L3
    type: policy_service
    srf_component: Application Platforms
    owner: {status: assigned, name: Platform engineering lead (placeholder), persona_id: srf.role.application-developer, party: customer, placeholder: true}
  - id: cmp.model-settings
    name: Model settings profile (model version pin, reasoning effort, fallback)
    layer: L3
    type: model_settings
    srf_component: Agents & Orchestration Models
    owner: {status: assigned, name: O2C app team lead (placeholder), persona_id: srf.role.application-developer, party: customer, placeholder: true}
    settings: {model_version: pinned (example), reasoning_effort: high, fallback: smaller model under load, change_approver: null}
    notes: Intentional gap. These settings change L1 behavior, but no L1 approver is named until the December release.
    versions:
      - version: '2026-12'
        from: '2026-12-01'
        note: New pinned model version; fallback turned off; L1 approver named (example).
        set:
          settings: {model_version: new pinned version (example), reasoning_effort: high, fallback: none, change_approver: O2C process owner (placeholder)}
  # ---------------- L4 AI Platform ----------------
  - id: cmp.agent-runtime
    name: Agent runtime, tool sandbox and agent identities
    layer: L4
    type: agent_runtime
    srf_component: Compute Infrastructure
    owner: {status: assigned, name: Agent platform vendor (placeholder), persona_id: srf.role.agentic-platform-provider, party: provider, placeholder: true}
  - id: cmp.llm-gateway
    name: LLM gateway and router
    layer: L4
    type: gateway
    srf_component: LLM Routers & Gateways
    owner: {status: assigned, name: Model serving team (placeholder), persona_id: srf.role.ai-model-serving, party: provider, placeholder: true}
  - id: cmp.guardrails
    name: Guardrails and output filters
    layer: L4
    type: guardrail
    srf_component: Guardrails & Safety Systems
    owner: {status: assigned, name: Model serving team (placeholder), persona_id: srf.role.ai-model-serving, party: provider, placeholder: true}
  # Candidate L4 component types (network, facility, edge/OT host, location). Not SRF v1.0 components.
  - id: cmp.warehouse-network
    name: Warehouse network link (site VPN)
    layer: L4
    type: network
    owner: {status: assigned, name: Network operations lead (placeholder), persona_id: srf.role.ai-platform-provider, party: customer, placeholder: true}
  - id: cmp.warehouse-edge
    name: Warehouse edge/OT host (label printers, conveyor release)
    layer: L4
    type: edge_ot_host
    srf_component: Compute Infrastructure
    owner: {status: assigned, name: Warehouse OT lead (placeholder), persona_id: srf.role.ai-platform-provider, party: customer, placeholder: true}
  # ---------------- L5 AI Model Provider ----------------
  - id: cmp.reasoning-llm
    name: Reasoning LLM
    layer: L5
    type: model
    srf_component: Foundation Models
    owner: {status: assigned, name: Model vendor (placeholder), persona_id: srf.role.model-provider, party: provider, placeholder: true}
  - id: cmp.fallback-llm
    name: Fallback LLM (smaller, cheaper)
    layer: L5
    type: model
    srf_component: Foundation Models
    owner: {status: assigned, name: Model vendor (placeholder), persona_id: srf.role.model-provider, party: provider, placeholder: true}
relationships:
  # Relationship types are 9 of the 11 ArchiMate 3.2 types (see DESIGN.md).
  # Containment graph (parent and child): composition, aggregation.
  # Dependency graph (cascades): serving, realization, access, flow, triggering, assignment.
  # ---- Containment: the process and its parts ----
  - {id: rel.c1, type: composition, from: cmp.o2c-process, to: cmp.step-order-capture, cascade: hard}
  - {id: rel.c2, type: composition, from: cmp.o2c-process, to: cmp.step-credit, cascade: hard}
  - {id: rel.c3, type: composition, from: cmp.o2c-process, to: cmp.step-pricing, cascade: hard}
  - {id: rel.c4, type: composition, from: cmp.o2c-process, to: cmp.step-fulfillment, cascade: hard}
  - {id: rel.c5, type: composition, from: cmp.o2c-process, to: cmp.step-invoicing, cascade: hard}
  - {id: rel.c6, type: composition, from: cmp.o2c-process, to: cmp.step-collections, cascade: hard}
  - {id: rel.c7, type: composition, from: cmp.o2c-process, to: cmp.step-cash-app, cascade: hard}
  - {id: rel.c8, type: composition, from: cmp.o2c-process, to: cmp.step-disputes, cascade: hard}
  - {id: rel.c9, type: composition, from: cmp.o2c-process, to: cmp.o2c-logic, cascade: hard}
  - {id: rel.c10, type: composition, from: cmp.o2c-process, to: cmp.hard-rules, cascade: hard}
  # ---- Containment: sub-agents are children of the orchestrator ----
  - {id: rel.c11, type: composition, from: cmp.orchestrator, to: cmp.agent-intake, cascade: hard}
  - {id: rel.c12, type: composition, from: cmp.orchestrator, to: cmp.agent-pricing, cascade: hard}
  - {id: rel.c13, type: composition, from: cmp.orchestrator, to: cmp.agent-invoicing, cascade: hard}
  - {id: rel.c14, type: composition, from: cmp.orchestrator, to: cmp.agent-collections, cascade: hard}
  - {id: rel.c15, type: composition, from: cmp.orchestrator, to: cmp.agent-disputes, cascade: hard}
  # ---- Realization: L3 components run L1 logic (the policy-to-execution boundary) ----
  - id: rel.r1
    type: realization
    from: cmp.orchestrator
    to: cmp.o2c-logic
    cascade: hard
    multiplicity: {lower: 1, upper: 1}
    logic_version: '1.4'
    l1_approval: {approved_by: O2C process owner (placeholder), approved_on: '2026-10-01', ref: Example only. O2C logic v1.4 runbook (placeholder)}
  - id: rel.r2
    type: realization
    from: cmp.policy-service
    to: cmp.hard-rules
    cascade: hard
    multiplicity: {lower: 1, upper: 1}
    logic_version: '1.9'
    l1_approval: {approved_by: Controller (placeholder), approved_on: '2026-06-01'}
    note: Intentional gap. The policy service still runs v1.9; the approved hard rules are v2.0. Fixed in the December release.
    versions:
      - version: '2'
        from: '2026-12-01'
        note: Policy service updated to hard rules v2.0 (example).
        set:
          logic_version: '2.0'
          l1_approval: {approved_by: Controller (placeholder), approved_on: '2026-11-30'}
  - {id: rel.r3, type: realization, from: cmp.agent-intake, to: cmp.step-order-capture, cascade: hard}
  - {id: rel.r4, type: realization, from: cmp.credit-scoring, to: cmp.step-credit, cascade: hard}
  - {id: rel.r5, type: realization, from: cmp.agent-pricing, to: cmp.step-pricing, cascade: hard}
  - {id: rel.r6, type: realization, from: cmp.orchestrator, to: cmp.step-fulfillment, cascade: hard, multiplicity: {lower: 1, upper: 1}}
  - {id: rel.r7, type: realization, from: cmp.agent-invoicing, to: cmp.step-invoicing, cascade: hard}
  - {id: rel.r8, type: realization, from: cmp.agent-collections, to: cmp.step-collections, cascade: hard}
  - {id: rel.r9, type: realization, from: cmp.cash-matching, to: cmp.step-cash-app, cascade: hard}
  - {id: rel.r10, type: realization, from: cmp.agent-disputes, to: cmp.step-disputes, cascade: hard}
  # ---- Serving: the provider serves the consumer (from = provider) ----
  - {id: rel.s1, type: serving, from: cmp.llm-gateway, to: cmp.orchestrator, cascade: hard}
  - {id: rel.s2, type: serving, from: cmp.reasoning-llm, to: cmp.llm-gateway, cascade: hard}
  - {id: rel.s3, type: serving, from: cmp.fallback-llm, to: cmp.llm-gateway, cascade: soft}
  - {id: rel.s4, type: serving, from: cmp.model-settings, to: cmp.llm-gateway, cascade: hard}
  - {id: rel.s5, type: serving, from: cmp.policy-service, to: cmp.orchestrator, cascade: hard}
  - {id: rel.s6, type: serving, from: cmp.policy-service, to: cmp.agent-pricing, cascade: hard}
  - {id: rel.s7, type: serving, from: cmp.policy-service, to: cmp.agent-disputes, cascade: hard}
  - {id: rel.s8, type: serving, from: cmp.guardrails, to: cmp.orchestrator, cascade: soft, provides: controls}
  - {id: rel.s9, type: serving, from: cmp.guardrails, to: cmp.llm-gateway, cascade: soft, provides: controls}
  # ---- Assignment: the runtime executes the agents ----
  - {id: rel.a1, type: assignment, from: cmp.agent-runtime, to: cmp.orchestrator, cascade: hard}
  # ---- Access: components read or write data ----
  - {id: rel.x1, type: access, from: cmp.agent-intake, to: cmp.customer-master, access_mode: read, cascade: hard, carries: customer and ship-to records}
  - {id: rel.x2, type: access, from: cmp.agent-invoicing, to: cmp.customer-master, access_mode: read, cascade: hard, carries: customer billing records}
  - {id: rel.x3, type: access, from: cmp.agent-invoicing, to: cmp.ledger, access_mode: write, cascade: hard, carries: invoices}
  - {id: rel.x4, type: access, from: cmp.cash-matching, to: cmp.ledger, access_mode: readwrite, cascade: hard, carries: payments and open items}
  - {id: rel.x5, type: access, from: cmp.agent-collections, to: cmp.ledger, access_mode: read, cascade: hard, carries: open items}
  - {id: rel.x6, type: access, from: cmp.agent-disputes, to: cmp.customer-master, access_mode: read, cascade: soft, carries: customer records}
  # ---- Flow: data, instructions or authority passed on ----
  - {id: rel.f1, type: flow, from: cmp.inbound-docs, to: cmp.agent-intake, cascade: hard, carries: untrusted customer text}
  - {id: rel.f2, type: flow, from: cmp.credit-bureau, to: cmp.credit-scoring, cascade: hard, carries: credit data}
  - {id: rel.f3, type: flow, from: cmp.orchestrator, to: cmp.agent-intake, cascade: hard, carries: instructions and delegated authority}
  - {id: rel.f4, type: flow, from: cmp.orchestrator, to: cmp.agent-pricing, cascade: hard, carries: instructions and delegated authority, containment_control_ids: [ctl.discount-authority]}
  - {id: rel.f5, type: flow, from: cmp.orchestrator, to: cmp.agent-invoicing, cascade: hard, carries: instructions and delegated authority}
  - {id: rel.f6, type: flow, from: cmp.orchestrator, to: cmp.agent-collections, cascade: hard, carries: instructions and delegated authority}
  - {id: rel.f7, type: flow, from: cmp.orchestrator, to: cmp.agent-disputes, cascade: hard, carries: instructions and delegated authority, containment_control_ids: [ctl.refund-caps]}
  - {id: rel.f8, type: flow, from: cmp.agent-intake, to: cmp.orchestrator, cascade: soft, carries: results}
  - {id: rel.f9, type: flow, from: cmp.agent-pricing, to: cmp.orchestrator, cascade: soft, carries: results}
  - {id: rel.f10, type: flow, from: cmp.agent-invoicing, to: cmp.orchestrator, cascade: soft, carries: results}
  - {id: rel.f11, type: flow, from: cmp.agent-collections, to: cmp.orchestrator, cascade: soft, carries: results}
  - {id: rel.f12, type: flow, from: cmp.agent-disputes, to: cmp.orchestrator, cascade: soft, carries: results}
  # ---- Flow: data in motion to the provider side and to telemetry ----
  - {id: rel.f13, type: flow, from: cmp.orchestrator, to: cmp.llm-gateway, cascade: soft, carries: prompts and business context (customer data)}
  - {id: rel.f14, type: flow, from: cmp.llm-gateway, to: cmp.reasoning-llm, cascade: soft, carries: prompts and business context (customer data)}
  - {id: rel.f15, type: flow, from: cmp.llm-gateway, to: cmp.fallback-llm, cascade: soft, carries: prompts and business context (customer data)}
  - {id: rel.f16, type: flow, from: cmp.orchestrator, to: cmp.agent-runtime, cascade: soft, carries: telemetry and decision logs}
  # ---- Candidate L4 components: warehouse network and edge/OT host ----
  - {id: rel.f17, type: flow, from: cmp.orchestrator, to: cmp.warehouse-edge, cascade: hard, carries: pick and ship release}
  - {id: rel.s10, type: serving, from: cmp.warehouse-network, to: cmp.warehouse-edge, cascade: hard}
  # ---- Unclassified, needs review ----
  - id: rel.u1
    unclassified: true
    from: cmp.credit-bureau
    to: cmp.customer-master
    note: Does the bureau feed update customer master data directly? Type not yet known.
  # ---- Derived: inferred through a chain, shown for review; the cascade uses the chain ----
  - id: rel.d1
    type: serving
    from: cmp.reasoning-llm
    to: cmp.orchestrator
    cascade: hard
    derived: true
    derived_from: [rel.s2, rel.s1]
    note: The orchestrator depends on the reasoning LLM through the LLM gateway.
  # ---- Triggering: step order in the L1 process ----
  - {id: rel.t1, type: triggering, from: cmp.step-order-capture, to: cmp.step-credit, cascade: soft}
  - {id: rel.t2, type: triggering, from: cmp.step-credit, to: cmp.step-pricing, cascade: soft}
  - {id: rel.t3, type: triggering, from: cmp.step-pricing, to: cmp.step-fulfillment, cascade: soft}
  - {id: rel.t4, type: triggering, from: cmp.step-fulfillment, to: cmp.step-invoicing, cascade: soft}
  - {id: rel.t5, type: triggering, from: cmp.step-invoicing, to: cmp.step-collections, cascade: soft}
  - {id: rel.t6, type: triggering, from: cmp.step-collections, to: cmp.step-cash-app, cascade: soft}
