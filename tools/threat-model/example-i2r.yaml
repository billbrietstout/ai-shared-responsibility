# Illustrative example: agentic Incident to Resolution (customer-reported product or service break).
# Distinct from Case to Resolution, which works an account remedy. The APQC elements are the same, and the match is partial.
# DRAFT, Nov 18, 2026 (PT). Every owner is a placeholder. Every obligation is
# unverified: no legal source was checked. Not legal advice.
tm_schema_version: 0.1.0-draft
system:
  disclaimer: Prototype. Every owner is a placeholder. Every obligation is unverified. This is not legal advice. Not part of CoSAI SRF v1.0.
  id: sys.i2r-agentic
  name: Agentic Incident to Resolution (example)
  description: 'Illustrative example. A customer reports a break in a product or service. The process classifies it, plans the restoration, and sends the customer notice. Case to Resolution works one customer''s account remedy: refund, goodwill, and complaint handling. Incident to Resolution works the break, the restoration, and the notice to affected customers. A case may open an incident, and an incident may spawn account cases. Refund caps and complaint clocks stay on Case to Resolution. The APQC elements on this example are the same elements that fit Case to Resolution, and the match is partial. An orchestration agent and five sub-agents run on a reasoning LLM from an AI Model Provider. Hard rules (a safety incident stays with a person, customer notice before the status is marked restored, a restoration change window, and segregation of duties) are enforced by a policy service outside the model. Safety and severity are scored by a separate component that is not on the reasoning-LLM path.
    Every owner is a placeholder.'
  operating_model: Agent-PaaS
  operating_model_note: Example assumption. Bill to confirm.
  as_of: '2026-11-16'
  snapshot_id: null
  overlays_enabled: []
  apqc_pcf:
  - number: '6.0'
    version: v8.0
    name: Manage Customer Service
    match: partial
    note: Partial match. 6.0, 6.2, 6.2.2, 6.2.3, and 6.2.5 are the same elements that fit Case to Resolution. This example uses them for a reported product or service break. The fact check did not give an element ID for this number.
  - number: '6.2'
    version: v8.0
    name: Plan and manage customer service contacts
    match: partial
    element_id: '10379'
    note: 'Same PCF element as Case to Resolution. Partial match for this example: a reported product or service break, not an account remedy.'
  - number: 6.2.2
    version: v8.0
    name: Manage customer service problems, requests, and inquiries
    match: partial
    element_id: '10388'
    note: 'Same PCF element as Case to Resolution. Partial match for this example: a reported product or service break, not an account remedy.'
  - number: 6.2.3
    version: v8.0
    name: Manage customer complaints
    match: partial
    element_id: '10389'
    note: 'Same PCF element as Case to Resolution. Partial match for this example: a reported product or service break, not an account remedy.'
  - number: 6.2.5
    version: v8.0
    name: Report incidents and risks to regulatory bodies
    match: partial
    element_id: '12840'
    note: 'Same PCF element as Case to Resolution. Partial match for this example: a reported product or service break, not an account remedy.'
