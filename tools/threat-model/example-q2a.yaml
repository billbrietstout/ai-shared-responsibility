# Illustrative example: Question to Answer on a managed assistant (AI-SaaS).
# Distinct from Case to Resolution on an AI service desk. No APQC element is a clean match.
# DRAFT, Nov 18, 2026 (PT). Every owner is a placeholder. Every obligation is
# unverified: no legal source was checked. Not legal advice.
tm_schema_version: 0.1.0-draft
system:
  disclaimer: Prototype. Every owner is a placeholder. Every obligation is unverified. This is not legal advice. Not part of CoSAI SRF v1.0.
  id: sys.q2a-saas
  name: Question to Answer on an AI assistant (AI-SaaS example)
  description: Illustrative example of AI-SaaS. A managed assistant answers a customer or an employee from approved documents. Case to Resolution on an AI service desk works a case through intake, identity, investigation, remedy, and escalation. Question to Answer retrieves an approved passage, checks the citation, and hands the person to a human channel when a rule requires a person. It does not open a case, issue a refund, or change an account. The customer owns the questions, the approved documents, and who may see each document. The vendor runs the assistant. Under AI-SaaS the SRF matrix shows the customer's L5 cell as N/A. Hard rules (approved sources only, a citation on every factual sentence, no restricted page in the answer, mandatory handoff, and segregation of duties) are enforced by a policy service outside the model. Entitlement is scored by a separate component that is not on the reasoning-LLM path. No APQC PCF element is a clean match. The stored rows are closest candidates,
    and each is marked no match. Every owner is a placeholder.
  operating_model: AI-SaaS
  operating_model_note: 'Example assumption: the customer subscribes to a managed question-answering assistant and loads the documents it may answer from. Bill to confirm.'
  as_of: '2026-11-16'
  snapshot_id: null
  overlays_enabled: []
  apqc_pcf:
  - number: '13.5'
    version: v7.4
    name: Develop and manage enterprise-wide knowledge management (KM) capability
    match: none
    element_id: '11073'
    note: Closest candidate, not a match. Element ID 11073 is from PCF v7.4. The v8.0 ID for 13.5 was not verified.
  - number: 13.5.1
    version: v8.0
    name: Develop KM strategy
    match: none
    element_id: '11095'
    note: Closest candidate. Not a match for this process.
  - number: 13.5.2
    version: v8.0
    name: Assess KM capabilities
    match: none
    element_id: '11096'
    note: Closest candidate. Not a match for this process.
  - number: 13.5.3
    version: v8.0
    name: Design and implement KM capabilities
    match: none
    element_id: '20965'
    note: Closest candidate. Not a match for this process.
  - number: 13.5.4
    version: v8.0
    name: Evolve and sustain KM capabilities
    match: none
    element_id: '20969'
    note: Closest candidate. Not a match for this process.
  - number: 8.4.4
