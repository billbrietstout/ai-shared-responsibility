  .bar label { display:flex; gap:6px; align-items:center; }
  main { display:grid; grid-template-columns: minmax(0,1.35fr) minmax(360px,1fr); gap:0; height: calc(100vh - 118px); }

  .rf { display:flex; gap:4px; align-items:center; }
  #side { display:flex; flex-direction:column; min-height:0; }
  nav.tabs { display:flex; flex-wrap:wrap; border-bottom:1px solid var(--line); }
  .tab { border:0; background:none; padding:9px 12px; cursor:pointer; font:inherit; border-bottom:3px solid transparent; }
  .tab[aria-selected="true"] { border-bottom-color:#2563eb; font-weight:600; }
  #panel { padding:12px 14px; overflow:auto; flex:1; }
  .band-id { font-weight:700; font-size:15px; fill:#0f172a; }
  .band-name { font-size:11px; fill:#475569; }
  .nlabel { font-size:11px; fill:#0f172a; pointer-events:none; }
  .nowner { font-size:9.5px; fill:#475569; pointer-events:none; }
  .nstate { font-size:9px; fill:#7f1d1d; font-weight:700; pointer-events:none; }
  .node { cursor:pointer; }
  .node:focus rect { stroke:#2563eb; stroke-width:3; outline:none; }
  table.kv, table.grid { border-collapse:collapse; width:100%; font-size:13px; margin:6px 0 10px; }
  table.kv th { text-align:left; vertical-align:top; width:120px; color:var(--muted); font-weight:600; padding:4px 6px; }
  table.kv td, table.grid td, table.grid th { padding:4px 6px; border-bottom:1px solid #e2e8f0; vertical-align:top; text-align:left; }
  table.grid th { background:#f1f5f9; }
  #gap-table td:first-child { white-space:nowrap; }
  .muted { color:var(--muted); } .small { font-size:12px; } .bad { color:var(--bad); font-weight:600; }
  .pill { display:inline-block; font-size:11px; padding:0 6px; border-radius:9px; background:#e2e8f0; }
  .pill.req { background:#e0e7ff; } .pill.unv { background:#fee2e2; } .pill.ver { background:#dcfce7; } .pill.ov { background:#fef3c7; }
  .st-in_place { background:#dcfce7; } .st-planned { background:#fef9c3; } .st-missing { background:#fee2e2; }
  .sev-high td { background:#fef2f2; } .sev-medium td { background:#fffbeb; }
  ul.threats li.sel { font-weight:600; }
  .roca { border:1px solid var(--line); border-radius:8px; padding:8px 10px; margin-top:8px; }
  .legend .sw { display:inline-block; width:12px; height:12px; border:1px solid #94a3b8; margin:0 4px 0 10px; vertical-align:middle; }
  .form { display:grid; gap:6px; max-width:420px; } .form label { display:grid; gap:2px; font-size:12px; }
  textarea { width:100%; font: 12px/1.35 ui-monospace, Menlo, monospace; }
  button { font:inherit; padding:4px 10px; cursor:pointer; } .danger { color:var(--bad); }
  @media (max-width: 900px) { main { grid-template-columns: 1fr; height:auto; } #graph-wrap { max-height:60vh; } }

</header>

</main>

  /* ---------- graph ---------- */
  var NW = 150, NH = 46, GX = 14, PERROW = 6, LABELW = 150, BAND_PAD = 18, ROWH = NH + 22;
  function layout(m) {
    var pos = {}, y = 10, bands = [];
    TM.LAYERS.forEach(function (L) {
      var cs = m.components.filter(function (c) { return c.layer === L.id; });
      var rows = Math.max(1, Math.ceil(cs.length / PERROW));
      var h = rows * ROWH + BAND_PAD;
      bands.push({ id: L.id, name: L.name, y: y, h: h });
      cs.forEach(function (c, i) {
        var r = Math.floor(i / PERROW), k = i % PERROW;

  function wrap(text, n) {
    var words = String(text).match(/\S+/g) || [], lines = [], cur = "";
    words.forEach(function (w) { if ((cur + " " + w).trim().length > n) { if (cur) lines.push(cur); cur = w; } else cur = (cur + " " + w).trim(); });
    if (cur) lines.push(cur);
    if (lines.length > 2) { lines = lines.slice(0, 2); lines[1] = lines[1].slice(0, n - 1) + "\u2026"; }
    return lines;
  }
  function renderGraph() {
    var m = TM.active(STATE.model), L = layout(m), svg = [];
    var cas = currentCascade(), onPath = {};
    if (cas) cas.reached.forEach(function (n) { if (n.via) onPath[n.via.edge + "|" + n.via.from] = true; });

    svg.push("<defs>");
    Object.keys(REL_STYLE).forEach(function (t) {
      svg.push('<marker id="arr-' + t + '" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="' + REL_STYLE[t].color + '"/></marker>');
    });
    svg.push("</defs>");
    L.bands.forEach(function (b, i) {
      svg.push('<rect x="0" y="' + b.y + '" width="' + L.width + '" height="' + b.h + '" fill="' + (i % 2 ? "#f8fafc" : "#f1f5f9") + '"/>');
      svg.push('<text x="10" y="' + (b.y + 22) + '" class="band-id">' + b.id + '</text><text x="10" y="' + (b.y + 40) + '" class="band-name">' + esc(b.name) + "</text>");
    });
    m.relationships.forEach(function (r, idx) {
      var rkey = r.type || "unclassified";
      if (STATE.hidden[rkey] || (r.unclassified && STATE.hidden.unclassified) || (r.derived && STATE.hidden.derived)) return;
      var a = L.pos[r.from], b = L.pos[r.to];
      if (!a || !b) return;
      var bd = TM.boundary(m, r);
      var x1 = a.x + NW / 2, y1 = a.y + NH / 2, x2 = b.x + NW / 2, y2 = b.y + NH / 2;
      // stop at box edge
      function edgePt(cx, cy, tx, ty) {
        var dx = tx - cx, dy = ty - cy; if (!dx && !dy) return [cx, cy];
        var sx = Math.abs(dx) / (NW / 2), sy = Math.abs(dy) / (NH / 2), s = Math.max(sx, sy);
        return [cx + dx / s, cy + dy / s];
      }
      var p1 = edgePt(x1, y1, x2, y2), p2 = edgePt(x2, y2, x1, y1);

      svg.push('<path class="edge' + (hot ? " hot" : "") + '" data-rel="' + esc(r.id) + '" d="M' + p1[0].toFixed(1) + "," + p1[1].toFixed(1) + " Q" + cx.toFixed(1) + "," + cy.toFixed(1) + " " + p2[0].toFixed(1) + "," + p2[1].toFixed(1) +
        '" stroke="' + st.color + '" stroke-dasharray="' + st.dash + '" stroke-width="' + (hot ? 3 : r.derived ? 0.8 : r.cascade === "soft" ? 0.9 : 1.4) + '" fill="none" opacity="' + (cas && !hot ? 0.25 : r.derived ? 0.6 : 0.85) + '"' + (r.type ? ' marker-end="url(#arr-' + (r.derived ? "derived" : r.type) + ')"' : "") + "><title>" + esc((r.derived ? "derived " : "") + (r.unclassified ? "unclassified, needs review" + (r.type ? " (tentative " + r.type + ")" : "") : r.type) + (r.cascade ? " (" + r.cascade + ")" : "") + ": " + compName(r.from) + " \u2192 " + compName(r.to) + (bd === "crosses" ? ". Crosses the customer-provider boundary." : "") + (r.derived ? ". Derived from " + (r.derived_from || []).join(" + ") + "; the cascade uses that chain." : "")) + "</title></path>");
      if (bd === "crosses") svg.push('<circle cx="' + cx.toFixed(1) + '" cy="' + cy.toFixed(1) + '" r="4" fill="#fff" stroke="' + st.color + '" stroke-width="1.5"><title>Crosses the customer-provider boundary</title></circle>');
    });
    var loweredIds = {}; if (cas) cas.lowered.forEach(function (c) { loweredIds[c.to] = true; });
    m.components.forEach(function (c) {
      var p = L.pos[c.id], st = cas && cas.nodes[c.id] ? cas.nodes[c.id].state : null;
      var fill = st ? STATE_FILL[st] : "#ffffff";
      if (!st && STATE.ownerOverlay) fill = TM.ownerIsGap(c.owner) ? "#fee2e2" : ownerColor(TM.ownerLabel(c.owner));

      wrap(c.name, 24).forEach(function (line, i) { svg.push('<text x="' + (p.x + 6) + '" y="' + (p.y + 15 + i * 13) + '" class="nlabel">' + esc(line) + "</text>"); });
      var ol = (gap ? "\u26a0 " : "") + TM.ownerLabel(c.owner), maxc = st ? 24 : 34;

      }).join("") + "</ul>" : "None. Finding: " + esc(t.no_obligation ? t.no_obligation.reason : "missing (CH-1)")) + "</td></tr>");
      h.push("<tr><th>C: Controls</th><td><ul>" + (t.control_ids || []).map(function (id) { return ctls[id] ? ctlRow(ctls[id], "on " + esc(compName(ctls[id].component_id))) : "<li class=bad>" + esc(id) + "</li>"; }).join("") + "</ul></td></tr>");
      h.push("<tr><th>A: Accountable</th><td>" + personLabel(t.accountable) + (t.business_response_owner ? "<div class=small>Decides the business response: " + personLabel(t.business_response_owner) + "</div>" : "") + "</td></tr>");
      var stkm = TM.byId(m.stakeholders);
      h.push("<tr><th>Stakeholders</th><td>" + ((t.stakeholder_ids || []).length ? "<ul>" + t.stakeholder_ids.map(function (id) { var x = stkm[id]; return x ? "<li>" + esc(x.name) + ' <span class="muted">' + esc(x.kind.replace("_", " ")) + "</span></li>" : "<li class=bad>" + esc(id) + "</li>"; }).join("") + '</ul><div class="small muted">Affected individuals and relevant authorities. Not personas and not owners.</div>' : '<span class="muted">None listed</span>') + "</td></tr></table>");
      if (t.notes) h.push('<p class="small">' + esc(t.notes) + "</p>");
      h.push('<p><a href="#" id="go-cascade">See the cascade for this threat</a></p></div>');
    }
    return h.join("");
  }
  function dataflowHTML() {
    var f = TM.dataFlows(STATE.model), m = TM.active(STATE.model), comps = TM.byId(m.components), h = [];
    function nm(id) { return esc(comps[id].name) + ' <span class="muted">(' + comps[id].layer + ")</span>"; }
    h.push("<p>Data in motion across L1 to L5, from flow links and access links (read moves data to the reader; write moves it to the data). " + f.moves.length + " moves; " +
      f.moves.filter(function (x) { return x.boundary === "crosses"; }).length + " cross the customer-provider boundary.</p>");
    h.push('<p><button id="df-graph">Show only data links in the graph</button> <button id="df-all">Show all links</button></p>');
    h.push('<h4>Moves by layer (from row to column)</h4><table class="grid" id="df-matrix"><tr><th>From \\ To</th>' + TM.LAYERS.map(function (L) { return "<th>" + L.id + "</th>"; }).join("") + "</tr>");
    TM.LAYERS.forEach(function (a) { h.push("<tr><th>" + a.id + " " + esc(a.name) + "</th>" + TM.LAYERS.map(function (b) { var n = f.matrix[a.id][b.id]; return "<td>" + (n || "") + "</td>"; }).join("") + "</tr>"); });
    h.push('</table><p class="small muted">L1 holds no data components in this model, so L1 shows through the "Serves L1" column below: the steps or logic that the moving component realizes.</p>');
    h.push('<h4>Moves</h4><table class="grid" id="df-moves"><tr><th>From</th><th>To</th><th>What</th><th>How</th><th>Serves L1</th><th>Boundary</th></tr>');
    f.moves.forEach(function (x) {
      h.push("<tr><td>" + nm(x.from) + "</td><td>" + nm(x.to) + "</td><td>" + esc(x.what) + "</td><td>" + x.how + "</td><td>" + x.l1.map(function (id) { return esc(comps[id].name); }).join("<br>") + "</td><td" + (x.boundary === "crosses" ? ' class="bad"' : "") + ">" + x.boundary + "</td></tr>");
    });
    h.push('</table><h4>Paths from data sources</h4><ol class="small" id="df-paths">');
    f.paths.forEach(function (p) { h.push("<li>" + p.map(nm).join(" \u2192 ") + "</li>"); });
    h.push("</ol>");
    return h.join("");
  }
  function gapsHTML() {
    var g = TM.gaps(STATE.model), h = [];
    var counts = { high: 0, medium: 0, low: 0, info: 0 }; g.forEach(function (x) { counts[x.severity]++; });
    h.push("<p>" + g.length + " findings: " + counts.high + " high, " + counts.medium + " medium, " + counts.low + " low, " + counts.info + " info.</p>");
    h.push('<table class="grid" id="gap-table"><tr><th>Rule</th><th>Severity</th><th>Finding</th></tr>');
    g.forEach(function (x) {
      var link = x.refs.filter(function (r) { return /^cmp\./.test(r); })[0];
      h.push('<tr class="sev-' + x.severity + '"><td>' + x.rule + "</td><td>" + x.severity + "</td><td>" + esc(x.message) + (link ? ' <a href="#" data-cmp="' + link + '">show</a>' : "") + "</td></tr>");
    });
    h.push("</table>");
    h.push('<p class="small muted">Rules: G01 no owner; G02 shared owner; G03 persona check; G04 logic and execution owners differ on a realization link; G05 threat with no single accountable; G06 accountable differs from target owner; G07 no obligation finding; G08 broken reference; G09 model settings without an L1 approver; G10 logic without an approved version; G11 parent-child cycle; G12 no control in place; G13 unverified obligations; G14 parent-child link across layers; G15 placeholder owners; G16 no relationships; G17 owner side conflicts with the SRF matrix; G18 multiplicity out of range (a default rule MD-01 to MD-05, or a range on a link); G19 L1 step with no realizing component; G20 realization runs a logic version other than the approved one; G21 customer-provider boundary; G22 unclassified link; G23 snapshot pins a version that does not exist; G24 threat reaches L1 but lists no stakeholders; G25 candidate L4 type; G26 default multiplicity rule overridden; G27 derived link.</p>');
    h.push('<h3>Default multiplicity rules</h3><table id="mult-table"><tr><th>Rule</th><th>Default</th><th>Range</th><th>Model rule</th></tr>' + TM.DEFAULT_MULTIPLICITY.map(function (d) {
      var r = TM.multiplicityRule(TM.active(STATE.model), d.id, null);
      return "<tr><td>" + d.id + "</td><td>" + esc(d.text) + "</td><td>" + (r.off ? "off" : r.lower + ".." + (r.upper == null ? "*" : r.upper)) + "</td><td>" + (r.source === "default" ? "default" : esc("changed" + (r.reason ? ": " + r.reason : ""))) + "</td></tr>";
    }).join("") + '</table><p class="small muted">Change a rule for the whole model in multiplicity_rules, or for one component in multiplicity_overrides. A range stated on a link wins for that link type and target. Each override is listed as TM-G26.</p>');
    return h.join("");
  }
  function opts(list, sel) { return list.map(function (v) { var val = typeof v === "string" ? v : v[0], lab = typeof v === "string" ? v : v[1]; return '<option value="' + esc(val) + '"' + (val === sel ? " selected" : "") + ">" + esc(lab) + "</option>"; }).join(""); }
  function editHTML() {
    var m = STATE.model, comps = m.components.map(function (c) { return [c.id, c.layer + " " + c.name]; });
    var personas = Object.keys(TM.PERSONAS).map(function (k) { return [k, TM.PERSONAS[k].name]; });
    var c = TM.byId(m.components)[STATE.selected], h = [];
    h.push('<h4>Add a component</h4><form id="f-comp" class="form">');
    h.push('<label>ID <input name="id" placeholder="cmp.my-component" required pattern="cmp\\.[a-z0-9-]+"></label>');
    h.push('<label>Name <input name="name" required></label>');
    h.push('<label>Layer <select name="layer">' + opts(TM.LAYERS.map(function (l) { return [l.id, l.id + " " + l.name]; })) + "</select></label>");
    h.push('<label>Type <select name="type">' + opts(TM.COMPONENT_TYPES) + "</select></label>");
    h.push('<label>Owner status <select name="ostatus">' + opts([["assigned", "One owner"], ["none", "No owner"], ["shared", "Shared (records a gap)"]]) + "</select></label>");
    h.push('<label>Owner name(s) <input name="oname" placeholder="One name, or names joined by + for shared"></label>');
    h.push('<label>Owner persona <select name="persona">' + opts(personas) + "</select></label>");
    h.push('<label>Party <select name="party">' + opts(["customer", "provider"]) + "</select></label>");
    h.push('<label><input type="checkbox" name="placeholder" checked> Owner is a placeholder</label>');
    h.push('<button type="submit">Add component</button></form>');
    h.push('<h4>Add a relationship</h4><form id="f-rel" class="form">');
    h.push('<label>From <select name="from">' + opts(comps, STATE.selected) + "</select></label>");
    h.push('<label>Type <select name="type">' + opts(TM.REL_TYPES.filter(function (t) { return t !== "influence"; }).map(function (t) { return [t, t + ": " + TM.REL_INFO[t].plain]; })) + "</select></label>");
    h.push('<label>To <select name="to">' + opts(comps) + "</select></label>");
    h.push('<label><input type="checkbox" name="unclassified"> Unclassified, needs review (type unknown or tentative)</label>');
    h.push('<label>Cascade <select name="cascade">' + opts([["hard", "hard: a failure crosses as a failure"], ["soft", "soft: only degrades the target"]]) + "</select></label>");
    h.push('<label>Access mode (access only) <select name="access_mode">' + opts([["", "n/a"], "read", "write", "readwrite"]) + "</select></label>");
    h.push('<label><input type="checkbox" name="provides_controls"> Serving provides controls (the consumer inherits them)</label>');
    h.push('<label>Logic version (realization of L1 logic) <input name="logic_version"></label>');
    h.push('<label>L1 approval by (realization) <input name="approved_by"></label>');
    h.push('<button type="submit">Add relationship</button></form>');
    if (c) {
      h.push("<h4>Selected: " + esc(c.name) + '</h4><button id="del-comp" class="danger">Delete this component and its relationships</button>');
    }
    h.push('<h4>Import</h4><p class="small muted">Paste JSON that follows threat-model.schema.json.</p><textarea id="import-text" rows="5"></textarea><br><button id="do-import">Load JSON</button> <button id="reset">Reset to the selected example</button> <span id="import-msg" class="small"></span>');
    return h.join("");
  }
  function exportHTML() {
    return '<p>Export the whole model, including records in overlays that are off.</p><button id="exp-json">JSON</button> <button id="exp-yaml">YAML</button> <a id="dl" download="threat-model.json" href="#" class="small">Download</a><textarea id="export-text" rows="18" readonly></textarea>';
  }
  function exportModel() { var m = clone(STATE.model); return m; }
  function doExport(kind) {
    var m = exportModel(), text = kind === "yaml" ? TM.toYAML(m) + "\n" : JSON.stringify(m, null, 2);
    $("export-text").value = text;
    var a = $("dl"); a.setAttribute("download", "threat-model." + (kind === "yaml" ? "yaml" : "json"));
    try { a.href = URL.createObjectURL(new Blob([text], { type: kind === "yaml" ? "text/yaml" : "application/json" })); } catch (e) { a.href = "data:text/plain;charset=utf-8," + encodeURIComponent(text); }
    return text;
  }
  window.TM_EXPORT = doExport;

  function render() {
    renderGraph();
    var tabs = { details: detailsHTML, cascade: cascadeHTML, threats: threatsHTML, dataflow: dataflowHTML, gaps: gapsHTML, edit: editHTML, "export": exportHTML };
    Array.prototype.forEach.call(doc.querySelectorAll(".tab"), function (b) { b.setAttribute("aria-selected", b.getAttribute("data-tab") === STATE.tab ? "true" : "false"); });
    $("panel").innerHTML = tabs[STATE.tab]();
    $("gap-count").textContent = String(TM.gaps(STATE.model).filter(function (g) { return g.severity === "high" || g.severity === "medium"; }).length);
    wirePanel();
  }
  function wirePanel() {
    Array.prototype.forEach.call($("panel").querySelectorAll("[data-thr]"), function (a) { a.addEventListener("click", function (e) { e.preventDefault(); selectThreat(a.getAttribute("data-thr")); }); });
    Array.prototype.forEach.call($("panel").querySelectorAll("[data-cmp]"), function (a) { a.addEventListener("click", function (e) { e.preventDefault(); STATE.tab = "details"; selectComponent(a.getAttribute("data-cmp")); }); });
    var dg = $("df-graph"); if (dg) dg.addEventListener("click", function () {
      TM.REL_TYPES.concat(["unclassified", "derived"]).forEach(function (t) { STATE.hidden[t] = !(t === "flow" || t === "access"); });
      syncFilters(); renderGraph();
    });
    var da = $("df-all"); if (da) da.addEventListener("click", function () { STATE.hidden = {}; syncFilters(); renderGraph(); });
    var gc = $("go-cascade"); if (gc) gc.addEventListener("click", function (e) { e.preventDefault(); STATE.tab = "cascade"; render(); });
    var fc = $("f-comp");
    if (fc) fc.addEventListener("submit", function (e) {
      e.preventDefault();
      var f = function (n) { return fc.querySelector('[name="' + n + '"]'); }, id = f("id").value.trim();
      if (!/^cmp\.[a-z0-9-]+$/.test(id) || TM.byId(STATE.model.components)[id]) { alert("Use a new ID like cmp.my-component."); return; }
      var owner;
      if (f("ostatus").value === "none") owner = { status: "none" };
      else if (f("ostatus").value === "shared") owner = { status: "shared", names: (f("oname").value.match(/[^+]+/g) || []).map(function (s) { return s.trim(); }).filter(Boolean) };
      else owner = { status: "assigned", name: f("oname").value.trim() || "Unnamed (placeholder)", persona_id: f("persona").value, party: f("party").value, placeholder: f("placeholder").checked };
      STATE.model.components.push({ id: id, name: f("name").value.trim() || id, layer: f("layer").value, type: f("type").value, owner: owner });
      STATE.selected = id; render();
    });
    var fr = $("f-rel");
    if (fr) fr.addEventListener("submit", function (e) {
      e.preventDefault();
      var f = function (n) { return fr.querySelector('[name="' + n + '"]'); }, n = 1, ids = TM.byId(STATE.model.relationships);
      while (ids["rel.u" + n] || ids["rel.n" + n]) n++;
      if (f("from").value === f("to").value) { alert("Pick two different components."); return; }
      var rel = { id: "rel.u" + n, type: f("type").value, from: f("from").value, to: f("to").value, cascade: f("cascade").value };
      if (f("unclassified").checked) rel.unclassified = true;
      if (rel.type === "influence") { alert("Influence links go from an obligation to a control. Add them to the control's obligation links in JSON."); return; }
      if (rel.type === "access" && f("access_mode").value) rel.access_mode = f("access_mode").value;
      if (rel.type === "serving" && f("provides_controls").checked) rel.provides = "controls";
      if (rel.type === "realization") {
        if (f("logic_version").value.trim()) rel.logic_version = f("logic_version").value.trim();
        if (f("approved_by").value.trim()) rel.l1_approval = { approved_by: f("approved_by").value.trim(), approved_on: STATE.model.system.as_of };
      }
      STATE.model.relationships.push(rel);
      render();
    });
    var dc = $("del-comp");
    if (dc) dc.addEventListener("click", function () {
      var id = STATE.selected;
      STATE.model.components = STATE.model.components.filter(function (c) { return c.id !== id; });
      STATE.model.relationships = STATE.model.relationships.filter(function (r) { return r.from !== id && r.to !== id; });
      STATE.selected = null; render();
    });
    var di = $("do-import");
    if (di) di.addEventListener("click", function () {
      try { var m = JSON.parse($("import-text").value); if (!m.components || !m.relationships || !m.system) throw new Error("missing system, components or relationships"); ["obligations", "controls", "threats"].forEach(function (k) { m[k] = m[k] || []; }); load(m); }
      catch (err) { $("import-msg").textContent = "Could not load: " + err.message; }
    });
    var rs = $("reset"); if (rs) rs.addEventListener("click", function () { load(EXAMPLE()); });
    var ej = $("exp-json"); if (ej) ej.addEventListener("click", function () { doExport("json"); });
    var ey = $("exp-yaml"); if (ey) ey.addEventListener("click", function () { doExport("yaml"); });
  }
  function syncFilters() {
    Array.prototype.forEach.call(doc.querySelectorAll("#rel-filters input"), function (cb) { cb.checked = !STATE.hidden[cb.getAttribute("data-rel")]; });
  }
  var EXAMPLE_CATALOG = [
    { id: "o2c", name: "Order to Cash (O2C)", el: "example-data" },
    { id: "p2p", name: "Procure to Pay (P2P)", el: "example-data-p2p" },
    { id: "h2r", name: "Hire to Retire (H2R)", el: "example-data-h2r" },
    { id: "r2r", name: "Record to Report (R2R)", el: "example-data-r2r" },
    { id: "case", name: "Case to Resolution", el: "example-data-case" }
  ];
  function exampleRecord(id) {
    var i, rec = EXAMPLE_CATALOG[0];
    for (i = 0; i < EXAMPLE_CATALOG.length; i++) if (EXAMPLE_CATALOG[i].id === id) rec = EXAMPLE_CATALOG[i];
    return rec;
  }
  function EXAMPLE() { return JSON.parse($(exampleRecord(STATE.exampleId || "o2c").el).textContent); }
  function renderOverlayToggles() {
    var box = $("overlay-controls"); if (!box) return;
    var s = STATE.model.system, enabled = s.overlays_enabled || [];
    box.innerHTML = (STATE.model.overlays || []).map(function (o) {
      var on = enabled.indexOf(o.id) >= 0;
      return '<label><input type="checkbox" class="ov-toggle" data-overlay="' + esc(o.id) + '"' + (on ? " checked" : "") + "> " + esc(o.name) + " (unverified)</label>";
    }).join("");
    Array.prototype.forEach.call(box.querySelectorAll(".ov-toggle"), function (cb) {
      cb.addEventListener("change", function () {
        var id = cb.getAttribute("data-overlay");
        var en = (STATE.model.system.overlays_enabled || []).filter(function (x) { return x !== id; });
        if (cb.checked) en.push(id);
        STATE.model.system.overlays_enabled = en;
        if (STATE.selectedThreat && !TM.byId(TM.active(STATE.model).threats)[STATE.selectedThreat]) STATE.selectedThreat = null;
        render();
      });
    });
  }

  function init() {
    $("om").innerHTML = opts(TM.OPERATING_MODELS);
    $("rel-filters").innerHTML = '<span class="muted" title="One graph: every link below takes part in the cascade.">Parent-child (rolls impact up):</span>' + ["composition", "aggregation"].concat(['|']).concat(TM.REL_TYPES.filter(function (t) { return TM.REL_INFO[t].kind === "dependency"; })).concat(["unclassified", "derived"]).map(function (t) {
      if (t === "|") return '<span class="muted">Dependency:</span>';
      if (t === "unclassified" || t === "derived") return '<label class="rf"><input type="checkbox" data-rel="' + t + '" checked><svg width="26" height="8"><line x1="0" y1="4" x2="26" y2="4" stroke="' + REL_STYLE[t].color + '" stroke-width="2" stroke-dasharray="' + REL_STYLE[t].dash + '"/></svg>' + t + '</label>';
      return '<label class="rf"><input type="checkbox" data-rel="' + t + '" checked><svg width="26" height="8"><line x1="0" y1="4" x2="26" y2="4" stroke="' + REL_STYLE[t].color + '" stroke-width="2" stroke-dasharray="' + REL_STYLE[t].dash + '"/></svg><span title="' + esc(TM.REL_INFO[t].plain) + '">' + t + "</span></label>";
    }).join("");
    Array.prototype.forEach.call(doc.querySelectorAll("#rel-filters input"), function (cb) { cb.addEventListener("change", function () { STATE.hidden[cb.getAttribute("data-rel")] = !cb.checked; renderGraph(); }); });
    Array.prototype.forEach.call(doc.querySelectorAll(".tab"), function (b) { b.addEventListener("click", function () { STATE.tab = b.getAttribute("data-tab"); render(); }); });
    $("om").addEventListener("change", function () { STATE.model.system.operating_model = $("om").value; render(); });
    $("as-of").addEventListener("change", function () { STATE.model.system.as_of = $("as-of").value; render(); });
    $("snap").addEventListener("change", function () { STATE.model.system.snapshot_id = $("snap").value || null; render(); });
    $("mode").addEventListener("change", function () { STATE.mode = $("mode").value; render(); });
    $("example-pick").innerHTML = EXAMPLE_CATALOG.map(function (e) { return '<option value="' + e.id + '">' + esc(e.name) + "</option>"; }).join("");
    $("example-pick").addEventListener("change", function () {
      STATE.exampleId = $("example-pick").value;
      load(EXAMPLE());
    });
    $("owner-ov").addEventListener("change", function () { STATE.ownerOverlay = $("owner-ov").checked; renderGraph(); });
    $("clear").addEventListener("click", function () { STATE.selected = null; STATE.selectedThreat = null; render(); });
    // Optional deep link: #example=p2p or #select=cmp.x or #threat=thr.x, plus &tab=cascade&mode=controls&overlay=banking
    var hp = {}; (location.hash.slice(1).match(/[^&]+/g) || []).forEach(function (kv) { var i = kv.indexOf("="); if (i > 0) hp[kv.slice(0, i)] = decodeURIComponent(kv.slice(i + 1)); });
    STATE.exampleId = exampleRecord(hp.example).id;
    $("example-pick").value = STATE.exampleId;
    load(EXAMPLE());
    if (hp.mode === "controls") { STATE.mode = "controls"; $("mode").value = "controls"; }
    if (hp.snapshot) { STATE.model.system.snapshot_id = hp.snapshot; $("snap").value = hp.snapshot; }
    if (hp.overlay) {
      var known = (STATE.model.overlays || []).some(function (o) { return o.id === hp.overlay; });
      if (known) STATE.model.system.overlays_enabled = [hp.overlay];
    }
    if (hp.owners === "1") { STATE.ownerOverlay = true; $("owner-ov").checked = true; }
    if (hp.threat) selectThreat(hp.threat); else if (hp.select) selectComponent(hp.select);
    if (hp.tab) { STATE.tab = hp.tab; render(); }
    syncHeader();
  }
  window.TM_UI = { load: load, selectComponent: selectComponent, selectThreat: selectThreat, render: render, state: STATE, EXAMPLE_CATALOG: EXAMPLE_CATALOG, EXAMPLE: EXAMPLE };
  if (doc.readyState === "loading") doc.addEventListener("DOMContentLoaded", init); else init();
})();

</script>
</body>
</html>
