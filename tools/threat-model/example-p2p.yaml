# Example threat model: agentic Procure to Pay (P2P).
# DRAFT, Nov 16, 2026 (PT). Every owner is a placeholder. Every obligation is
# unverified: no legal source was checked. Not legal advice.
tm_schema_version: 0.1.0-draft
system:
  disclaimer: Prototype. Every owner is a placeholder. Every obligation is unverified. This is not legal
    advice. Not part of CoSAI SRF v1.0.
  id: sys.p2p-agentic
  name: Agentic Procure to Pay (example)
  description: A procure-to-pay process run by an orchestration agent and five sub-agents. The orchestrator
    runs on a reasoning LLM from an AI Model Provider. Hard rules (approval thresholds, three-way match,
    payment authority, segregation of duties) are enforced by a policy service outside the model. Vendor
    eligibility is scored by a separate component that is not on the reasoning-LLM path.
  operating_model: Agent-PaaS
  operating_model_note: Example assumption. Bill to confirm.
  as_of: '2026-11-16'
  snapshot_id: null
  overlays_enabled: []
snapshots:
- id: snap.nov16
  name: As built, Nov 16, 2026
  as_of: '2026-11-16'
- id: snap.dec01
  name: Planned December release
  as_of: '2026-12-01'
