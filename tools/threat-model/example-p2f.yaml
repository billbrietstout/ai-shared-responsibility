# Illustrative example: agentic Plan to Fulfill (supply and logistics).
# Hands allocated stock to Order to Cash when a sales order consumes it. APQC match is partial.
# DRAFT, Nov 18, 2026 (PT). Every owner is a placeholder. Every obligation is
# unverified: no legal source was checked. Not legal advice.
tm_schema_version: 0.1.0-draft
system:
  disclaimer: Prototype. Every owner is a placeholder. Every obligation is unverified. This is not legal advice. Not part of CoSAI SRF v1.0.
  id: sys.p2f-agentic
  name: Agentic Plan to Fulfill (example)
  description: Illustrative example. Planning and logistics decide what stock to hold, where to move it, and which shipment to release. Order to Cash owns the customer order, the price, the invoice, and the cash. Plan to Fulfill hands off when a sales order consumes allocated stock. An orchestration agent and five sub-agents run on a reasoning LLM from an AI Model Provider. Hard rules (a safety-stock floor, no release of an ineligible lot, allocation caps, and segregation of duties) are enforced by a policy service outside the model. Lot eligibility is scored by a separate component that is not on the reasoning-LLM path. The warehouse edge host is a candidate L4 type. Every owner is a placeholder.
  operating_model: Agent-PaaS
  operating_model_note: Example assumption. Bill to confirm.
  as_of: '2026-11-16'
  snapshot_id: null
  overlays_enabled: []
  apqc_pcf:
  - number: '4.0'
    version: v8.0
    name: Manage Supply Chain for Physical Products
    match: partial
    note: Partial match. The fact check did not give an element ID for this number.
  - number: '4.1'
    version: v7.4
    name: Plan for and align supply chain resources
    match: partial
    element_id: '10215'
    note: Element ID is from PCF v7.4. The v8.0 ID was not verified.
  - number: '4.2'
    version: v7.4
    name: Procure materials and services
    match: partial
    element_id: '10216'
    note: Element ID is from PCF v7.4. The v8.0 ID was not verified.
  - number: '4.3'
    version: v7.4
    name: Produce/Assemble/Test product
    match: partial
    element_id: '10217'
    note: v7.4 name and ID. The v8.0 name of 4.3 was not verified, so it is not stored.
  - number: '4.4'
    version: v7.4
    name: Manage logistics and warehousing
    match: partial
    element_id: '10219'
    note: Element ID is from PCF v7.4. The v8.0 ID was not verified.
  - number: 4.4.5
    version: v8.0
    name: Deliver last mile delivery services
    match: partial
    element_id: '21617'
