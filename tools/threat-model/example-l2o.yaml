# Illustrative example: agentic Lead to Order (marketing and sales).
# Hands an accepted quote to Order to Cash. APQC rows are on system.apqc_pcf.
# DRAFT, Nov 18, 2026 (PT). Every owner is a placeholder. Every obligation is
# unverified: no legal source was checked. Not legal advice.
tm_schema_version: 0.1.0-draft
system:
  disclaimer: Prototype. Every owner is a placeholder. Every obligation is unverified. This is not legal advice. Not part of CoSAI SRF v1.0.
  id: sys.l2o-agentic
  name: Agentic Lead to Order (example)
  description: Illustrative example. A marketing and sales process takes a lead through consent, qualification, a proposal, and a quote, then hands an accepted quote to Order to Cash for order capture. An orchestration agent and five sub-agents run on a reasoning LLM from an AI Model Provider. Hard rules (consent before outreach, a price floor, discount caps, no order without an accepted quote, and segregation of duties) are enforced by a policy service outside the model. Consent and suppression are scored by a separate component that is not on the reasoning-LLM path. Every owner is a placeholder.
  operating_model: Agent-PaaS
  operating_model_note: Example assumption. Bill to confirm.
  as_of: '2026-11-16'
  snapshot_id: null
  overlays_enabled: []
  apqc_pcf:
  - number: '3.0'
    version: v8.0
    name: Market and Sell Products and Services
    match: clean
    note: The fact check did not give an element ID for this number.
  - number: '3.3'
    version: v8.0
    name: Develop and manage marketing plans
    match: clean
    element_id: '20008'
    note: Lead generation sits in this group.
  - number: '3.5'
    version: v8.0
    name: Develop and manage sales plans
    match: clean
    element_id: '10105'
  - number: 3.5.1
    version: v8.0
    name: Manage leads/opportunities
    match: clean
    element_id: '10182'
  - number: 3.5.3
    version: v8.0
    name: Develop and manage sales proposals, bids, and quotes
    match: clean
    element_id: '11779'
  - number: 3.5.4
    version: v8.0
    name: Manage sales orders
    match: clean
    element_id: '10185'
    note: Shared with Order to Cash, which also uses 3.5.4. In this example the hand-off step has one owner, Sales operations owner (placeholder). That owner releases an accepted quote. Order to Cash owns the order after the hand-off.
